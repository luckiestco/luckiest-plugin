<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<!-- reel recipe (luckiest-video-studio-reel). Beat-locked brand reel: the motif bounces, becomes type, multiplies
     into a grid, and lands as the period of the wordmark. Fill {{paper}} {{ink}} {{accent}} {{display}} {{mono}} from
     brand.md, {{BRAND}} {{PHRASE}} {{WORDMARK}} {{TAGLINE}} from the brief, {{BPM}} and {{DUR}} from the beat sheet.
     Every time is B(n) beats; change PERIOD and the whole reel re-times.
     Laid out from --cx/--cy (the safe-area center), so it renders landscape, vertical, and square from this one file. -->
<meta charset="UTF-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
:root{--paper:{{paper}};--ink:{{ink}};--acc:{{accent}}}
/* Master size defaults. render-scenes.mjs appends the real --w, --h, --u and safe tokens for each format. */
:root{--w:1920px;--h:1080px;--u:10.8px;--safe-t:54px;--safe-b:54px;--safe-l:96px;--safe-r:96px}
:root{--cx:calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2);--cy:calc(var(--safe-t) + (var(--h) - var(--safe-t) - var(--safe-b)) / 2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--ink)}
#root{position:relative;width:100%;height:100%;overflow:hidden}
.layer{position:absolute;inset:0}
.bg{background:var(--ink)}
#pbg{background:var(--paper);opacity:0}
#dot{position:absolute;left:calc(var(--cx) - 24px);top:0;width:48px;height:48px;border-radius:50%;background:var(--acc)}
#ground{position:absolute;left:calc(var(--cx) - 200px);top:calc(var(--cy) + 160px);width:400px;height:2px;background:var(--paper);opacity:.35}
#phrase{position:absolute;top:calc(var(--cy) - var(--u)*11);left:var(--safe-l);right:var(--safe-r);text-align:center;font:800 150px/1 {{display}},Inter,system-ui,sans-serif;color:var(--ink);letter-spacing:-.02em}
#phrase span{display:inline-block}
#phrase .w{white-space:nowrap}
#grid{position:absolute;inset:0}
#grid i{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--acc)}
#lock{position:absolute;top:calc(var(--cy) - var(--u)*12);left:var(--safe-l);right:var(--safe-r);text-align:center;color:var(--paper)}
#word{font:800 170px/1 {{display}},Inter,system-ui,sans-serif;letter-spacing:-.03em}
#word b{display:inline-block;width:.28em;height:.28em;border-radius:50%;background:var(--acc);margin-left:.06em}
#rule{width:560px;height:3px;margin:40px auto 0;background:var(--paper);transform-origin:left center}
#tag{margin-top:34px;font:500 22px/1 {{mono}},ui-monospace,monospace;letter-spacing:.3em;text-transform:uppercase;opacity:0}
#hud{position:absolute;inset:calc(var(--safe-t) - 36px) calc(var(--safe-r) - 36px) calc(var(--safe-b) - 36px) calc(var(--safe-l) - 36px);z-index:9;color:var(--paper);font:500 16px/24px {{mono}},ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}
#hud.on-paper{color:var(--ink)}
#hud .c{position:absolute;width:30px;height:30px;border:0 solid currentColor}
#hud .tl{left:36px;top:36px;border-left-width:2px;border-top-width:2px}
#hud .tr{right:36px;top:36px;border-right-width:2px;border-top-width:2px}
#hud .bl{left:36px;bottom:36px;border-left-width:2px;border-bottom-width:2px}
#hud .br{right:36px;bottom:36px;border-right-width:2px;border-bottom-width:2px}
#hud .t{position:absolute;top:62px;white-space:pre}
#rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-right:12px}
#tc{position:absolute;left:72px;bottom:62px}
#ch{position:absolute;right:72px;bottom:62px}
#bar{position:absolute;left:33.33%;bottom:74px;width:33.33%;height:4px;background:currentColor;opacity:.25}
#fill{position:absolute;left:33.33%;bottom:74px;width:0;height:4px;background:var(--acc)}
/* Phones show the whole frame smaller: HUD and tagline 20% larger. */
[data-format=vertical] #hud{font-size:19px;line-height:28px}
[data-format=vertical] #tag{font-size:26px}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1920" data-height="1080">
  <div id="bg" class="layer bg clip" data-start="0" data-duration="{{DUR}}" data-track-index="0"></div>
  <div id="pbg" class="layer clip" data-start="0" data-duration="{{DUR}}" data-track-index="6"></div>
  <div id="c1" class="layer clip" data-start="0" data-duration="{{DUR}}" data-track-index="1"><i id="ground"></i><i id="dot"></i></div>
  <div id="c2" class="layer clip" data-start="0" data-duration="{{DUR}}" data-track-index="2"><div id="phrase"></div></div>
  <div id="c3" class="layer clip" data-start="0" data-duration="{{DUR}}" data-track-index="3"><div id="grid"></div></div>
  <div id="c4" class="layer clip" data-start="0" data-duration="{{DUR}}" data-track-index="4">
    <div id="lock"><div id="word">{{WORDMARK}}<b id="stop"></b></div><div id="rule"></div><div id="tag">{{TAGLINE}}</div></div>
  </div>
  <div id="hud" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="5">
    <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
    <div class="t" style="left:72px">{{BRAND}}  /  REEL</div>
    <div class="t" style="right:72px"><i id="rec"></i><span id="res">1920x1080</span>  ·  30P  ·  {{BPM}} BPM</div>
    <div id="tc">TC 00:00:00:00</div><i id="bar"></i><i id="fill"></i><div id="ch">01 · MOTIF</div>
  </div>
</div>
<script>
const DUR={{DUR}}, FPS=30, PERIOD=60/{{BPM}}, B=(n)=>n*PERIOD;
// Chapter starts in beats. Keep the lockup at least 1.2 s.
const CH=[[0,"01 · MOTIF"],[4,"02 · TYPE"],[10,"03 · GRID"],[14,"END"]];
const PAPER=[[B(4),B(10)]];
// Seeded hash: frames are a pure function of time, never Math.random().
const h=(n)=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};

// Canvas and safe area from the stamped root and tokens, so positions follow the format.
const root=document.getElementById("root"), W=+root.dataset.width, H=+root.dataset.height;
const tok=(n)=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n));
const CX=tok("--safe-l")+(W-tok("--safe-l")-tok("--safe-r"))/2, CY=tok("--safe-t")+(H-tok("--safe-t")-tok("--safe-b"))/2;
document.getElementById("res").textContent=`${W}x${H}`;
// Ground line top, less the dot: where the motif lands.
const G=CY+112;
const phrase=document.getElementById("phrase");
// Letters grouped per word so a narrow format wraps between words, never inside one.
"{{PHRASE}}".split(" ").forEach((w,wi)=>{if(wi)phrase.appendChild(document.createTextNode(" "));const g=document.createElement("span");g.className="w";for(const c of w){const s=document.createElement("span");s.textContent=c;g.appendChild(s)}phrase.appendChild(g)});
const grid=document.getElementById("grid"), cells=[];
// 16x9 in landscape, 7x8 in vertical, 8x8 in square, 100px apart: inside the safe area and clear of the HUD text.
const [GX,GY]=W>H?[16,9]:W<H?[7,8]:[8,8];
for(let y=0;y<GY;y++)for(let x=0;x<GX;x++){const i=document.createElement("i"),dx=x-(GX-1)/2,dy=y-(GY-1)/2;i.style.left=(CX+dx*100)+"px";i.style.top=(CY+dy*100)+"px";grid.appendChild(i);cells.push({i,d:Math.hypot(dx,dy)})}

const tl=gsap.timeline({paused:true});
// 01 motif: falls on the beat, squashes on contact, bounces three times, then stretches into a line.
gsap.set("#dot",{y:-80});gsap.set(["#c2","#c3","#c4"],{opacity:0});
for(let k=0;k<3;k++){
  const top=[-80,G-272,G-132][k];
  tl.fromTo("#dot",{y:top},{y:G,duration:B(0.5),ease:"power2.in"},B(k));
  tl.to("#dot",{scaleX:1.35,scaleY:0.7,duration:0.07,ease:"none"},B(k)+B(0.5));
  tl.to("#dot",{scaleX:1,scaleY:1,y:[G-272,G-132,G-52][k],duration:B(0.5),ease:"power2.out"},B(k)+B(0.5)+0.07);
}
tl.to("#dot",{scaleX:60,scaleY:0.2,duration:B(0.75),ease:"expo.in"},B(3));
tl.set("#c1",{opacity:0},B(4));
// 02 type: the frame flips to paper, letters drop in shuffled order, then invert on a beat.
tl.set("#pbg",{opacity:1},B(4));tl.set("#c2",{opacity:1},B(4));
[...phrase.querySelectorAll(".w span")].forEach((s,i)=>tl.fromTo(s,{y:-160,opacity:0},{y:0,opacity:1,duration:B(0.75),ease:"back.out(2)"},B(4)+h(i)*B(1.5)));
tl.set("#phrase",{color:getComputedStyle(document.documentElement).getPropertyValue("--paper").trim()},B(8));tl.set("#pbg",{opacity:0},B(8));
tl.to("#phrase",{scale:0.2,opacity:0,duration:B(1),ease:"expo.in"},B(9));
// 03 grid: the letters become motif copies, a wave runs through them.
tl.set("#c2",{opacity:0},B(10));tl.set("#c3",{opacity:1},B(10));
tl.fromTo(cells.map(c=>c.i),{scale:0},{scale:1,duration:B(1),ease:"back.out(1.6)",stagger:{each:0.004,from:"center"}},B(10));
const wave={t:0};
tl.to(wave,{t:1,duration:B(3),ease:"none",onUpdate:()=>{const t=wave.t*6;cells.forEach(c=>{const p=Math.sin(t*3-c.d*0.8);c.i.style.transform=`scale(${0.55+0.45*p})`;c.i.style.borderRadius=p>0.6?"8px":"50%"})}},B(11));
// End: wordmark resolves, rule draws, the motif lands as the period, tagline last.
tl.set("#c3",{opacity:0},B(14));tl.set("#c4",{opacity:1},B(14));
tl.fromTo("#word",{filter:"blur(20px)",opacity:0},{filter:"blur(0px)",opacity:1,duration:0.4,ease:"power2.out"},B(14));
tl.fromTo("#rule",{scaleX:0},{scaleX:1,duration:B(1),ease:"expo.out"},B(14.5));
tl.fromTo("#stop",{y:-400},{y:0,duration:B(0.5),ease:"power2.in"},B(15));
tl.to("#stop",{scaleX:1.4,scaleY:0.7,duration:0.07,yoyo:true,repeat:1,ease:"none"},B(15.5));
tl.to("#tag",{opacity:0.7,duration:0.5,ease:"power2.out"},B(16));

// HUD: one per-frame driver, a pure function of t.
const tc=document.getElementById("tc"),ch=document.getElementById("ch"),hud=document.getElementById("hud"),fill=document.getElementById("fill"),rec=document.getElementById("rec");
const pad=(n)=>String(n).padStart(2,"0"), drv={t:0};
tl.fromTo(drv,{t:0},{t:DUR,duration:DUR,ease:"none",onUpdate:()=>{
  const t=drv.t, fr=Math.round(t*FPS);
  tc.textContent=`TC 00:00:${pad(Math.floor(fr/FPS))}:${pad(fr%FPS)}`;
  fill.style.width=(t/DUR*33.33)+"%";
  rec.style.opacity=(t/PERIOD)%1<0.5?1:0.25;
  hud.classList.toggle("on-paper",PAPER.some(([a,b])=>t>=a&&t<b));
  let c=CH[0];for(const e of CH)if(t>=B(e[0])-1e-4)c=e;ch.textContent=c[1];
}},0);
tl.to({},{duration:DUR},0);
window.__timelines=window.__timelines||{}; window.__timelines["main"]=tl; tl.seek(0);
</script>
</body></html>
