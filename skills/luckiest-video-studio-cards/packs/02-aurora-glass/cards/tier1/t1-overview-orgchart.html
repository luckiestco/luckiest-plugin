<!doctype html>
<!--
  AURORA GLASS · tier1 · overview · ORG CHART
  Full-screen hierarchy takeover. One glass root node at top; connector lines
  draw down (vertical stem → horizontal rail → three drops); three glass child
  nodes spring on with glow, staggered. Clean neon SVG lines - no scribbles.
  Slots: title, root, c1, c1_sub, c2, c2_sub, c3, c3_sub.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/aurora-glass/tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-org {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--canvas); color: var(--text);
        font-family: var(--font-body); overflow: hidden;
      }

      #t1-ov-org .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-org .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Layout */
      #t1-ov-org .layout {
        position: absolute; inset: 0; z-index: 3;
        padding: calc(var(--safe-t) + 18px) var(--safe-r) calc(var(--safe-b) + 18px) var(--safe-l);
        display: flex; flex-direction: column; align-items: center;
      }

      /* Title */
      #t1-ov-org .card-title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 52px; line-height: 1.1; text-align: center;
      }
      #t1-ov-org .card-title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Tree canvas */
      #t1-ov-org .tree-area {
        position: relative; width: 1560px; flex: 1;
      }

      /* SVG connector overlay */
      #t1-ov-org .connectors {
        position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
        overflow: visible; pointer-events: none;
      }
      #t1-ov-org .connectors path {
        stroke: var(--accent);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        opacity: 0.75;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb),0.55));
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
      }

      /* Glass nodes */
      #t1-ov-org .node {
        position: absolute; z-index: 2;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        text-align: center;
        padding: 30px 48px;
      }

      /* Root node - top center, accent-rimmed */
      #t1-ov-org .node-root {
        left: 50%; top: 0;
        transform: translateX(-50%);
        min-width: 520px;
        border-color: rgba(var(--accent-rgb), 0.55);
        box-shadow: var(--glass-shadow), 0 0 36px rgba(var(--accent-rgb), 0.28),
                    inset 0 1px 0 var(--glass-hi);
      }
      #t1-ov-org .node-root .node-label {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: calc(38px * var(--type)); color: var(--white);
        text-shadow: var(--textglow); letter-spacing: var(--track-snug);
      }

      /* Child nodes - evenly spaced bottom row */
      #t1-ov-org .node-c1 { left: 0;    top: 420px; transform: translateX(0); min-width: 440px; }
      #t1-ov-org .node-c2 { left: 50%;  top: 420px; transform: translateX(-50%); min-width: 440px; }
      #t1-ov-org .node-c3 { left: 100%; top: 420px; transform: translateX(-100%); min-width: 440px; }

      #t1-ov-org .node-dot {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.80), 0 0 38px rgba(var(--accent-rgb), 0.38);
        margin: 0 auto 16px;
      }
      #t1-ov-org .node-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: calc(32px * var(--type)); color: var(--white);
        letter-spacing: var(--track-snug); line-height: 1.25; margin-bottom: 8px;
      }
      #t1-ov-org .node-sub {
        font-family: var(--font-body); font-size: calc(24px * var(--type));
        color: var(--text-dim); line-height: 1.4;
      }

      #t1-ov-org .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-org .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }

      /* Vertical: root on top, the three children stack down a left spine. Square: same row as
         landscape, narrower nodes. Connectors are redrawn per format (svg units = px of the tree). */
      [data-format="vertical"] #t1-ov-org .layout { padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); }
      [data-format="vertical"] #t1-ov-org .tree-area, [data-format="square"] #t1-ov-org .tree-area { width: 100%; }
      [data-format="vertical"] #t1-ov-org .node-c1, [data-format="vertical"] #t1-ov-org .node-c2, [data-format="vertical"] #t1-ov-org .node-c3 { box-sizing: border-box; width: 687px; min-width: 0; padding: 22px 36px; }
      [data-format="vertical"] #t1-ov-org .node-c1 { left: 80px; top: 180px; }
      [data-format="vertical"] #t1-ov-org .node-c2 { left: calc(80px + 687px / 2); top: 372px; }
      [data-format="vertical"] #t1-ov-org .node-c3 { left: calc(80px + 687px); top: 564px; }
      [data-format="vertical"] #t1-ov-org .node-dot { margin-bottom: 12px; }
      [data-format="vertical"] #t1-ov-org #org-stem { d: path("M383 117 L383 145"); }
      [data-format="vertical"] #t1-ov-org #org-rail { d: path("M383 145 L40 145 L40 647"); }
      [data-format="vertical"] #t1-ov-org #org-drop1 { d: path("M40 263 L80 263"); }
      [data-format="vertical"] #t1-ov-org #org-drop2 { d: path("M40 455 L80 455"); }
      [data-format="vertical"] #t1-ov-org #org-drop3 { d: path("M40 647 L80 647"); }
      [data-format="square"] #t1-ov-org .node-c1, [data-format="square"] #t1-ov-org .node-c2, [data-format="square"] #t1-ov-org .node-c3 { box-sizing: border-box; width: 290px; min-width: 0; padding: 30px 20px; top: 440px; }
      [data-format="square"] #t1-ov-org #org-stem { d: path("M464 108 L464 280"); }
      [data-format="square"] #t1-ov-org #org-rail { d: path("M145 280 L783 280"); }
      [data-format="square"] #t1-ov-org #org-drop1 { d: path("M145 280 L145 440"); }
      [data-format="square"] #t1-ov-org #org-drop2 { d: path("M464 280 L464 440"); }
      [data-format="square"] #t1-ov-org #org-drop3 { d: path("M783 280 L783 440"); }
    </style>
  </head>
  <body>
    <div id="t1-ov-org" data-composition-id="t1-ov-org" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="layout">
        <div class="card-title" data-slot="title">How the <em>Company</em> Is Structured</div>

        <div class="tree-area">
          <!--
            SVG coordinates (tree-area 1560px wide):
            Root center: x=780, root bottom edge ~y=108
            Branch mid: x=780, y=268
            Child centers: c1=220, c2=780, c3=1340  drop-top y=420
          -->
          <svg class="connectors">
            <path id="org-stem" d="M780 108 L780 268" />
            <path id="org-rail" d="M220 268 L1340 268" />
            <path id="org-drop1" d="M220 268 L220 420" />
            <path id="org-drop2" d="M780 268 L780 420" />
            <path id="org-drop3" d="M1340 268 L1340 420" />
          </svg>

          <!-- Root node -->
          <div class="node node-root" id="org-root">
            <div class="node-label" data-slot="root">Chief Executive Officer</div>
          </div>

          <!-- Child nodes -->
          <div class="node node-c1" id="org-c1">
            <div class="node-dot" id="org-dot1"></div>
            <div class="node-label" data-slot="c1">Product</div>
            <div class="node-sub" data-slot="c1_sub">Design, Engineering, QA</div>
          </div>

          <div class="node node-c2" id="org-c2">
            <div class="node-dot" id="org-dot2"></div>
            <div class="node-label" data-slot="c2">Growth</div>
            <div class="node-sub" data-slot="c2_sub">Marketing, Sales, Partnerships</div>
          </div>

          <div class="node node-c3" id="org-c3">
            <div class="node-dot" id="org-dot3"></div>
            <div class="node-label" data-slot="c3">Operations</div>
            <div class="node-sub" data-slot="c3_sub">Finance, Legal, HR</div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-org .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 85px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-org .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-org .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-org .card-title", { autoAlpha: 0, y: 28, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, 0.5)

        /* root node springs in */
        .from("#org-root", { autoAlpha: 0, scale: 0.88, y: -18, filter: "blur(10px)", transformOrigin: "50% 50%", duration: 0.75, ease: "back.out(1.4)" }, 0.88)

        /* stem draws down */
        .to("#org-stem",  { strokeDashoffset: 0, duration: 0.36, ease: "power3.inOut" }, 1.30)

        /* horizontal rail draws */
        .to("#org-rail",  { strokeDashoffset: 0, duration: 0.44, ease: "power3.inOut" }, 1.58)

        /* drops + children - staggered */
        .to("#org-drop1", { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 1.88)
        .from("#org-c1",  { autoAlpha: 0, y: 30, filter: "blur(8px)", duration: 0.65, ease: "back.out(1.3)" }, 1.98)

        .to("#org-drop2", { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 2.04)
        .from("#org-c2",  { autoAlpha: 0, y: 30, filter: "blur(8px)", duration: 0.65, ease: "back.out(1.3)" }, 2.14)

        .to("#org-drop3", { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 2.20)
        .from("#org-c3",  { autoAlpha: 0, y: 30, filter: "blur(8px)", duration: 0.65, ease: "back.out(1.3)" }, 2.30)

        /* node dot glow pulse */
        .to("#org-dot1, #org-dot2, #org-dot3",
          { boxShadow: "0 0 28px rgba(79,140,255,0.95), 0 0 64px rgba(79,140,255,0.50)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.14 }, 3.2)

        /* root accent glow breathe */
        .to("#org-root",
          { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 50px rgba(79,140,255,0.40), inset 0 1px 0 rgba(255,255,255,0.22)",
            duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.5)

        /* slow drift during hold */
        .to("#t1-ov-org .tree-area", { y: -10, duration: 4.5, ease: "sine.inOut" }, 1.8)

        .set({}, {}, 7);

      window.__timelines["t1-ov-org"] = tl;
    </script>
  </body>
</html>
