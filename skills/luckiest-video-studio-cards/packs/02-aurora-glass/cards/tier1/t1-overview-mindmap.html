<!doctype html>
<!--
  AURORA GLASS · tier1 · overview · MIND MAP
  Full-screen takeover. A central glowing glass node in the middle of the canvas;
  four SVG connector lines draw outward (scaleX from center) to four labeled leaf
  nodes that spring in with glow. Lines radiate at 10°, 100°, 190°, 280° roughly
  (top-right, bottom-right, bottom-left, top-left) for a balanced map.
  Slots: title, center, leaf1, leaf1_sub, leaf2, leaf2_sub, leaf3, leaf3_sub, leaf4, leaf4_sub.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/aurora-glass/tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-mind {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--canvas); color: var(--text);
        font-family: var(--font-body); overflow: hidden;
      }

      #t1-ov-mind .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-mind .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 55%, #000 28%, transparent 76%);
                mask-image: radial-gradient(130% 110% at 50% 55%, #000 28%, transparent 76%);
      }

      /* Title top-center */
      #t1-ov-mind .card-title {
        position: absolute; left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 14px); z-index: 4;
        text-align: center;
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        line-height: 1.1;
      }
      #t1-ov-mind .card-title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* SVG connector layer - full canvas */
      #t1-ov-mind .connectors {
        position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2;
        overflow: visible; pointer-events: none;
      }
      #t1-ov-mind .connectors path {
        stroke: var(--accent);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        opacity: 0.70;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb),0.50));
        stroke-dasharray: 700;
        stroke-dashoffset: 700;
      }

      /* Central glass node */
      #t1-ov-mind .center-node {
        position: absolute; z-index: 4;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        background: var(--glass-bg-dark);
        border: 2px solid rgba(var(--accent-rgb), 0.60);
        border-radius: 50%;
        width: 220px; height: 220px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow), 0 0 60px rgba(var(--accent-rgb), 0.32),
                    inset 0 1px 0 var(--glass-hi);
        display: flex; align-items: center; justify-content: center;
        text-align: center;
      }
      #t1-ov-mind .center-node .center-label {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: calc(32px * var(--type)); color: var(--white);
        text-shadow: var(--textglow); letter-spacing: var(--track-snug);
        padding: 0 18px;
      }

      /* Leaf nodes */
      #t1-ov-mind .leaf {
        position: absolute; z-index: 4;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        padding: 24px 36px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        min-width: 320px; text-align: center;
      }
      #t1-ov-mind .leaf-dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.85), 0 0 34px rgba(var(--accent-rgb), 0.40);
        margin: 0 auto 12px;
      }
      #t1-ov-mind .leaf-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: calc(30px * var(--type)); color: var(--white);
        letter-spacing: var(--track-snug); line-height: 1.25; margin-bottom: 6px;
      }
      #t1-ov-mind .leaf-sub {
        font-family: var(--font-body); font-size: calc(22px * var(--type));
        color: var(--text-dim); line-height: 1.4;
      }

      /*
        Layout coordinates (1920×1080, center = 960, 540):
        Leaf positions (top-left corner of each glass card, card ~320×100px):
          leaf1 (top-right):    left=1140, top=190   → center ~1300, ~240
          leaf2 (bottom-right): left=1140, top=760   → center ~1300, ~820
          leaf3 (bottom-left):  left=420,  top=760   → center ~580,  ~820
          leaf4 (top-left):     left=420,  top=190   → center ~580,  ~240
        Center node center: 960, 540; radius 110px
        Line endpoints from center node edge to leaf center dot area.
      */
      #t1-ov-mind #leaf1 { left: 1140px; top: 172px; }
      #t1-ov-mind #leaf2 { left: 1140px; top: 748px; }
      #t1-ov-mind #leaf3 { left: 360px;  top: 748px; }
      #t1-ov-mind #leaf4 { left: 360px;  top: 172px; }

      #t1-ov-mind .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-mind .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
      /* Vertical and square: the map shrinks into the safe box - two leaves above the hub, two below;
         connectors are redrawn per format with the CSS d property (svg units = px). */
      [data-format="vertical"] #t1-ov-mind .center-node { left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2); top: 830px; }
      [data-format="vertical"] #t1-ov-mind .leaf, [data-format="square"] #t1-ov-mind .leaf { box-sizing: border-box; min-width: 0; padding: 24px 24px; }
      [data-format="vertical"] #t1-ov-mind .leaf { width: 360px; }
      [data-format="vertical"] #t1-ov-mind #leaf4 { left: var(--safe-l); top: 480px; }
      [data-format="vertical"] #t1-ov-mind #leaf1 { left: auto; right: var(--safe-r); top: 480px; }
      [data-format="vertical"] #t1-ov-mind #leaf3 { left: var(--safe-l); top: 990px; }
      [data-format="vertical"] #t1-ov-mind #leaf2 { left: auto; right: var(--safe-r); top: 990px; }
      [data-format="vertical"] #mind-l1 { d: path("M580 752 L640 650"); }
      [data-format="vertical"] #mind-l2 { d: path("M580 908 L640 1010"); }
      [data-format="vertical"] #mind-l3 { d: path("M425 908 L365 1010"); }
      [data-format="vertical"] #mind-l4 { d: path("M425 752 L365 650"); }
      [data-format="square"] #t1-ov-mind .center-node { top: 570px; }
      [data-format="square"] #t1-ov-mind .leaf { width: 380px; }
      [data-format="square"] #t1-ov-mind #leaf4 { left: var(--safe-l); top: 180px; }
      [data-format="square"] #t1-ov-mind #leaf1 { left: auto; right: var(--safe-r); top: 180px; }
      [data-format="square"] #t1-ov-mind #leaf3 { left: var(--safe-l); top: 790px; }
      [data-format="square"] #t1-ov-mind #leaf2 { left: auto; right: var(--safe-r); top: 790px; }
      [data-format="square"] #mind-l1 { d: path("M618 492 L700 340"); }
      [data-format="square"] #mind-l2 { d: path("M618 648 L700 820"); }
      [data-format="square"] #mind-l3 { d: path("M462 648 L380 820"); }
      [data-format="square"] #mind-l4 { d: path("M462 492 L380 340"); }
    </style>
  </head>
  <body>
    <div id="t1-ov-mind" data-composition-id="t1-ov-mind" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="card-title" data-slot="title">The <em>Four Pillars</em> of Growth</div>

      <!--
        SVG lines from center (960,540) to each leaf center:
          leaf1 center: ~1300, 242  → from center edge at ~(1070,463) to (1300,242)
          leaf2 center: ~1300, 838  → from (1070,617) to (1300,838)
          leaf3 center: ~580,  838  → from (850,617) to (580,838)
          leaf4 center: ~580,  242  → from (850,463) to (580,242)
        Slight offset from node circle edge (r≈110).
      -->
      <svg class="connectors">
        <path id="mind-l1" d="M1038 463 L1300 256" />
        <path id="mind-l2" d="M1038 617 L1300 822" />
        <path id="mind-l3" d="M882 617 L620 822" />
        <path id="mind-l4" d="M882 463 L620 256" />
      </svg>

      <!-- Central node -->
      <div class="center-node" id="mind-center">
        <div class="center-label" data-slot="center">Your Business</div>
      </div>

      <!-- Leaf nodes -->
      <div class="leaf" id="leaf1">
        <div class="leaf-dot" id="mind-dot1"></div>
        <div class="leaf-label" data-slot="leaf1">Content</div>
        <div class="leaf-sub" data-slot="leaf1_sub">Build trust at scale</div>
      </div>

      <div class="leaf" id="leaf2">
        <div class="leaf-dot" id="mind-dot2"></div>
        <div class="leaf-label" data-slot="leaf2">Community</div>
        <div class="leaf-sub" data-slot="leaf2_sub">Turn viewers into advocates</div>
      </div>

      <div class="leaf" id="leaf3">
        <div class="leaf-dot" id="mind-dot3"></div>
        <div class="leaf-label" data-slot="leaf3">Conversion</div>
        <div class="leaf-sub" data-slot="leaf3_sub">Warm leads who already know you</div>
      </div>

      <div class="leaf" id="leaf4">
        <div class="leaf-dot" id="mind-dot4"></div>
        <div class="leaf-label" data-slot="leaf4">Capital</div>
        <div class="leaf-sub" data-slot="leaf4_sub">Diversify revenue streams</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-mind .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "105px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-mind .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-mind .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-mind .card-title", { autoAlpha: 0, y: 24, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, 0.45)

        /* central node blooms in */
        .from("#mind-center", { autoAlpha: 0, scale: 0.70, filter: "blur(16px)", transformOrigin: "50% 50%", duration: 0.90, ease: "back.out(1.5)" }, 0.85)

        /* four lines draw outward, slightly staggered */
        .to("#mind-l1", { strokeDashoffset: 0, duration: 0.55, ease: "power3.inOut" }, 1.42)
        .from("#leaf1",  { autoAlpha: 0, scale: 0.82, filter: "blur(10px)", transformOrigin: "0% 50%", duration: 0.65, ease: "back.out(1.3)" }, 1.72)

        .to("#mind-l2", { strokeDashoffset: 0, duration: 0.55, ease: "power3.inOut" }, 1.58)
        .from("#leaf2",  { autoAlpha: 0, scale: 0.82, filter: "blur(10px)", transformOrigin: "0% 50%", duration: 0.65, ease: "back.out(1.3)" }, 1.88)

        .to("#mind-l3", { strokeDashoffset: 0, duration: 0.55, ease: "power3.inOut" }, 1.74)
        .from("#leaf3",  { autoAlpha: 0, scale: 0.82, filter: "blur(10px)", transformOrigin: "100% 50%", duration: 0.65, ease: "back.out(1.3)" }, 2.04)

        .to("#mind-l4", { strokeDashoffset: 0, duration: 0.55, ease: "power3.inOut" }, 1.90)
        .from("#leaf4",  { autoAlpha: 0, scale: 0.82, filter: "blur(10px)", transformOrigin: "100% 50%", duration: 0.65, ease: "back.out(1.3)" }, 2.20)

        /* leaf dot glow pulses */
        .to("#mind-dot1, #mind-dot2, #mind-dot3, #mind-dot4",
          { boxShadow: "0 0 24px rgba(79,140,255,0.95), 0 0 56px rgba(79,140,255,0.48)",
            duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.12 }, 3.0)

        /* center node border glow breathes */
        .to("#mind-center",
          { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 90px rgba(79,140,255,0.45), inset 0 1px 0 rgba(255,255,255,0.22)",
            duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.3)

        /* gentle scale drift on center node */
        .to("#mind-center", { scale: 1.04, transformOrigin: "50% 50%", duration: 4.0, ease: "sine.inOut" }, 2.2)

        .set({}, {}, 7);

      window.__timelines["t1-ov-mind"] = tl;
    </script>
  </body>
</html>
