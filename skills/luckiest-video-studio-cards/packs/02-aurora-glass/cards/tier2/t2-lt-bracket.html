<!doctype html>
<!--
  AURORA GLASS · tier2 · lower-third · BRACKET
  Glowing corner-bracket frame drawn by SVG lines that animate in. Name and
  role sit inside on a dark glass backing. Four corner brackets (top-left,
  top-right, bottom-left, bottom-right) draw on, then hold. The brackets
  themselves carry a blue neon glow.
  Transparent background - only the glass + brackets paint.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/aurora-glass/tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-brkt {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind the bracket block */
      #t2-lt-brkt .local-bloom {
        position: absolute;
        left: calc(var(--safe-l) - 30px); bottom: calc(var(--safe-b) + 46px);
        width: 540px; height: 230px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 35% 78%,
          rgba(var(--accent-rgb), 0.25) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 74%);
        filter: blur(34px);
        pointer-events: none;
        z-index: 1;
      }

      /* Glass backing for the text (inside the brackets) */
      #t2-lt-brkt .glass-inner {
        position: absolute;
        left: var(--safe-l); bottom: calc(var(--safe-b) + 66px);
        width: 460px;
        padding: 28px 36px 26px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        /* No border - brackets replace it */
        border-radius: 6px;
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
        z-index: 2;
      }

      #t2-lt-brkt .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: calc(36px * var(--type));
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        margin-bottom: 8px;
        white-space: nowrap;
      }

      #t2-lt-brkt .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: calc(22px * var(--type));
        color: var(--text-dim);
        letter-spacing: 0.01em;
        line-height: 1.3;
        white-space: nowrap;
      }

      /* SVG bracket overlay - same position/size as glass-inner */
      #t2-lt-brkt .brackets-svg {
        position: absolute;
        left: calc(var(--safe-l) - 6px); bottom: calc(var(--safe-b) + 60px);         /* 6px inset for visual padding */
        width: 472px; height: 136px;        /* matches glass-inner outer size */
        pointer-events: none;
        z-index: 3;
        overflow: visible;
      }

      #t2-lt-brkt .brackets-svg .brk {
        stroke: var(--accent);
        stroke-width: 2;
        fill: none;
        stroke-linecap: square;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb),0.90))
                drop-shadow(0 0 16px rgba(var(--accent-rgb),0.50));
        /* stroke-dasharray / stroke-dashoffset controlled by GSAP for draw-in */
      }
      /* Vertical and square: card sits at the bottom of the safe area, bloom follows, slots wrap. */
      [data-format="vertical"] #t2-lt-brkt .glass-inner, [data-format="square"] #t2-lt-brkt .glass-inner {
        bottom: var(--safe-b); max-width: calc(var(--w) - var(--safe-l) - var(--safe-r));
      }
      [data-format="vertical"] #t2-lt-brkt .local-bloom, [data-format="square"] #t2-lt-brkt .local-bloom { bottom: calc(var(--safe-b) - 20px); }
      [data-format="vertical"] #t2-lt-brkt [data-slot], [data-format="square"] #t2-lt-brkt [data-slot] { white-space: normal; }
      /* the glass grows with the larger type, so the brackets track its box */
      [data-format="vertical"] #t2-lt-brkt .glass-inner, [data-format="square"] #t2-lt-brkt .glass-inner { anchor-name: --brkt; width: auto; min-width: 460px; }
      [data-format="vertical"] #t2-lt-brkt .brackets-svg, [data-format="square"] #t2-lt-brkt .brackets-svg {
        position-anchor: --brkt; width: auto; height: auto;
        left: calc(anchor(left) - 6px); right: calc(anchor(right) - 6px); top: anchor(top); bottom: calc(anchor(bottom) - 6px);
      }
      [data-format="vertical"] #t2-lt-brkt .brk, [data-format="square"] #t2-lt-brkt .brk { vector-effect: non-scaling-stroke; }
    </style>
  </head>
  <body>
    <div id="t2-lt-brkt"
         data-composition-id="t2-lt-brkt"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <!-- Dark glass text backing -->
      <div class="glass-inner">
        <div class="name" data-slot="name">Ronny Mitchell</div>
        <div class="role" data-slot="role">Head of Content Strategy</div>
      </div>

      <!--
        Corner bracket SVG. Four L-shaped paths, one per corner.
        Each arm is 40px long. The SVG viewBox matches glass-inner outer bounds.
        Total drawn length per bracket: 40 + 40 = 80px → dasharray 80.
        Draw direction set by path winding (GSAP animates dashoffset 80→0).
      -->
      <svg class="brackets-svg" viewBox="0 0 472 136" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <!-- top-left: horizontal then vertical -->
        <path class="brk" id="brk-tl" d="M40,2 L2,2 L2,42"
          stroke-dasharray="80" stroke-dashoffset="80" />
        <!-- top-right: horizontal then vertical -->
        <path class="brk" id="brk-tr" d="M432,2 L470,2 L470,42"
          stroke-dasharray="80" stroke-dashoffset="80" />
        <!-- bottom-left: horizontal then vertical -->
        <path class="brk" id="brk-bl" d="M40,134 L2,134 L2,94"
          stroke-dasharray="80" stroke-dashoffset="80" />
        <!-- bottom-right: horizontal then vertical -->
        <path class="brk" id="brk-br" d="M432,134 L470,134 L470,94"
          stroke-dasharray="80" stroke-dashoffset="80" />
      </svg>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom in */
      tl.from("#t2-lt-brkt .local-bloom",
        { autoAlpha: 0, scale: 0.65, duration: 1.1, ease: "power2.out" }, 0);

      /* glass inner fades in first - softly, before brackets appear */
      tl.from("#t2-lt-brkt .glass-inner",
        { autoAlpha: 0, scale: 0.95, filter: "blur(10px)",
          transformOrigin: "left bottom",
          duration: 0.70, ease: "power3.out" }, 0.10);

      /* four brackets draw in simultaneously (dashoffset 80 → 0) */
      const brkTargets = ["#brk-tl", "#brk-tr", "#brk-bl", "#brk-br"];
      brkTargets.forEach((sel) => {
        tl.to(sel,
          { strokeDashoffset: 0, duration: 0.55, ease: "power3.out" }, 0.55);
      });

      /* name glides in */
      tl.from("#t2-lt-brkt .name",
        { autoAlpha: 0, y: 14, filter: "blur(8px)",
          duration: 0.60, ease: "power4.out" }, 0.76);

      /* role follows */
      tl.from("#t2-lt-brkt .role",
        { autoAlpha: 0, y: 9, filter: "blur(5px)",
          duration: 0.52, ease: "power3.out" }, 0.94);

      /* bracket glow pulse - finite */
      tl.to("#t2-lt-brkt .brk",
        { filter: "drop-shadow(0 0 12px rgba(79,140,255,1.0)) drop-shadow(0 0 30px rgba(79,140,255,0.65))",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.8);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-brkt"] = tl;
    </script>
  </body>
</html>
