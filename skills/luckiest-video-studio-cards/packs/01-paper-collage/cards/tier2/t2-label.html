<!doctype html>
<!--
  PAPER COLLAGE · tier2 · label  (overlay: annotated callout + hand-drawn arrow)
  TRANSPARENT. A highlighted term sits left-of-center; a hand-drawn arrow points
  right toward the subject the speaker is referencing.
  Slots: term (the highlighted word/phrase), detail (one supporting line).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-label {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: transparent; font-family: var(--font-display);
      }
      #t2-label .wrap { position: absolute; left: 150px; top: 380px; width: 760px; }
      #t2-label .term {
        display: inline-block; font-weight: var(--wt-black); font-size: calc(72px * var(--type));
        letter-spacing: var(--track-tight); color: var(--ink);
        background: var(--yellow); padding: 6px 22px; transform: skewX(var(--marker-skew));
        box-shadow: 6px 6px 0 rgba(23,19,14,0.2);
      }
      #t2-label .detail {
        margin-top: 24px; max-width: 620px;
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.4; color: var(--ink);
        background: rgba(239,233,220,0.92); padding: 10px 16px; display: inline-block;
      }
      /* Vertical and square: sit at the bottom of the safe area, clear of the speaker's face. */
      [data-format="vertical"] #t2-label .wrap, [data-format="square"] #t2-label .wrap {
        top: auto; left: var(--safe-l); bottom: calc(var(--safe-b) + 24px);
        width: auto; max-width: calc(var(--w) - var(--safe-l) - var(--safe-r));
      }
      [data-format="vertical"] #t2-label [data-slot], [data-format="square"] #t2-label [data-slot] { white-space: normal; }
    </style>
  </head>
  <body>
    <div id="t2-label" data-composition-id="t2-label" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="term" data-slot="term">depth of focus</div>
        <div class="detail" data-slot="detail">The eye is pulled exactly where the story wants it.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#t2-label .term", { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.34, ease: "power3.out" }, 0.0)
        .from("#t2-label .detail", { autoAlpha: 0, y: 16, duration: 0.32, ease: "steps(4)" }, 0.3)
        .set({}, {}, 7);

      window.__timelines["t2-label"] = tl;
    </script>
  </body>
</html>
