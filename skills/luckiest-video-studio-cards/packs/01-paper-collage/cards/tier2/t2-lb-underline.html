<!doctype html>
<!--
  PAPER COLLAGE · tier2 · label-underline (overlay: term with growing red underline)
  TRANSPARENT. Minimal - the term sits bare in big Fraunces. A thick red underline
  grows left-to-right (scaleX from left origin) beneath the word. That growing line
  IS the hero motion. Detail Archivo below;
  Slots: term, detail.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-lb-ul {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: transparent; font-family: var(--font-display);
      }
      #t2-lb-ul .wrap { position: absolute; left: 150px; top: 355px; width: 760px; }
      /* term with paper plate - hugs content, underline sits below the plate */
      #t2-lb-ul .term {
        display: inline-block;
        font-family: var(--font-display);
        font-weight: var(--wt-black);
        font-size: calc(80px * var(--type));
        letter-spacing: var(--track-tight);
        color: var(--ink);
        line-height: 1.0;
        white-space: nowrap;
        background: rgba(239, 233, 220, 0.94);
        padding: 4px 16px;
        border-radius: 2px;
      }

      /* underline container - spans wrap width, clipped so scaleX works */
      #t2-lb-ul .underline-wrap {
        margin-top: 6px;
        height: 14px;
        width: 100%;
        overflow: hidden;
      }
      #t2-lb-ul .underline {
        height: 100%;
        width: 100%;
        background: var(--red);
        transform-origin: left center;
      }

      /* detail in Archivo beneath the underline */
      #t2-lb-ul .detail {
        margin-top: 24px; max-width: 620px;
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.4; color: var(--ink);
        background: rgba(239,233,220,0.92); padding: 10px 16px; display: inline-block;
      }

      /* Vertical and square: sit at the bottom of the safe area, clear of the speaker's face. */
      [data-format="vertical"] #t2-lb-ul .wrap, [data-format="square"] #t2-lb-ul .wrap {
        top: auto; left: var(--safe-l); bottom: calc(var(--safe-b) + 24px);
        width: auto; max-width: calc(var(--w) - var(--safe-l) - var(--safe-r));
      }
      [data-format="vertical"] #t2-lb-ul [data-slot], [data-format="square"] #t2-lb-ul [data-slot] { white-space: normal; }
    </style>
  </head>
  <body>
    <div id="t2-lb-ul" data-composition-id="t2-lb-ul" data-start="0" data-width="1920" data-height="1080">
      <div class="wrap">
        <div class="term" data-slot="term">moral hazard</div>
        <div class="underline-wrap">
          <div class="underline"></div>
        </div>
        <div class="detail" data-slot="detail">When someone takes risks because someone else bears the cost.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#t2-lb-ul .underline", { scaleX: 0 }); // was a CSS transform; GSAP owns it now

      /* Term snaps in via scaleX wipe */
      tl.from("#t2-lb-ul .term", {
          autoAlpha: 0, scaleX: 0, transformOrigin: "left center",
          duration: 0.34, ease: "power3.out"
        }, 0.0)
      /* HERO: underline grows left-to-right - this is the moment */
        .to("#t2-lb-ul .underline", {
          scaleX: 1, transformOrigin: "left center",
          duration: 0.46, ease: "steps(5)"
        }, 0.30)
      /* Detail steps in beneath */
        .from("#t2-lb-ul .detail", {
          autoAlpha: 0, y: 14, duration: 0.30, ease: "steps(4)"
        }, 0.72)
        .set({}, {}, 7);

      window.__timelines["t2-lb-ul"] = tl;
    </script>
  </body>
</html>
