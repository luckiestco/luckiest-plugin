<!doctype html>
<!--
  PAPER COLLAGE · tier1 · overview · QUAD GRID
  2x2 quadrant grid: four topic tiles separated by ink dividers (full-screen cross).
  Each tile = a number chip + a topic label + a short sub. Tiles pop in staggered
  TL, TR, BL, BR. Marker title at top.
  Slots: title, q1, qs1, q2, qs2, q3, qs3, q4, qs4, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-quad {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-quad .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-quad .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 6;
      }
      #t1-ov-quad .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(130% 120% at 50% 40%, transparent 60%, rgba(23,19,14,0.14) 100%);
      }
      /* marker title */
      #t1-ov-quad .title {
        position: absolute; top: calc(var(--safe-t) + 8px); left: 50%; transform: translateX(-50%) skewX(var(--marker-skew));
        background: var(--yellow); padding: 8px 28px; z-index: 3;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); text-transform: uppercase; white-space: nowrap;
      }
      /* full-screen ink dividers forming a cross */
      #t1-ov-quad .divider-h {
        position: absolute; left: 0; right: 0; top: 540px; height: 5px;
        background: var(--ink); z-index: 2;
      }
      #t1-ov-quad .divider-v {
        position: absolute; top: 220px; bottom: 0; left: calc(var(--w) / 2); width: 5px;
        background: var(--ink); z-index: 2;
      }
      /* quadrant tiles */
      #t1-ov-quad .quads {
        position: absolute; left: 0; right: 0; top: 220px; bottom: 0; z-index: 1;
        display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      }
      #t1-ov-quad .q {
        display: flex; flex-direction: column; justify-content: center;
        padding: 56px 72px;
      }
      #t1-ov-quad .q1 { padding-right: 56px; padding-left: var(--safe-l); }
      #t1-ov-quad .q2 { padding-left: 56px; padding-right: var(--safe-r); }
      #t1-ov-quad .q3 { padding-right: 56px; padding-left: var(--safe-l); }
      #t1-ov-quad .q4 { padding-left: 56px; padding-right: var(--safe-r); }
      /* number chip */
      #t1-ov-quad .chip {
        display: inline-flex; align-items: center; justify-content: center;
        width: 72px; height: 72px;
        background: var(--ink); color: var(--paper);
        font-weight: var(--wt-black); font-size: calc(40px * var(--type));
        font-variant-numeric: tabular-nums; margin-bottom: 22px;
      }
      #t1-ov-quad .q1 .chip, #t1-ov-quad .q2 .chip { background: var(--yellow); color: var(--ink); }
      #t1-ov-quad .topic {
        font-weight: var(--wt-black); font-size: calc(60px * var(--type));
        line-height: 1.05; letter-spacing: var(--track-tight); margin-bottom: 14px;
      }
      #t1-ov-quad .sub {
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-body); color: var(--muted); line-height: 1.35;
      }
      /* source */
      #t1-ov-quad .source {
        position: absolute; left: calc(var(--safe-l) + 34px); bottom: var(--safe-b); z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical: the four quadrants become four rows (chip left, topic and sub right) split by
         rules; the cross dividers are hidden. Title centred on the safe box and allowed to wrap. */
      [data-format="vertical"] #t1-ov-quad .title, [data-format="square"] #t1-ov-quad .title {
        top: var(--safe-t); left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2);
        width: max-content; max-width: calc(var(--w) - var(--safe-l) - var(--safe-r) - 56px);
        white-space: normal; text-align: center;
      }
      [data-format="vertical"] #t1-ov-quad .title { font-size: calc(54px * var(--type)); }
      [data-format="vertical"] #t1-ov-quad .divider-h, [data-format="vertical"] #t1-ov-quad .divider-v { display: none; }
      [data-format="vertical"] #t1-ov-quad .quads {
        left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 190px); bottom: calc(var(--safe-b) + 30px);
        grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr);
      }
      [data-format="vertical"] #t1-ov-quad .q {
        display: grid; grid-template-columns: 72px 1fr; column-gap: 30px; align-content: center;
        padding: 0; border-top: 3px solid var(--ink);
      }
      [data-format="vertical"] #t1-ov-quad .chip { grid-column: 1; grid-row: 1 / span 2; margin: 6px 0 0 0; }
      [data-format="vertical"] #t1-ov-quad .topic { grid-column: 2; margin-bottom: 8px; font-size: calc(52px * var(--type)); }
      [data-format="vertical"] #t1-ov-quad .sub { grid-column: 2; }
      [data-format="vertical"] #t1-ov-quad .source, [data-format="square"] #t1-ov-quad .source { left: var(--safe-l); bottom: var(--safe-b); }
      /* Square: keep the 2x2 cross, fitted to the safe box. */
      [data-format="square"] #t1-ov-quad .title { font-size: 64px; }
      [data-format="square"] #t1-ov-quad .quads { left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 130px); bottom: calc(var(--safe-b) + 40px); }
      [data-format="square"] #t1-ov-quad .q { padding: 24px 28px; }
      [data-format="square"] #t1-ov-quad .q1, [data-format="square"] #t1-ov-quad .q3 { padding-left: 0; }
      [data-format="square"] #t1-ov-quad .q2, [data-format="square"] #t1-ov-quad .q4 { padding-right: 0; }
      [data-format="square"] #t1-ov-quad .topic { font-size: 54px; }
      [data-format="square"] #t1-ov-quad .divider-v { top: calc(var(--safe-t) + 130px); bottom: calc(var(--safe-b) + 40px); }
      [data-format="square"] #t1-ov-quad .divider-h { top: calc(var(--safe-t) + 130px + (var(--h) - var(--safe-t) - var(--safe-b) - 170px) / 2); }
    </style>
  </head>
  <body>
    <div id="t1-ov-quad" data-composition-id="t1-ov-quad" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <div class="title" data-slot="title">FOUR THINGS TO KNOW</div>

      <div class="divider-h"></div>
      <div class="divider-v"></div>

      <div class="quads">
        <div class="q q1">
          <div class="chip">01</div>
          <div class="topic" data-slot="q1">The Problem</div>
          <div class="sub" data-slot="qs1">Why this moment matters more than any before it</div>
        </div>
        <div class="q q2">
          <div class="chip">02</div>
          <div class="topic" data-slot="q2">The Stakes</div>
          <div class="sub" data-slot="qs2">What's on the line if we get this wrong</div>
        </div>
        <div class="q q3">
          <div class="chip">03</div>
          <div class="topic" data-slot="q3">The Players</div>
          <div class="sub" data-slot="qs3">Who controls the outcome and how</div>
        </div>
        <div class="q q4">
          <div class="chip">04</div>
          <div class="topic" data-slot="q4">The Fix</div>
          <div class="sub" data-slot="qs4">The one lever that changes everything</div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker - finite
      tl.fromTo("#t1-ov-quad .grain", { backgroundPosition: "0px 0px" },
        { backgroundPosition: "160px 100px", duration: 0.5, ease: "steps(4)", repeat: 13, yoyo: true }, 0);

      // title snap
      tl.from("#t1-ov-quad .title",
        { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.out" }, 0.1);

      // dividers wipe in
      tl.from("#t1-ov-quad .divider-h",
        { scaleX: 0, transformOrigin: "left center", duration: 0.45, ease: "power2.inOut" }, 0.35);
      tl.from("#t1-ov-quad .divider-v",
        { scaleY: 0, transformOrigin: "top center", duration: 0.4, ease: "power2.inOut" }, 0.45);

      // tiles stagger TL, TR, BL, BR
      tl.from("#t1-ov-quad .q1",
        { autoAlpha: 0, x: -40, y: 30, duration: 0.45, ease: "back.out(1.6)" }, 0.65);
      tl.from("#t1-ov-quad .q2",
        { autoAlpha: 0, x: 40, y: 30, duration: 0.45, ease: "back.out(1.6)" }, 0.82);
      tl.from("#t1-ov-quad .q3",
        { autoAlpha: 0, x: -40, y: 30, duration: 0.45, ease: "back.out(1.6)" }, 0.99);
      tl.from("#t1-ov-quad .q4",
        { autoAlpha: 0, x: 40, y: 30, duration: 0.45, ease: "back.out(1.6)" }, 1.16);

      tl.from("#t1-ov-quad .source", { autoAlpha: 0, duration: 0.3 }, 1.4);

      tl.set({}, {}, 7);

      window.__timelines["t1-ov-quad"] = tl;
    </script>
  </body>
</html>
