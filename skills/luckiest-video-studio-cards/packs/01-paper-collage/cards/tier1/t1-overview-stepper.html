<!doctype html>
<!--
  PAPER COLLAGE · tier1 · overview · PROCESS STEPPER
  Left-to-right row of 4 numbered step circles connected by a horizontal rule
  that fills yellow progressively. Each circle has a step label below it.
  Circles pop in order after their segment of the rule fills.
  Title at top.
  Slots: title, intro, step1, step2, step3, step4, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-step {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-step .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-step .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-ov-step .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(130% 120% at 50% 48%, transparent 56%, rgba(23,19,14,0.14) 100%);
      }

      /* marker title */
      #t1-ov-step .title {
        position: absolute; top: calc(var(--safe-t) + 34px); left: 50%; transform: translateX(-50%) skewX(var(--marker-skew));
        background: var(--yellow); padding: 8px 28px; z-index: 3;
        font-weight: var(--wt-black); font-size: var(--size-title); letter-spacing: var(--track-tight);
        text-transform: uppercase; white-space: nowrap;
      }

      /* intro */
      #t1-ov-step .intro {
        position: absolute; top: calc(var(--safe-t) + 176px); left: 50%; transform: translateX(-50%);
        width: 1100px; text-align: center; z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.4; color: var(--muted);
      }

      /* stepper track */
      #t1-ov-step .track-wrap {
        position: absolute; left: calc(var(--safe-l) + 64px); right: calc(var(--safe-r) + 64px); top: 430px; height: 16px; z-index: 2;
      }
      #t1-ov-step .track-bg {
        position: absolute; inset: 0;
        background: var(--paper-2); box-shadow: inset 0 0 0 3px var(--ink);
      }
      /* four yellow fill segments, each covering one step-to-step interval */
      #t1-ov-step .seg {
        position: absolute; top: 0; height: 100%;
        background: var(--yellow); transform: scaleX(0); transform-origin: left center;
        box-shadow: 2px 0 0 0 var(--ink);
      }

      /* step nodes */
      #t1-ov-step .nodes {
        position: absolute; left: calc(var(--safe-l) + 64px); right: calc(var(--safe-r) + 64px); top: 340px; z-index: 3;
        display: flex; justify-content: space-between; align-items: center;
      }
      #t1-ov-step .step {
        display: flex; flex-direction: column; align-items: center; width: 320px;
      }
      #t1-ov-step .step-circle {
        width: 120px; height: 120px; border-radius: 50%;
        background: var(--ink); color: var(--paper);
        display: flex; align-items: center; justify-content: center;
        font-weight: var(--wt-black); font-size: calc(64px * var(--type)); font-variant-numeric: tabular-nums;
        border: 6px solid var(--ink); box-shadow: 6px 8px 0 rgba(23,19,14,0.18);
      }
      #t1-ov-step .step-label {
        margin-top: 28px; font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: 0.06em;
        text-transform: uppercase; text-align: center; color: var(--ink);
        line-height: 1.25; max-width: 280px;
      }

      /* yellow dot beneath each circle (connector) */
      #t1-ov-step .step-dot {
        width: 24px; height: 24px; border-radius: 50%;
        background: var(--yellow); border: 4px solid var(--ink);
        margin-top: 20px;
      }

      /* source */
      #t1-ov-step .source {
        position: absolute; left: calc(var(--safe-l) + 64px); bottom: calc(var(--safe-b) + 6px); z-index: 4;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical: the four steps stack as rows (circle left, label right) with the track running
         down through the circles; the horizontal fill segments are hidden. */
      [data-format="vertical"] #t1-ov-step .title, [data-format="square"] #t1-ov-step .title,
      [data-format="vertical"] #t1-ov-step .intro, [data-format="square"] #t1-ov-step .intro {
        left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2);
      }
      [data-format="vertical"] #t1-ov-step .title, [data-format="square"] #t1-ov-step .title {
        top: var(--safe-t); width: max-content; max-width: calc(var(--w) - var(--safe-l) - var(--safe-r) - 56px);
        white-space: normal; text-align: center;
      }
      [data-format="vertical"] #t1-ov-step .title { font-size: calc(64px * var(--type)); }
      [data-format="vertical"] #t1-ov-step .intro, [data-format="square"] #t1-ov-step .intro { top: calc(var(--safe-t) + 116px); width: calc(var(--w) - var(--safe-l) - var(--safe-r)); }
      [data-format="square"] #t1-ov-step .intro { top: calc(var(--safe-t) + 150px); }
      [data-format="vertical"] #t1-ov-step .nodes {
        left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 270px);
        flex-direction: column; align-items: stretch; gap: 36px;
      }
      [data-format="vertical"] #t1-ov-step .step { flex-direction: row; width: auto; }
      [data-format="vertical"] #t1-ov-step .step-circle { flex: 0 0 auto; }
      [data-format="vertical"] #t1-ov-step .step-dot { display: none; }
      [data-format="vertical"] #t1-ov-step .step-label {
        margin: 0 0 0 40px; text-align: left; max-width: none; font-size: calc(30px * var(--type));
      }
      [data-format="vertical"] #t1-ov-step .track-wrap {
        left: calc(var(--safe-l) + 60px - 8px); right: auto; width: 16px;
        top: calc(var(--safe-t) + 270px + 66px - 8px); height: 504px;
      }
      [data-format="vertical"] #t1-ov-step .seg { display: none; }
      [data-format="vertical"] #t1-ov-step .source, [data-format="square"] #t1-ov-step .source { left: var(--safe-l); bottom: var(--safe-b); }
      /* Square: same horizontal stepper with narrower steps, fitted to the safe width. */
      [data-format="square"] #t1-ov-step .nodes { left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 290px); align-items: flex-start; }
      [data-format="square"] #t1-ov-step .track-wrap { left: calc(var(--safe-l) + 110px); right: calc(var(--safe-r) + 110px); top: calc(var(--safe-t) + 290px + 66px - 8px); }
      [data-format="square"] #t1-ov-step .step { width: 220px; }
      [data-format="square"] #t1-ov-step .step-label { max-width: 210px; }
    </style>
  </head>
  <body>
    <div id="t1-ov-step" data-composition-id="t1-ov-step" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="title" data-slot="title">THE PROCESS</div>
      <div class="intro" data-slot="intro">Four steps from raw idea to finished product.</div>

      <!-- track -->
      <div class="track-wrap">
        <div class="track-bg"></div>
        <!-- 4 segments covering 0→33%, 33→66%, 66→100% of the gap spans -->
        <div class="seg seg1" style="left:calc(16.67% - 4px); width:16.67%;"></div>
        <div class="seg seg2" style="left:calc(33.33% - 4px); width:16.67%;"></div>
        <div class="seg seg3" style="left:calc(50%   - 4px); width:16.67%;"></div>
      </div>

      <!-- step nodes -->
      <div class="nodes">
        <div class="step step1">
          <div class="step-circle">1</div>
          <div class="step-dot"></div>
          <div class="step-label" data-slot="step1">Research &amp; Scope</div>
        </div>
        <div class="step step2">
          <div class="step-circle">2</div>
          <div class="step-dot"></div>
          <div class="step-label" data-slot="step2">Design &amp; Prototype</div>
        </div>
        <div class="step step3">
          <div class="step-circle">3</div>
          <div class="step-dot"></div>
          <div class="step-label" data-slot="step3">Build &amp; Test</div>
        </div>
        <div class="step step4">
          <div class="step-circle">4</div>
          <div class="step-dot"></div>
          <div class="step-label" data-slot="step4">Launch &amp; Iterate</div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · PROCESS DOC</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker
      tl.fromTo("#t1-ov-step .grain", { backgroundPosition: "0px 0px" },
        { backgroundPosition: "170px 90px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // title snaps in
      tl.from("#t1-ov-step .title",
        { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.35, ease: "power3.out" }, 0.15);
      tl.from("#t1-ov-step .intro",
        { autoAlpha: 0, y: 14, duration: 0.3 }, 0.42);

      // track background appears
      tl.from("#t1-ov-step .track-bg",
        { autoAlpha: 0, y: 20, duration: 0.25, ease: "power2.out" }, 0.5);

      // step 1 pops, then seg1 fills, step 2 pops, seg2 fills, etc.
      const steps = [".step1", ".step2", ".step3", ".step4"];
      const segs  = [".seg1",  ".seg2",  ".seg3"];

      steps.forEach((sel, i) => {
        const t = 0.62 + i * 0.38;
        tl.from("#t1-ov-step " + sel + " .step-circle",
          { autoAlpha: 0, scale: 0, transformOrigin: "center center", duration: 0.3, ease: "back.out(1.8)" }, t);
        tl.from("#t1-ov-step " + sel + " .step-dot",
          { autoAlpha: 0, scale: 0, duration: 0.2, ease: "back.out(2)" }, t + 0.12);
        tl.from("#t1-ov-step " + sel + " .step-label",
          { autoAlpha: 0, y: 18, duration: 0.3, ease: "power3.out" }, t + 0.18);
        // fill the segment that follows this step (except after last step)
        if (i < segs.length) {
          tl.to("#t1-ov-step " + segs[i],
            { scaleX: 1, duration: 0.22, ease: "steps(5)" }, t + 0.28);
        }
      });

      tl.from("#t1-ov-step .source", { autoAlpha: 0, duration: 0.3 }, 2.2);
      tl.set({}, {}, 7);

      window.__timelines["t1-ov-step"] = tl;
    </script>
  </body>
</html>
