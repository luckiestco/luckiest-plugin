<!doctype html>
<!--
  PAPER COLLAGE · tier1 · stat · RANKING BARS
  4 horizontal bars stacked vertically; each row = category label + kraft track
  with yellow fill at a deterministic width + a value at the fill head.
  Top bar is the hero (longest). Bars wipe scaleX staggered with steps.
  Slots: kicker, rowL1..rowL4 (labels), rowV1..rowV4 (values), label (richtext), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-rank {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-rank .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-rank .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-rank .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 54%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-rank .kicker {
        position: absolute; left: calc(var(--safe-l) + 34px); top: calc(var(--safe-t) + 34px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* chart area */
      #t1-stat-rank .chart {
        position: absolute; left: calc(var(--safe-l) + 34px); right: calc(var(--safe-r) + 34px); top: calc(var(--safe-t) + 106px);
      }
      #t1-stat-rank .row {
        display: flex; align-items: center; margin-bottom: 32px;
      }
      #t1-stat-rank .row-label {
        flex: 0 0 340px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: calc(30px * var(--type)); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted); text-align: right;
        padding-right: 32px;
      }
      #t1-stat-rank .row.hero .row-label {
        font-weight: var(--wt-black); color: var(--ink); font-size: calc(34px * var(--type));
      }
      #t1-stat-rank .track {
        flex: 1; height: 90px; position: relative;
        background: var(--paper-2); box-shadow: inset 0 0 0 3px var(--ink);
      }
      #t1-stat-rank .row.hero .track { height: 116px; }
      #t1-stat-rank .fill {
        position: absolute; inset: 0; background: var(--paper-2); transform-origin: left center;
      }
      #t1-stat-rank .row.hero .fill { background: var(--yellow); box-shadow: 3px 0 0 0 var(--ink); }
      #t1-stat-rank .row:not(.hero) .fill { background: var(--paper-2); filter: brightness(0.88); box-shadow: 3px 0 0 0 rgba(23,19,14,0.35); }
      #t1-stat-rank .row-val {
        position: absolute; top: 50%; transform: translateY(-50%);
        right: 18px; z-index: 3; font-weight: var(--wt-black); font-family: var(--font-display);
        font-variant-numeric: tabular-nums; color: var(--ink);
      }
      #t1-stat-rank .row.hero .row-val { font-size: calc(78px * var(--type)); line-height: 1; }
      #t1-stat-rank .row:not(.hero) .row-val { font-size: calc(54px * var(--type)); line-height: 1; color: rgba(23,19,14,0.7); }
      #t1-stat-rank .label {
        position: absolute; left: calc(var(--safe-l) + 34px); right: calc(var(--safe-r) + 34px); bottom: calc(var(--safe-b) + 94px);
        font-weight: var(--wt-thin); font-size: calc(52px * var(--type)); line-height: 1.06;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-rank .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-rank .source {
        position: absolute; left: calc(var(--safe-l) + 34px); bottom: calc(var(--safe-b) + 34px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical: each row label sits above its bar, bars span the safe width. Square: rows keep the
         label column, narrower. Both: label and source at the safe bottom. */
      [data-format="vertical"] #t1-stat-rank .kicker, [data-format="square"] #t1-stat-rank .kicker { left: var(--safe-l); top: var(--safe-t); }
      [data-format="vertical"] #t1-stat-rank .chart, [data-format="square"] #t1-stat-rank .chart { left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 70px); }
      [data-format="vertical"] #t1-stat-rank .row { flex-direction: column; align-items: stretch; margin-bottom: 28px; }
      [data-format="vertical"] #t1-stat-rank .row-label { flex: none; text-align: left; padding: 0 0 8px 0; }
      [data-format="vertical"] #t1-stat-rank .track { flex: none; height: 84px; }
      [data-format="vertical"] #t1-stat-rank .row.hero .track { height: 108px; }
      [data-format="square"] #t1-stat-rank .row-label { flex: 0 0 270px; padding-right: 24px; }
      [data-format="square"] #t1-stat-rank .row { margin-bottom: 40px; }
      [data-format="square"] #t1-stat-rank .track { height: 104px; }
      [data-format="square"] #t1-stat-rank .row.hero .track { height: 130px; }
      [data-format="vertical"] #t1-stat-rank .label, [data-format="square"] #t1-stat-rank .label { left: var(--safe-l); right: var(--safe-r); bottom: calc(var(--safe-b) + 60px); }
      [data-format="vertical"] #t1-stat-rank .source, [data-format="square"] #t1-stat-rank .source { left: var(--safe-l); bottom: var(--safe-b); }
    </style>
  </head>
  <body>
    <div id="t1-stat-rank" data-composition-id="t1-stat-rank" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">TOP PLATFORMS</div>

      <div class="chart">
        <!-- row 1 - hero (widest) -->
        <div class="row hero" data-fill="0.92">
          <div class="row-label" data-slot="rowL1">Short-Form Video</div>
          <div class="track">
            <div class="fill"><div class="row-val" data-slot="rowV1">92%</div></div>
          </div>
        </div>
        <!-- row 2 -->
        <div class="row" data-fill="0.64">
          <div class="row-label" data-slot="rowL2">Live Streaming</div>
          <div class="track">
            <div class="fill"><div class="row-val" data-slot="rowV2">64%</div></div>
          </div>
        </div>
        <!-- row 3 -->
        <div class="row" data-fill="0.41">
          <div class="row-label" data-slot="rowL3">Long-Form Content</div>
          <div class="track">
            <div class="fill"><div class="row-val" data-slot="rowV3">41%</div></div>
          </div>
        </div>
        <!-- row 4 -->
        <div class="row" data-fill="0.23">
          <div class="row-label" data-slot="rowL4">Podcast / Audio</div>
          <div class="track">
            <div class="fill"><div class="row-val" data-slot="rowV4">23%</div></div>
          </div>
        </div>
      </div>

      <div class="label" data-slot="label">ranked by <em>creator adoption</em> in 2026</div>
      <div class="source" data-slot="source">SOURCE · CREATOR SURVEY 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Set fill widths from data-fill on each row
      document.querySelectorAll("#t1-stat-rank .row").forEach(function(row) {
        var frac = parseFloat(row.getAttribute("data-fill")) || 0;
        var fill = row.querySelector(".fill");
        if (fill) fill.style.width = (frac * 100) + "%";
      });

      var tl = gsap.timeline({ paused: true });
      gsap.set("#t1-stat-rank .fill", { scaleX: 0 }); // was a CSS transform; GSAP owns it now

      // Grain flicker - finite repeat exactly like reference
      tl.fromTo("#t1-stat-rank .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // Kicker snaps in
      tl.from("#t1-stat-rank .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2);

      // Row labels stagger in
      tl.from("#t1-stat-rank .row-label", { autoAlpha: 0, x: -16, duration: 0.28, ease: "back.out(2.2)", stagger: 0.08 }, 0.32);

      // Track boxes appear
      tl.from("#t1-stat-rank .track", { autoAlpha: 0, duration: 0.2, stagger: 0.08 }, 0.38);

      // Fills wipe in staggered with steps
      tl.to("#t1-stat-rank .fill", { scaleX: 1, duration: 0.55, ease: "steps(7)", stagger: 0.1 }, 0.55);

      // Values pop in
      tl.from("#t1-stat-rank .row-val", { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2.2)", stagger: 0.1 }, 0.95);

      // Label + source
      tl.from("#t1-stat-rank .label",  { autoAlpha: 0, y: 18, duration: 0.38, ease: "power3.out" }, 1.3);
      tl.from("#t1-stat-rank .source", { autoAlpha: 0, duration: 0.28 }, 1.55);

      tl.set({}, {}, 6);
      window.__timelines["t1-stat-rank"] = tl;
    </script>
  </body>
</html>
