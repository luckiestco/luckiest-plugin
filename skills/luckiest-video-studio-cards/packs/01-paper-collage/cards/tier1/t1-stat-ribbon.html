<!doctype html>
<!--
  PAPER COLLAGE · tier1 · stat · RANK RIBBON
  A prize-ribbon ranking treatment: big ordinal number drops in, then a notched
  yellow banner/sash unfurls beneath it carrying a label. The banner uses a
  clip-path with forked ends - like a 1st-place prize ribbon. No arrows.
  Slots: kicker, stat (e.g. "#1" or "1st"), bannerLabel, label (richtext <em>), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-ribbon {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-ribbon .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-ribbon .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-ribbon .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 42%, transparent 52%, rgba(23,19,14,0.18) 100%);
      }

      /* kicker */
      #t1-stat-ribbon .kicker {
        position: absolute; left: calc(var(--safe-l) + 34px); top: calc(var(--safe-t) + 166px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }

      /* big ordinal number - centred horizontally */
      #t1-stat-ribbon .stat-wrap {
        position: absolute; left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 206px);
        display: flex; justify-content: center;
      }
      #t1-stat-ribbon .stat {
        font-weight: var(--wt-black); font-size: calc(420px * var(--type)); line-height: 1;
        letter-spacing: -0.06em; color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      /* ribbon banner - notched/forked ends via clip-path */
      #t1-stat-ribbon .ribbon-wrap {
        position: absolute; left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 626px);
        display: flex; justify-content: center;
        transform-origin: center center;
      }
      #t1-stat-ribbon .ribbon {
        position: relative; width: 1140px; height: 110px;
        background: var(--yellow);
        /* forked-end notch: cut triangles into left and right edges */
        clip-path: polygon(
          0%    0%,
          4.4%  50%,
          0%    100%,
          100%  100%,
          95.6% 50%,
          100%  0%
        );
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 28px rgba(23,19,14,0.22);
      }
      /* thin ink border illusion via a slightly-larger pseudo */
      #t1-stat-ribbon .ribbon::before {
        content: ""; position: absolute; inset: -4px;
        background: var(--ink);
        clip-path: polygon(
          0%    0%,
          4.4%  50%,
          0%    100%,
          100%  100%,
          95.6% 50%,
          100%  0%
        );
        z-index: -1;
      }
      #t1-stat-ribbon .banner-label {
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: calc(40px * var(--type)); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink);
        pointer-events: none; z-index: 2;
      }

      /* two short ink stripes flanking the banner for depth */
      #t1-stat-ribbon .stripe {
        position: absolute; width: 18px; height: 90px; background: var(--orange);
        top: calc(var(--safe-t) + 636px);
      }
      #t1-stat-ribbon .stripe.l { left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2 - 570px - 18px); }
      #t1-stat-ribbon .stripe.r { right: calc(var(--safe-r) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2 - 570px - 18px); }

      /* label text below */
      #t1-stat-ribbon .label {
        position: absolute; left: calc(var(--safe-l) + 34px); right: calc(var(--safe-r) + 34px); bottom: calc(var(--safe-b) + 146px);
        font-weight: var(--wt-thin); font-size: calc(58px * var(--type)); line-height: 1.08;
        letter-spacing: var(--track-tight); color: var(--ink); text-align: center;
      }
      #t1-stat-ribbon .label em {
        font-style: italic; font-weight: var(--wt-black);
      }
      #t1-stat-ribbon .source {
        position: absolute; left: calc(var(--safe-l) + 34px); bottom: calc(var(--safe-b) + 42px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical and square: narrower ribbon and stripes centered on the safe box under the
         number; kicker on the safe top, label and source on the safe bottom. */
      [data-format="vertical"] #t1-stat-ribbon .kicker, [data-format="square"] #t1-stat-ribbon .kicker { left: var(--safe-l); top: var(--safe-t); }
      [data-format="vertical"] #t1-stat-ribbon .stat-wrap { top: calc(var(--safe-t) + 60px); }
      [data-format="vertical"] #t1-stat-ribbon .ribbon-wrap { top: calc(var(--safe-t) + 600px); }
      [data-format="vertical"] #t1-stat-ribbon .stripe { top: calc(var(--safe-t) + 610px); }
      [data-format="vertical"] #t1-stat-ribbon .ribbon { width: 680px; }
      [data-format="vertical"] #t1-stat-ribbon .banner-label { font-size: calc(28px * var(--type)); }
      [data-format="vertical"] #t1-stat-ribbon .stripe.l { left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2 - 340px - 18px); }
      [data-format="vertical"] #t1-stat-ribbon .stripe.r { right: calc(var(--safe-r) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2 - 340px - 18px); }
      [data-format="square"] #t1-stat-ribbon .stat-wrap { top: calc(var(--safe-t) + 30px); }
      [data-format="square"] #t1-stat-ribbon .stat { font-size: 360px; }
      [data-format="square"] #t1-stat-ribbon .ribbon-wrap { top: calc(var(--safe-t) + 430px); }
      [data-format="square"] #t1-stat-ribbon .stripe { top: calc(var(--safe-t) + 440px); }
      [data-format="square"] #t1-stat-ribbon .ribbon { width: 840px; }
      [data-format="square"] #t1-stat-ribbon .banner-label { font-size: 34px; }
      [data-format="square"] #t1-stat-ribbon .stripe.l { left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2 - 420px - 18px); }
      [data-format="square"] #t1-stat-ribbon .stripe.r { right: calc(var(--safe-r) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2 - 420px - 18px); }
      [data-format="vertical"] #t1-stat-ribbon .label, [data-format="square"] #t1-stat-ribbon .label { left: var(--safe-l); right: var(--safe-r); bottom: calc(var(--safe-b) + 60px); text-wrap: balance; }
      [data-format="vertical"] #t1-stat-ribbon .source, [data-format="square"] #t1-stat-ribbon .source { left: var(--safe-l); bottom: var(--safe-b); }
    </style>

  </head>
  <body>
    <div id="t1-stat-ribbon" data-composition-id="t1-stat-ribbon" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">GLOBAL RANKING</div>
      <div class="stat-wrap">
        <div class="stat" data-slot="stat">#1</div>
      </div>
      <div class="stripe l"></div>
      <div class="stripe r"></div>
      <div class="ribbon-wrap">
        <div class="ribbon">
          <div class="banner-label" data-slot="bannerLabel">MOST WATCHED CHANNEL</div>
        </div>
      </div>
      <div class="label" data-slot="label">ranked above every <em>legacy broadcaster</em></div>
      <div class="source" data-slot="source">SOURCE · RANKINGS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker
      tl.fromTo("#t1-stat-ribbon .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // kicker snaps in
      tl.from("#t1-stat-ribbon .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2);

      // big number drops + bounces
      tl.from("#t1-stat-ribbon .stat", {
        autoAlpha: 0, y: -80, duration: 0.45, ease: "back.out(2.2)"
      }, 0.32);

      // stripes snap in
      tl.from("#t1-stat-ribbon .stripe", {
        autoAlpha: 0, scaleY: 0, transformOrigin: "top center", duration: 0.2, ease: "steps(3)", stagger: 0.06
      }, 0.72);

      // ribbon unfurls from center outward via scaleX
      tl.fromTo("#t1-stat-ribbon .ribbon-wrap",
        { scaleX: 0, autoAlpha: 1 },
        { scaleX: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.78);

      // banner label fades after ribbon lands
      tl.from("#t1-stat-ribbon .banner-label", { autoAlpha: 0, duration: 0.25, ease: "steps(3)" }, 1.15);

      // label and source
      tl.from("#t1-stat-ribbon .label", { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.3);
      tl.from("#t1-stat-ribbon .source", { autoAlpha: 0, duration: 0.3 }, 1.6);

      tl.set({}, {}, 6);
      window.__timelines["t1-stat-ribbon"] = tl;
    </script>
  </body>
</html>
