<!doctype html>
<!--
  PAPER COLLAGE · tier1 · section · NUMERAL
  Giant ghost chapter number (outline) fills the frame; title overlaid.
  Slots: number, kicker, headline (<em> emphasis).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-num {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-num .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-num .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 5;
      }
      #t1-sec-num .ghost {
        position: absolute; right: calc(var(--safe-r) + 130px); top: 50%; transform: translateY(-50%);
        font-weight: var(--wt-black); font-style: italic; font-size: calc(1280px * var(--type)); line-height: 0.7;
        color: transparent; -webkit-text-stroke: 5px rgba(23,19,14,0.16);
        z-index: 1; user-select: none;
      }
      #t1-sec-num .kicker {
        position: absolute; left: calc(var(--safe-l) + 54px); top: calc(var(--safe-t) + 306px); z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink);
      }
      #t1-sec-num .kicker::before { content: ""; display: inline-block; width: 56px; height: 3px; background: var(--red); margin-right: 16px; vertical-align: middle; }
      #t1-sec-num .headline {
        position: absolute; left: calc(var(--safe-l) + 54px); top: calc(var(--safe-t) + 356px); width: 1180px; z-index: 3;
        font-weight: var(--wt-black); font-size: calc(138px * var(--type)); line-height: 0.95;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-num .headline em { font-style: italic; font-weight: var(--wt-thin); }
      #t1-sec-num .underline { position: absolute; left: calc(var(--safe-l) + 58px); top: calc(var(--safe-t) + 666px); width: 0; height: 8px; background: var(--yellow); z-index: 2; }

      /* Vertical and square: the ghost numeral fills the safe box behind the text (vertical) or
         its right side (square); kicker, headline and underline stack on the left. */
      [data-format="vertical"] #t1-sec-num .ghost { right: calc(var(--safe-r) + 110px); top: calc((var(--h) + var(--safe-t) - var(--safe-b)) / 2); font-size: calc(900px * var(--type)); }
      [data-format="square"] #t1-sec-num .ghost { right: calc(var(--safe-r) + 100px); font-size: 1000px; }
      [data-format="vertical"] #t1-sec-num .kicker, [data-format="square"] #t1-sec-num .kicker { left: var(--safe-l); }
      [data-format="vertical"] #t1-sec-num .headline, [data-format="square"] #t1-sec-num .headline { left: var(--safe-l); width: calc(var(--w) - var(--safe-l) - var(--safe-r)); }
      [data-format="vertical"] #t1-sec-num .underline, [data-format="square"] #t1-sec-num .underline { left: calc(var(--safe-l) + 4px); }
      [data-format="vertical"] #t1-sec-num .kicker { top: calc(var(--safe-t) + 330px); }
      [data-format="vertical"] #t1-sec-num .headline { top: calc(var(--safe-t) + 380px); font-size: calc(110px * var(--type)); }
      [data-format="vertical"] #t1-sec-num .underline { top: calc(var(--safe-t) + 800px); }
      [data-format="square"] #t1-sec-num .kicker { top: calc(var(--safe-t) + 230px); }
      [data-format="square"] #t1-sec-num .headline { top: calc(var(--safe-t) + 280px); width: 640px; font-size: 116px; }
      [data-format="square"] #t1-sec-num .underline { top: calc(var(--safe-t) + 640px); }
    </style>
  </head>
  <body>
    <div id="t1-sec-num" data-composition-id="t1-sec-num" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="ghost" data-slot="number">3</div>
      <div class="underline"></div>
      <div class="kicker" data-slot="kicker">CHAPTER THREE</div>
      <div class="headline" data-slot="headline">When the <em>money</em> moved</div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-num .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-num .ghost", { autoAlpha: 0, scale: 1.25, x: 120, transformOrigin: "70% 50%", duration: 0.7, ease: "power3.out" }, 0.1)
        .from("#t1-sec-num .kicker", { autoAlpha: 0, x: -26, duration: 0.3, ease: "steps(4)" }, 0.5)
        .from("#t1-sec-num .headline", { autoAlpha: 0, y: 28, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.6)
        .to("#t1-sec-num .underline", { width: 420, duration: 0.5, ease: "power2.out" }, 0.95)
        .set({}, {}, 6);
      window.__timelines["t1-sec-num"] = tl;
    </script>
  </body>
</html>
