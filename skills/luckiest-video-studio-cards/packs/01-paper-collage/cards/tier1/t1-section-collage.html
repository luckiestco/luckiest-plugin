<!doctype html>
<!--
  PAPER COLLAGE · tier1 · section · COLLAGE
  Title surrounded by scattered floating cutouts, circles, scribbles on crumpled
  paper. The busy hero collage. Pieces pop in choppily from all directions.
  Slots: kicker, line1, line2 (marker word), wordmark, scrap1/2/3 (images).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-collage {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-collage .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-collage .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.5; pointer-events: none;
      }
      #t1-sec-collage .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 120% at 50% 50%, transparent 52%, rgba(23,19,14,0.18) 100%);
      }
      /* scattered scraps (halftone placeholders) */
      #t1-sec-collage .scrap {
        position: absolute; background-color: var(--paper-2);
        background-image: var(--tex-halftone); background-size: var(--tex-halftone-size);
        box-shadow: 8px 12px 0 rgba(23,19,14,0.12);
      }
      #t1-sec-collage .s1 { left: calc(var(--safe-l) + 24px); top: calc(var(--safe-t) + 96px); width: 300px; height: 220px; outline: 8px solid var(--ink); outline-offset: -8px; transform: rotate(-5deg); }
      #t1-sec-collage .s2 { right: calc(var(--safe-r) + 34px); top: calc(var(--safe-t) + 66px); width: 360px; height: 250px; outline: 8px solid var(--yellow); outline-offset: -8px; transform: rotate(4deg); }
      #t1-sec-collage .s3 { right: calc(var(--safe-r) + 104px); bottom: calc(var(--safe-b) + 76px); width: 280px; height: 330px; outline: 8px solid var(--orange); outline-offset: -8px; transform: rotate(-3deg); }
      /* shapes */
      #t1-sec-collage .ycirc { position: absolute; left: calc(var(--safe-l) + 54px); bottom: calc(var(--safe-b) + 106px); width: 220px; height: 220px; background: var(--yellow); border-radius: 50%; }
      #t1-sec-collage .wordmark {
        position: absolute; left: calc(var(--safe-l) + 92px); bottom: calc(var(--safe-b) + 144px); width: 150px; text-align: center; z-index: 4;
        font-style: italic; font-weight: var(--wt-black); font-size: calc(70px * var(--type)); color: var(--ink);
      }
      /* title */
      #t1-sec-collage .title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1100px; text-align: center; z-index: 3; }
      #t1-sec-collage .kicker {
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted); margin-bottom: 18px;
      }
      #t1-sec-collage .l1 { display: block; font-weight: var(--wt-black); font-size: calc(128px * var(--type)); line-height: 0.96; letter-spacing: var(--track-tight); }
      #t1-sec-collage .l2 { display: inline-block; margin-top: 10px; font-weight: var(--wt-black); font-style: italic; font-size: calc(128px * var(--type)); line-height: 1.0; letter-spacing: var(--track-tight); background: var(--yellow); padding: 0 22px; transform: skewX(var(--marker-skew)); }
      /* Vertical and square: scraps pinned to the safe corners, title centered across the safe
         width between them, wordmark circle at the safe bottom left. */
      [data-format="vertical"] #t1-sec-collage .title, [data-format="square"] #t1-sec-collage .title {
        left: var(--safe-l); transform: none; width: calc(var(--w) - var(--safe-l) - var(--safe-r));
      }
      [data-format="vertical"] #t1-sec-collage .title { top: calc(var(--safe-t) + 250px); }
      [data-format="square"] #t1-sec-collage .title { top: calc(var(--safe-t) + 230px); }
      [data-format="vertical"] #t1-sec-collage .l1, [data-format="vertical"] #t1-sec-collage .l2 { font-size: calc(90px * var(--type)); }
      [data-format="square"] #t1-sec-collage .l1, [data-format="square"] #t1-sec-collage .l2 { font-size: 96px; }
      [data-format="vertical"] #t1-sec-collage .s1 { left: var(--safe-l); top: var(--safe-t); width: 250px; height: 180px; }
      [data-format="vertical"] #t1-sec-collage .s2 { right: var(--safe-r); top: calc(var(--safe-t) + 30px); width: 290px; height: 200px; }
      [data-format="vertical"] #t1-sec-collage .s3 { right: var(--safe-r); bottom: var(--safe-b); width: 230px; height: 260px; }
      [data-format="square"] #t1-sec-collage .s1 { left: var(--safe-l); top: var(--safe-t); width: 230px; height: 160px; }
      [data-format="square"] #t1-sec-collage .s2 { right: var(--safe-r); top: var(--safe-t); width: 270px; height: 180px; }
      [data-format="square"] #t1-sec-collage .s3 { right: var(--safe-r); bottom: var(--safe-b); width: 200px; height: 230px; }
      [data-format="vertical"] #t1-sec-collage .ycirc, [data-format="square"] #t1-sec-collage .ycirc { left: calc(var(--safe-l) + 10px); bottom: var(--safe-b); width: 210px; height: 210px; }
      [data-format="vertical"] #t1-sec-collage .wordmark, [data-format="square"] #t1-sec-collage .wordmark { left: calc(var(--safe-l) - 10px); bottom: calc(var(--safe-b) + 60px); width: 250px; }
    </style>
  </head>
  <body>
    <div id="t1-sec-collage" data-composition-id="t1-sec-collage" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="scrap s1" data-slot="scrap1"></div>
      <div class="scrap s2" data-slot="scrap2"></div>
      <div class="scrap s3" data-slot="scrap3"></div>
      <div class="ycirc"></div>
      <div class="wordmark" data-slot="wordmark">Acme</div>
      <div class="title">
        <div class="kicker" data-slot="kicker">HOW IT WORKS</div>
        <span class="l1" data-slot="line1">Create better</span>
        <span class="l2" data-slot="line2">motion graphics</span>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-collage .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "160px 140px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-collage .s1", { autoAlpha: 0, x: -60, y: -30, rotate: -20, duration: 0.4, ease: "back.out(1.8)" }, 0.15)
        .from("#t1-sec-collage .s2", { autoAlpha: 0, x: 70, y: -30, rotate: 18, duration: 0.4, ease: "back.out(1.8)" }, 0.25)
        .from("#t1-sec-collage .s3", { autoAlpha: 0, x: 60, y: 50, rotate: 16, duration: 0.4, ease: "back.out(1.8)" }, 0.35)
        .from("#t1-sec-collage .ycirc", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2.2)" }, 0.45)
        .from("#t1-sec-collage .kicker", { autoAlpha: 0, y: -12, duration: 0.26, ease: "steps(4)" }, 0.6)
        .from("#t1-sec-collage .l1", { autoAlpha: 0, y: 26, duration: 0.4, ease: "power3.out" }, 0.68)
        .from("#t1-sec-collage .l2", { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.36, ease: "power3.out" }, 0.82)
        .from("#t1-sec-collage .wordmark", { autoAlpha: 0, scale: 0.5, rotate: -20, duration: 0.34, ease: "back.out(2.4)" }, 0.9)
        .set({}, {}, 6.2);
      window.__timelines["t1-sec-collage"] = tl;
    </script>
  </body>
</html>
