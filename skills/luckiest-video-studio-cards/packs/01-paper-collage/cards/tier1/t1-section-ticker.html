<!doctype html>
<!--
  PAPER COLLAGE · tier1 · section · TICKER
  Broadcast layout: title upper on paper, a yellow lower-band ticker with a red
  BREAKING tag. Band slides up, ticker text scrolls a finite amount.
  Slots: tag, headline (<em> emphasis), ticker (band text), kicker.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-ticker {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-ticker .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-ticker .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 5;
      }
      #t1-sec-ticker .kicker {
        position: absolute; left: calc(var(--safe-l) + 54px); top: calc(var(--safe-t) + 196px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      #t1-sec-ticker .headline {
        position: absolute; left: calc(var(--safe-l) + 54px); top: calc(var(--safe-t) + 266px); width: 1500px;
        font-weight: var(--wt-black); font-size: calc(142px * var(--type)); line-height: 0.95;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-ticker .headline em { font-style: normal; background: var(--yellow); padding: 0 14px; }
      /* lower band */
      #t1-sec-ticker .band {
        position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 36px); height: 110px;
        background: var(--yellow); display: flex; align-items: center; overflow: hidden; z-index: 3;
        padding: 0 var(--safe-r) 0 var(--safe-l); box-sizing: border-box;
      }
      #t1-sec-ticker .band .redrule { position: absolute; left: 0; right: 0; top: -10px; height: 10px; background: var(--red); }
      #t1-sec-ticker .tag {
        flex: none; height: 110px; display: flex; align-items: center; padding: 0 34px;
        background: var(--red); color: var(--paper);
        font-family: var(--font-label); font-weight: var(--wt-black); font-size: calc(40px * var(--type));
        letter-spacing: 0.08em; text-transform: uppercase; z-index: 2;
      }
      /* the crawl runs in a window inside the safe insets: one wrapped line wider than the window
         (by the crawl distance) so the text never runs past the frame edge */
      #t1-sec-ticker .tickwin { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; overflow: hidden; }
      #t1-sec-ticker .ticker {
        flex: none; width: calc(100% + 380px); height: 1.25em; line-height: 1.25em; overflow: hidden; padding-left: 40px;
        font-family: var(--font-label); font-weight: var(--wt-bold); font-size: calc(44px * var(--type));
        letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink);
      }

      /* Vertical and square: kicker and headline from the top of the safe area, the band at the
         safe bottom. */
      [data-format="vertical"] #t1-sec-ticker .kicker, [data-format="square"] #t1-sec-ticker .kicker { left: var(--safe-l); top: calc(var(--safe-t) + 40px); }
      [data-format="vertical"] #t1-sec-ticker .headline, [data-format="square"] #t1-sec-ticker .headline {
        left: var(--safe-l); top: calc(var(--safe-t) + 110px); width: calc(var(--w) - var(--safe-l) - var(--safe-r));
      }
      [data-format="vertical"] #t1-sec-ticker .kicker { top: calc(var(--safe-t) + 200px); }
      [data-format="vertical"] #t1-sec-ticker .headline { top: calc(var(--safe-t) + 270px); font-size: calc(112px * var(--type)); }
      [data-format="square"] #t1-sec-ticker .headline { font-size: 120px; }
      [data-format="vertical"] #t1-sec-ticker .band, [data-format="square"] #t1-sec-ticker .band { bottom: var(--safe-b); }
      [data-format="vertical"] #t1-sec-ticker .band, [data-format="vertical"] #t1-sec-ticker .tag { height: 124px; }
      [data-format="square"] #t1-sec-ticker .ticker { padding-left: 60px; }
    </style>
  </head>
  <body>
    <div id="t1-sec-ticker" data-composition-id="t1-sec-ticker" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">DEVELOPING STORY</div>
      <div class="headline" data-slot="headline">The numbers don't <em>add up</em></div>
      <div class="band">
        <div class="redrule"></div>
        <div class="tag" data-slot="tag">BREAKING</div>
        <div class="tickwin"><div class="ticker" data-slot="ticker">What the data really shows  ·  Who knew, and when  ·  The fallout begins  ·  Full story inside</div></div>
      </div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-ticker .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-ticker .kicker", { autoAlpha: 0, x: -24, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-sec-ticker .headline", { autoAlpha: 0, y: 28, clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power3.out" }, 0.32)
        .from("#t1-sec-ticker .band", { yPercent: 130, duration: 0.5, ease: "power3.out" }, 0.7)
        .from("#t1-sec-ticker .tag", { autoAlpha: 0, x: -40, duration: 0.3, ease: "steps(4)" }, 1.0)
        .fromTo("#t1-sec-ticker .ticker", { x: 0 }, { x: -520, duration: 5, ease: "none" }, 1.1);
      tl.set({}, {}, 6);
      window.__timelines["t1-sec-ticker"] = tl;
    </script>
  </body>
</html>
