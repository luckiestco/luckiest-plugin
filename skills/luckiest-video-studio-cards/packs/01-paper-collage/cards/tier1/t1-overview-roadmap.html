<!doctype html>
<!--
  PAPER COLLAGE · tier1 · overview · ROADMAP PATH
  A stylized winding road across the canvas (thick ink path + dashed yellow
  centerline) with 4 milestone stops (numbered square markers, NOT arrowheads).
  Path draws in via stroke-dashoffset, stops pop along it. Title at top.
  Slots: title, intro, stop1, stop2, stop3, stop4, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-road {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-road .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-road .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-ov-road .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(130% 120% at 50% 48%, transparent 55%, rgba(23,19,14,0.16) 100%);
      }

      /* marker title */
      #t1-ov-road .title {
        position: absolute; top: calc(var(--safe-t) + 18px); left: 50%; transform: translateX(-50%) skewX(var(--marker-skew));
        background: var(--yellow); padding: 8px 28px; z-index: 3;
        font-weight: var(--wt-black); font-size: var(--size-title); letter-spacing: var(--track-tight);
        text-transform: uppercase; white-space: nowrap;
      }

      /* intro sub-line */
      #t1-ov-road .intro {
        position: absolute; top: calc(var(--safe-t) + 164px); left: 50%; transform: translateX(-50%);
        width: 1100px; text-align: center; z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-reg);
        font-size: var(--size-body); line-height: 1.4; color: var(--muted);
      }

      /* SVG canvas for the road path */
      #t1-ov-road .road-svg {
        position: absolute; left: 0; top: 280px; width: var(--w); height: 720px; z-index: 2;
      }

      /* milestone stop blocks */
      #t1-ov-road .stops {
        position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); z-index: 4;
        pointer-events: none;
      }
      #t1-ov-road .stop {
        position: absolute;
      }
      #t1-ov-road .stop-pin {
        width: 72px; height: 72px;
        background: var(--ink); color: var(--paper);
        display: flex; align-items: center; justify-content: center;
        font-weight: var(--wt-black); font-size: calc(36px * var(--type)); font-variant-numeric: tabular-nums;
        transform: rotate(45deg);
      }
      #t1-ov-road .stop-num {
        transform: rotate(-45deg); display: block;
      }
      #t1-ov-road .stop-label {
        position: absolute; left: 90px; top: 50%; transform: translateY(-50%);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--ink);
        white-space: nowrap; max-width: 380px;
      }
      /* landscape stop positions on the road (were inline styles) */
      #t1-ov-road .s1 { left: 44px; top: 780px; }
      #t1-ov-road .s2 { left: 604px; top: 400px; }
      #t1-ov-road .s3 { left: 1244px; top: 760px; }
      #t1-ov-road .s4 { left: 1804px; top: 440px; }
      #t1-ov-road .stop .stop-label { left: 90px; top: -4px; transform: none; }
      #t1-ov-road .s4 .stop-label { left: auto; right: 90px; text-align: right; }
      /* the portrait road used in vertical and square */
      #t1-ov-road .road-alt { display: none; position: absolute; z-index: 2; }

      /* source */
      #t1-ov-road .source {
        position: absolute; left: calc(var(--safe-l) + 34px); bottom: calc(var(--safe-b) + 6px); z-index: 7;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical and square: the wide road is swapped for a portrait switchback (.road-alt, an
         800x700 box) and the stops sit on its bends; labels point into the frame. Title and intro
         are centred on the safe box; source at the bottom left of the safe area. */
      [data-format="vertical"] #t1-ov-road .title, [data-format="square"] #t1-ov-road .title,
      [data-format="vertical"] #t1-ov-road .intro, [data-format="square"] #t1-ov-road .intro {
        top: var(--safe-t); left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2);
      }
      [data-format="vertical"] #t1-ov-road .title, [data-format="square"] #t1-ov-road .title {
        width: max-content; max-width: calc(var(--w) - var(--safe-l) - var(--safe-r) - 56px); white-space: normal; text-align: center;
      }
      [data-format="vertical"] #t1-ov-road .title { font-size: calc(64px * var(--type)); }
      [data-format="square"] #t1-ov-road .title { font-size: 80px; }
      [data-format="vertical"] #t1-ov-road .intro, [data-format="square"] #t1-ov-road .intro { top: calc(var(--safe-t) + 112px); width: calc(var(--w) - var(--safe-l) - var(--safe-r)); }
      [data-format="vertical"] #t1-ov-road .road-svg, [data-format="square"] #t1-ov-road .road-svg { display: none; }
      [data-format="vertical"] #t1-ov-road .road-alt, [data-format="vertical"] #t1-ov-road .stops {
        display: block; left: var(--safe-l); top: calc(var(--safe-t) + 250px);
        width: calc(var(--w) - var(--safe-l) - var(--safe-r)); height: calc((var(--w) - var(--safe-l) - var(--safe-r)) * 7 / 8);
      }
      [data-format="square"] #t1-ov-road .road-alt, [data-format="square"] #t1-ov-road .stops {
        display: block; top: calc(var(--safe-t) + 190px); height: 680px; width: calc(680px * 8 / 7);
        left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r) - 680px * 8 / 7) / 2);
      }
      /* stop centres on the runs: (100,100) (540,350) (250,600) (720,600) of the 800x700 road box; labels hang below the pins */
      [data-format="vertical"] #t1-ov-road .s1, [data-format="square"] #t1-ov-road .s1 { left: calc(100 / 800 * 100% - 36px); top: calc(100 / 700 * 100% - 36px); }
      [data-format="vertical"] #t1-ov-road .s2, [data-format="square"] #t1-ov-road .s2 { left: calc(540 / 800 * 100% - 36px); top: calc(350 / 700 * 100% - 36px); }
      [data-format="vertical"] #t1-ov-road .s3, [data-format="square"] #t1-ov-road .s3 { left: calc(250 / 800 * 100% - 36px); top: calc(600 / 700 * 100% - 36px); }
      [data-format="vertical"] #t1-ov-road .s4, [data-format="square"] #t1-ov-road .s4 { left: calc(720 / 800 * 100% - 36px); top: calc(600 / 700 * 100% - 36px); }
      [data-format="vertical"] #t1-ov-road .s2 .stop-label, [data-format="square"] #t1-ov-road .s2 .stop-label { top: 96px; left: auto; right: -20px; text-align: right; }
      [data-format="vertical"] #t1-ov-road .s1 .stop-label, [data-format="square"] #t1-ov-road .s1 .stop-label,
      [data-format="vertical"] #t1-ov-road .s3 .stop-label, [data-format="square"] #t1-ov-road .s3 .stop-label { top: 96px; left: 0; }
      [data-format="vertical"] #t1-ov-road .s4 .stop-label, [data-format="square"] #t1-ov-road .s4 .stop-label { top: 96px; right: -20px; }
      [data-format="vertical"] #t1-ov-road .source, [data-format="square"] #t1-ov-road .source { left: var(--safe-l); bottom: var(--safe-b); }
    </style>
  </head>
  <body>
    <div id="t1-ov-road" data-composition-id="t1-ov-road" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="title" data-slot="title">THE ROADMAP</div>
      <div class="intro" data-slot="intro">Four milestones that define where we're headed.</div>

      <!-- SVG road: a winding cubic bezier path -->
      <svg class="road-svg" viewBox="0 0 1920 720" preserveAspectRatio="none"
           xmlns="http://www.w3.org/2000/svg">
        <!-- thick ink road outline -->
        <path id="road-path"
              d="M 80,560 C 280,560 360,180 640,180 C 920,180 960,540 1280,540 C 1520,540 1640,220 1840,220"
              fill="none" stroke="var(--ink)" stroke-width="56"
              stroke-linecap="round" stroke-linejoin="round"/>
        <!-- paper-colored road surface (slightly narrower) -->
        <path id="road-surface"
              d="M 80,560 C 280,560 360,180 640,180 C 920,180 960,540 1280,540 C 1520,540 1640,220 1840,220"
              fill="none" stroke="var(--paper-2)" stroke-width="40"
              stroke-linecap="round" stroke-linejoin="round"/>
        <!-- dashed yellow centerline -->
        <path id="road-center"
              d="M 80,560 C 280,560 360,180 640,180 C 920,180 960,540 1280,540 C 1520,540 1640,220 1840,220"
              fill="none" stroke="var(--yellow)" stroke-width="6"
              stroke-dasharray="40 28" stroke-linecap="round"/>
      </svg>
      <!-- portrait road for vertical and square: three runs joined by U-turns, down the safe box -->
      <svg class="road-alt" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <path d="M 60,100 L 600,100 C 770,100 770,350 600,350 L 200,350 C 30,350 30,600 200,600 L 740,600" fill="none" stroke="var(--ink)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 60,100 L 600,100 C 770,100 770,350 600,350 L 200,350 C 30,350 30,600 200,600 L 740,600" fill="none" stroke="var(--paper-2)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 60,100 L 600,100 C 770,100 770,350 600,350 L 200,350 C 30,350 30,600 200,600 L 740,600" fill="none" stroke="var(--yellow)" stroke-width="5" stroke-dasharray="32 22" stroke-linecap="round"/>
      </svg>

      <!-- milestone stops - positioned at the 4 path anchor-ish points -->
      <div class="stops">
        <!-- Stop 1: near x=80, y=280+560=840 in comp coords -->
        <div class="stop s1">
          <div class="stop-pin"><span class="stop-num">1</span></div>
          <div class="stop-label" data-slot="stop1">Discovery</div>
        </div>
        <!-- Stop 2: near x=640, y=280+180=460 -->
        <div class="stop s2">
          <div class="stop-pin"><span class="stop-num">2</span></div>
          <div class="stop-label" data-slot="stop2">Planning</div>
        </div>
        <!-- Stop 3: near x=1280, y=280+540=820 -->
        <div class="stop s3">
          <div class="stop-pin"><span class="stop-num">3</span></div>
          <div class="stop-label" data-slot="stop3">Execution</div>
        </div>
        <!-- Stop 4: near x=1840, y=280+220=500 -->
        <div class="stop s4">
          <div class="stop-pin"><span class="stop-num">4</span></div>
          <div class="stop-label" data-slot="stop4">Delivery</div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · STRATEGY DOC</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Measure path length deterministically via SVG API
      const roadPath = document.getElementById("road-path");
      const roadSurface = document.getElementById("road-surface");
      const roadCenter  = document.getElementById("road-center");

      function initPath(el) {
        const len = el.getTotalLength ? el.getTotalLength() : 2400;
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
        return len;
      }
      const pathLen = initPath(roadPath);
      initPath(roadSurface);
      initPath(roadCenter);
      const roadAlt = Array.from(document.querySelectorAll("#t1-ov-road .road-alt path"));
      roadAlt.forEach(initPath);

      const tl = gsap.timeline({ paused: true });

      // grain flicker (finite)
      tl.fromTo("#t1-ov-road .grain", { backgroundPosition: "0px 0px" },
        { backgroundPosition: "140px 120px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // title in
      tl.from("#t1-ov-road .title",
        { autoAlpha: 0, scaleX: 0, transformOrigin: "left center", duration: 0.35, ease: "power3.out" }, 0.15);
      tl.from("#t1-ov-road .intro",
        { autoAlpha: 0, y: 14, duration: 0.3 }, 0.42);

      // road draws in (stepped, choppy)
      tl.to([roadPath, roadSurface, roadCenter].concat(roadAlt),
        { strokeDashoffset: 0, duration: 0.8, ease: "steps(12)" }, 0.55);

      // stops pop along the road
      [".s1", ".s2", ".s3", ".s4"].forEach((sel, i) => {
        const t = 0.9 + i * 0.25;
        tl.from("#t1-ov-road " + sel + " .stop-pin",
          { autoAlpha: 0, scale: 0, transformOrigin: "center center", duration: 0.28, ease: "back.out(1.8)" }, t);
        tl.from("#t1-ov-road " + sel + " .stop-label",
          { autoAlpha: 0, x: 16, duration: 0.25, ease: "power3.out" }, t + 0.12);
      });

      tl.from("#t1-ov-road .source", { autoAlpha: 0, duration: 0.3 }, 2.1);
      tl.set({}, {}, 7);

      window.__timelines["t1-ov-road"] = tl;
    </script>
  </body>
</html>
