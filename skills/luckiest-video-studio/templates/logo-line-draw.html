<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<!-- line-draw logo recipe (luckiest-video-studio). Traces every path of the mark in its own color, fills, holds.
     Fill {{paper}} and {{ink}} from brand.json, {{caption}} from the scene, paste the SVG, keep duration in sync with storyboard.json. --><meta charset="UTF-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:{{paper}}}
#root{width:100%;height:100%;display:grid;place-items:center}
.stage{width:520px;height:560px;display:grid;place-items:center}
.mark{width:100%;height:100%;overflow:visible}
.cap{position:absolute;bottom:110px;width:100%;text-align:center;font:500 28px/1 Inter,system-ui,sans-serif;letter-spacing:.32em;color:{{ink}};opacity:0}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stage clip" data-start="0" data-duration="6" data-track-index="0">
<!--LOGO_SVG: paste the logo <svg> here and add class="mark" to it--></div>
  <div class="cap clip" data-start="0" data-duration="6" data-track-index="1">{{caption}}</div>
</div>
<script>
const mark=document.querySelector(".mark");const bb=mark.getBBox();const pad=Math.max(bb.width,bb.height)*0.04;mark.setAttribute("viewBox",[bb.x-pad,bb.y-pad,bb.width+2*pad,bb.height+2*pad].join(" "));
const paths=[...document.querySelectorAll(".mark path")];
const tl=gsap.timeline({paused:true});
paths.forEach((p,i)=>{
  const fill=getComputedStyle(p).fill; const len=p.getTotalLength();
  p.style.stroke=fill; p.style.strokeWidth="2.4"; p.style.fillOpacity=0;
  p.style.strokeDasharray=len+" "+len; p.style.strokeDashoffset=len;
  tl.to(p,{strokeDashoffset:0,duration:1.9,ease:"power1.out"},i*0.12);
  tl.to(p,{fillOpacity:1,duration:0.7,ease:"power2.out"},1.9+i*0.08);
  tl.to(p,{strokeWidth:0,duration:0.5,ease:"power1.out"},2.3+i*0.08);
});
tl.fromTo(".stage",{scale:0.94},{scale:1,duration:3.2,ease:"power3.out"},0);
tl.to(".cap",{opacity:1,duration:0.6,ease:"power2.out"},2.9);
tl.to({},{duration:6},0);
window.__timelines=window.__timelines||{}; window.__timelines["main"]=tl; tl.seek(0);
</script>
</body></html>
