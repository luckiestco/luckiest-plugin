<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<!-- line-draw logo recipe (luckiest-video-studio). Traces every path of the mark in its own color, fills, holds.
     Fill {{paper}} and {{ink}} from brand.json, {{caption}} from the scene, paste the SVG, keep duration in sync with storyboard.json.
     Sized with --u and the safe tokens, so it renders landscape, vertical, and square from this one file. --><meta charset="UTF-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* Master size defaults. render-scenes.mjs appends the real --w, --h, --u and safe tokens for each format. */
:root{--w:1920px;--h:1080px;--u:10.8px;--safe-t:54px;--safe-b:54px;--safe-l:96px;--safe-r:96px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:{{paper}}}
#root{width:100%;height:100%}
/* Centered in the safe area, not the frame: the vertical safe area sits high to clear the platform UI. */
.stage{position:absolute;inset:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);margin:auto;width:calc(var(--u)*48);height:calc(var(--u)*52);display:grid;place-items:center}
.mark{width:100%;height:100%;overflow:visible}
.cap{position:absolute;left:var(--safe-l);right:var(--safe-r);bottom:calc(var(--safe-b) + var(--u)*5);text-align:center;font:500 calc(var(--u)*2.6)/1.3 Inter,system-ui,sans-serif;letter-spacing:.32em;color:{{ink}};opacity:0}
/* Phones show the whole frame smaller: a bigger mark and 25% larger caption. */
[data-format=vertical] .stage{width:calc(var(--u)*56);height:calc(var(--u)*60)}
[data-format=vertical] .cap{font-size:calc(var(--u)*3.2)}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="stage clip" data-start="0" data-duration="6" data-track-index="0">
<!--LOGO_SVG: paste the logo <svg> here and add class="mark" to it--></div>
  <div class="cap clip" data-start="0" data-duration="6" data-track-index="1">{{caption}}</div>
</div>
<script>
const mark=document.querySelector(".mark");const bb=mark.getBBox();const pad=Math.max(bb.width,bb.height)*0.04;mark.setAttribute("viewBox",[bb.x-pad,bb.y-pad,bb.width+2*pad,bb.height+2*pad].join(" "));
const paths=[...document.querySelectorAll(".mark path")];
const tl=gsap.timeline({paused:true});
paths.forEach((p,i)=>{
  const fill=getComputedStyle(p).fill; const len=p.getTotalLength();
  p.style.stroke=fill; p.style.strokeWidth="2.4"; p.style.fillOpacity=0;
  p.style.strokeDasharray=len+" "+len; p.style.strokeDashoffset=len;
  tl.to(p,{strokeDashoffset:0,duration:1.9,ease:"power1.out"},i*0.12);
  tl.to(p,{fillOpacity:1,duration:0.7,ease:"power2.out"},1.9+i*0.08);
  tl.to(p,{strokeWidth:0,duration:0.5,ease:"power1.out"},2.3+i*0.08);
});
tl.fromTo(".stage",{scale:0.94},{scale:1,duration:3.2,ease:"power3.out"},0);
tl.to(".cap",{opacity:1,duration:0.6,ease:"power2.out"},2.9);
tl.to({},{duration:6},0);
window.__timelines=window.__timelines||{}; window.__timelines["main"]=tl; tl.seek(0);
</script>
</body></html>
