<!doctype html>
<!--
  AURORA GLASS · tier2 · lower-third · TITLEBAR
  Slim wide horizontal glass bar (anchored lower edge), name left, role right,
  accent edge-light on left border. Bar wipes in from left.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/aurora-glass/tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-tbar {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        /* the lower-third group's anchor: left / bottom of the main card */
        --lt-x: var(--safe-l); --lt-y: calc(var(--safe-b) + 54px);
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind the bar */
      #t2-lt-tbar .local-bloom {
        position: absolute;
        left: calc(var(--lt-x) - 20px); bottom: calc(var(--lt-y) - 26px);
        width: 820px; height: 160px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 80%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.06) 55%,
          transparent 75%);
        filter: blur(40px);
        pointer-events: none;
        z-index: 1;
      }

      /* Bar wrapper - clips the wipe */
      #t2-lt-tbar .bar-clip {
        position: absolute;
        left: var(--lt-x); bottom: var(--lt-y);
        width: 800px;
        overflow: hidden;
        border-radius: var(--radius-sm);
        z-index: 2;
      }

      /* The actual bar */
      #t2-lt-tbar .bar {
        display: flex;
        align-items: center;
        width: 100%;
        padding: 18px 28px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius-sm);
        border: var(--stroke) solid var(--glass-border);
        box-shadow:
          var(--glass-shadow),
          0 0 0 1.5px rgba(var(--accent-rgb), 0.40),
          0 0 16px rgba(var(--accent-rgb), 0.14),
          inset 0 1px 0 var(--glass-hi);
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
      }

      /* Accent left edge-light */
      #t2-lt-tbar .bar::before {
        content: "";
        position: absolute; left: 0; top: 6px; bottom: 6px;
        width: 3px;
        border-radius: 2px;
        background: var(--accent);
        box-shadow:
          0 0 8px rgba(var(--accent-rgb), 0.90),
          0 0 22px rgba(var(--accent-rgb), 0.55);
      }

      /* Top highlight */
      #t2-lt-tbar .bar::after {
        content: "";
        position: absolute; top: 0; left: 16px; right: 16px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45) 40%, rgba(255,255,255,0.45) 60%, transparent);
      }

      /* Name - left side */
      #t2-lt-tbar .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: calc(34px * var(--type));
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        line-height: 1.1;
        padding-left: 16px;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Divider dot */
      #t2-lt-tbar .divider-dot {
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.80);
        flex-shrink: 0;
        margin: 0 20px;
      }

      /* Role - right side */
      #t2-lt-tbar .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: calc(22px * var(--type));
        letter-spacing: 0.01em;
        color: var(--text-dim);
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 340px;
      }
      /* Vertical and square: the group sits at the bottom-left of the safe area and slots wrap. */
      [data-format="vertical"] #t2-lt-tbar, [data-format="square"] #t2-lt-tbar { --lt-y: var(--safe-b); }
      /* GSAP wipes the clip's width open, so it stays a fixed width (capped to the safe width). */
      [data-format="vertical"] #t2-lt-tbar .bar-clip, [data-format="square"] #t2-lt-tbar .bar-clip {
        width: min(800px, calc(var(--w) - var(--safe-l) - var(--safe-r)));
      }
      /* Vertical: name over role. */
      [data-format="vertical"] #t2-lt-tbar .bar { flex-direction: column; align-items: flex-start; gap: 8px; }
      [data-format="vertical"] #t2-lt-tbar .divider-dot { display: none; }
      [data-format="vertical"] #t2-lt-tbar .name { flex: none; }
      [data-format="vertical"] #t2-lt-tbar .role { max-width: none; padding-left: 16px; }
      [data-format="vertical"] #t2-lt-tbar [data-slot], [data-format="square"] #t2-lt-tbar [data-slot] { white-space: normal; }
    </style>
  </head>
  <body>
    <div id="t2-lt-tbar"
         data-composition-id="t2-lt-tbar"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="bar-clip">
        <div class="bar">
          <div class="name" data-slot="name">Ronny Mitchell</div>
          <div class="divider-dot"></div>
          <div class="role" data-slot="role">Head of Content Strategy</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* bloom swells in */
      tl.from("#t2-lt-tbar .local-bloom",
        { autoAlpha: 0, scale: 0.6, duration: 1.1, ease: "power2.out" }, 0);

      /* bar wipes in from left - clip starts at width 0, expands to 800px */
      tl.from("#t2-lt-tbar .bar-clip",
        { width: 0, duration: 0.72, ease: "power4.out" }, 0.10);

      /* bar content fades in once visible */
      tl.from("#t2-lt-tbar .bar",
        { autoAlpha: 0, filter: "blur(8px)", duration: 0.45, ease: "power3.out" }, 0.20);

      /* name slides in left */
      tl.from("#t2-lt-tbar .name",
        { autoAlpha: 0, x: -22, filter: "blur(6px)",
          duration: 0.58, ease: "power4.out" }, 0.55);

      /* divider dot */
      tl.from("#t2-lt-tbar .divider-dot",
        { autoAlpha: 0, scale: 0, duration: 0.35, ease: "back.out(2.2)" }, 0.72);

      /* role slides in right */
      tl.from("#t2-lt-tbar .role",
        { autoAlpha: 0, x: 18, filter: "blur(5px)",
          duration: 0.55, ease: "power4.out" }, 0.76);

      /* edge-light glow pulse - finite */
      tl.to("#t2-lt-tbar .bar",
        { boxShadow:
            "0 24px 70px rgba(0,0,0,0.50), 0 0 0 1.5px rgba(79,140,255,0.85), 0 0 28px rgba(79,140,255,0.32), inset 0 1px 0 rgba(255,255,255,0.22)",
          duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.6);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-tbar"] = tl;
    </script>
  </body>
</html>
