<!doctype html>
<!--
  AURORA GLASS · tier2 · label · COUNTER
  A micro counting-number label - a large glowing number counts up to data-target,
  with a term label beneath in frosted dark glass. Anchored right side.
  Slots: term (~28 chars), detail (~60 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/aurora-glass/tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lb-cntr {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: transparent; overflow: hidden;
      }

      /* Localized glow behind component */
      #t2-lb-cntr .local-glow {
        position: absolute; right: 100px; top: 310px;
        width: 480px; height: 340px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%,
          rgba(var(--accent-rgb), 0.22) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 80%);
        filter: blur(50px);
        pointer-events: none;
      }

      /* Main wrapper anchored right */
      #t2-lb-cntr .wrapper {
        position: absolute; right: calc(var(--safe-r) + 44px); top: calc(var(--safe-t) + 286px);
        display: flex; flex-direction: column; align-items: flex-end; gap: 0;
      }

      /* The big counting number */
      #t2-lb-cntr .count-wrap {
        display: flex; align-items: baseline; gap: 8px;
      }

      #t2-lb-cntr .count-num {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: calc(110px * var(--type)); line-height: 1; letter-spacing: var(--track-tight);
        background: linear-gradient(150deg, #ffffff 10%, rgba(var(--accent-rgb), 0.90) 85%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.55));
      }

      #t2-lb-cntr .count-suffix {
        font-family: var(--font-mono); font-weight: var(--wt-bold);
        font-size: calc(38px * var(--type)); letter-spacing: 0.05em;
        color: var(--accent); text-shadow: var(--textglow-accent);
        padding-bottom: 12px;
      }

      /* Hairline separator */
      #t2-lb-cntr .sep {
        width: 100%; height: 1.5px; margin: 10px 0 14px;
        background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.55), transparent);
      }

      /* Term + detail glass block */
      #t2-lb-cntr .text-block {
        padding: 14px 22px 14px 22px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--glass-shadow), 0 0 0 1px rgba(var(--accent-rgb), 0.22);
        max-width: 440px;
        text-align: right;
        position: relative; overflow: hidden;
      }

      /* inner top-highlight */
      #t2-lb-cntr .text-block::before {
        content: "";
        position: absolute; top: 0; left: 10px; right: 10px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.40) 50%, transparent);
      }

      #t2-lb-cntr .term {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: calc(28px * var(--type)); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 4px;
      }

      #t2-lb-cntr .detail {
        font-family: var(--font-body); font-weight: var(--wt-reg);
        font-size: calc(20px * var(--type)); line-height: 1.45;
        color: var(--text-dim);
      }
      /* Vertical and square: number and card move to the bottom-left of the safe area and align left, glow follows, slots wrap. */
      [data-format="vertical"] #t2-lb-cntr .wrapper, [data-format="square"] #t2-lb-cntr .wrapper {
        top: auto; right: auto; left: var(--safe-l); bottom: var(--safe-b);
        max-width: calc(var(--w) - var(--safe-l) - var(--safe-r));
      }
      [data-format="vertical"] #t2-lb-cntr .local-glow, [data-format="square"] #t2-lb-cntr .local-glow {
        top: auto; right: auto; left: calc(var(--safe-l) - 40px); bottom: calc(var(--safe-b) - 40px);
      }
      [data-format="vertical"] #t2-lb-cntr .wrapper, [data-format="square"] #t2-lb-cntr .wrapper { align-items: flex-start; }
      [data-format="vertical"] #t2-lb-cntr .text-block, [data-format="square"] #t2-lb-cntr .text-block { text-align: left; }
      [data-format="vertical"] #t2-lb-cntr [data-slot], [data-format="square"] #t2-lb-cntr [data-slot] { white-space: normal; }
    </style>
  </head>
  <body>
    <div id="t2-lb-cntr" data-composition-id="t2-lb-cntr" data-start="0" data-width="1920" data-height="1080">

      <div class="local-glow"></div>

      <div class="wrapper">
        <div class="count-wrap">
          <div class="count-num" id="t2-lb-cntr-num" data-target="2400">0</div>
          <div class="count-suffix">+</div>
        </div>
        <div class="sep"></div>
        <div class="text-block">
          <div class="term" data-slot="term">Students Enrolled</div>
          <div class="detail" data-slot="detail">AI course completions this quarter</div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const COMP   = "#t2-lb-cntr";
      const numEl  = document.getElementById("t2-lb-cntr-num");
      const target = parseFloat(numEl.getAttribute("data-target")) || 2400;

      /* glow blooms in */
      tl.from(`${COMP} .local-glow`, {
            autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%",
            duration: 1.2, ease: "expo.out" }, 0)

        /* number block scales+blur in from right */
        .from(`${COMP} .count-wrap`, {
            autoAlpha: 0, x: 50, scale: 0.88, transformOrigin: "right center",
            duration: 0.75, ease: "back.out(1.4)" }, 0.18)

        /* count-up - 3-arg .to on proxy */
        .to({ val: 0 }, {
            val: target,
            duration: 1.8, ease: "power2.out",
            onUpdate: function () {
              const v = this.targets()[0].val;
              numEl.textContent = Math.round(v).toLocaleString();
            }
          }, 0.30)

        /* separator draws in */
        .from(`${COMP} .sep`, {
            scaleX: 0, transformOrigin: "right center",
            duration: 0.55, ease: "power3.out" }, 0.60)

        /* text block glides up */
        .from(`${COMP} .text-block`, {
            autoAlpha: 0, y: 18, filter: "blur(8px)",
            duration: 0.68, ease: "power4.out" }, 0.72)

        /* finite breathing glow on number */
        .to(`${COMP} .count-num`, {
            filter: "drop-shadow(0 0 40px rgba(79,140,255,0.75))",
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, 2.10)

        .set({}, {}, 7);

      window.__timelines["t2-lb-cntr"] = tl;
    </script>
  </body>
</html>
