<!doctype html>
<!--
  AURORA GLASS · tier2 · lower-third · DIVIDERNAME
  Name and role flanking a glowing vertical divider line that draws down
  from top. Left side holds the bold name; right of the divider holds the
  dimmer role. Anchored lower-left. Transparent overlay.
  Slots: name (~26 chars), role (~40 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/aurora-glass/tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      #t2-lt-divn {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: transparent; overflow: hidden;
        font-family: var(--font-display);
      }

      /* Localized bloom behind the component */
      #t2-lt-divn .local-bloom {
        position: absolute;
        left: calc(var(--safe-l) - 30px); bottom: calc(var(--safe-b) + 26px);
        width: 660px; height: 200px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 40% 80%,
          rgba(var(--accent-rgb), 0.24) 0%,
          rgba(var(--accent-rgb), 0.07) 55%,
          transparent 78%);
        filter: blur(34px);
        pointer-events: none;
        z-index: 1;
      }

      /* Outer wrapper - anchored lower-left */
      #t2-lt-divn .row {
        position: absolute;
        left: var(--safe-l); bottom: calc(var(--safe-b) + 64px);
        display: flex;
        align-items: center;
        gap: 0;
        z-index: 2;
      }

      /* Name block - dark glass backing */
      #t2-lt-divn .name-block {
        padding: 22px 32px 22px 36px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: var(--radius) 0 0 var(--radius);
        border: var(--stroke) solid var(--glass-border);
        border-right: none;
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 var(--glass-hi);
        position: relative;
        overflow: hidden;
      }

      #t2-lt-divn .name-block::before {
        content: "";
        position: absolute; top: 0; left: 12px; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 60%, transparent);
      }

      #t2-lt-divn .name {
        font-family: var(--font-display);
        font-weight: var(--wt-bold);
        font-size: calc(38px * var(--type));
        letter-spacing: var(--track-snug);
        color: var(--white);
        text-shadow: var(--textglow);
        white-space: nowrap;
        line-height: 1.1;
      }

      /* The vertical glowing divider */
      #t2-lt-divn .divider {
        width: 3px;
        height: 84px;
        flex-shrink: 0;
        background: linear-gradient(180deg,
          transparent 0%,
          var(--accent) 25%,
          var(--accent) 75%,
          transparent 100%);
        box-shadow:
          0 0 10px rgba(var(--accent-rgb), 0.80),
          0 0 28px rgba(var(--accent-rgb), 0.45);
        /* drawn via clip-path in GSAP */
        transform-origin: top center;
        align-self: stretch;
        position: relative;
        z-index: 3;
      }

      /* Role block - dark glass, right side */
      #t2-lt-divn .role-block {
        padding: 22px 36px 22px 32px;
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-radius: 0 var(--radius) var(--radius) 0;
        border: var(--stroke) solid var(--glass-border);
        border-left: none;
        box-shadow:
          var(--glass-shadow),
          inset 0 1px 0 var(--glass-hi);
        position: relative;
        overflow: hidden;
      }

      #t2-lt-divn .role-block::before {
        content: "";
        position: absolute; top: 0; left: 0; right: 12px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.50) 60%, transparent);
      }

      #t2-lt-divn .role {
        font-family: var(--font-body);
        font-weight: var(--wt-med);
        font-size: calc(24px * var(--type));
        letter-spacing: 0.01em;
        color: var(--text-dim);
        white-space: nowrap;
        line-height: 1.1;
      }

      /* Accent glow rule across full bottom of both blocks */
      #t2-lt-divn .glow-rule {
        position: absolute;
        left: var(--safe-l); bottom: calc(var(--safe-b) + 64px);
        width: 0;
        height: 2px;
        background: linear-gradient(90deg,
          rgba(var(--accent-rgb), 0.90),
          rgba(var(--accent-rgb), 0.55) 60%,
          transparent);
        box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.60);
        z-index: 4;
        /* width animated by GSAP */
      }
      /* Vertical and square: card sits at the bottom of the safe area, bloom follows, slots wrap. */
      [data-format="vertical"] #t2-lt-divn .row, [data-format="square"] #t2-lt-divn .row {
        bottom: var(--safe-b); max-width: calc(var(--w) - var(--safe-l) - var(--safe-r));
      }
      [data-format="vertical"] #t2-lt-divn .local-bloom, [data-format="square"] #t2-lt-divn .local-bloom { bottom: calc(var(--safe-b) - 38px); }
      [data-format="vertical"] #t2-lt-divn .glow-rule, [data-format="square"] #t2-lt-divn .glow-rule { bottom: var(--safe-b); }
      [data-format="vertical"] #t2-lt-divn [data-slot], [data-format="square"] #t2-lt-divn [data-slot] { white-space: normal; }
      /* Vertical: name block over role block, the divider turns into a horizontal seam between them. */
      [data-format="vertical"] #t2-lt-divn .row { flex-direction: column; align-items: stretch; }
      [data-format="vertical"] #t2-lt-divn .name-block {
        border-radius: var(--radius) var(--radius) 0 0; border-right: var(--stroke) solid var(--glass-border); border-bottom: none;
      }
      [data-format="vertical"] #t2-lt-divn .divider {
        width: auto; height: 3px;
        background: linear-gradient(90deg, transparent 0%, var(--accent) 15%, var(--accent) 85%, transparent 100%);
      }
      [data-format="vertical"] #t2-lt-divn .role-block {
        border-radius: 0 0 var(--radius) var(--radius); border-left: var(--stroke) solid var(--glass-border); border-top: none;
        padding-left: 36px;
      }
    </style>
  </head>
  <body>
    <div id="t2-lt-divn"
         data-composition-id="t2-lt-divn"
         data-start="0"
         data-width="1920"
         data-height="1080">

      <div class="local-bloom"></div>

      <div class="row">
        <div class="name-block">
          <div class="name" data-slot="name">Dr. Sarah Chen</div>
        </div>
        <div class="divider"></div>
        <div class="role-block">
          <div class="role" data-slot="role">AI Research Lead, Stanford</div>
        </div>
      </div>

      <div class="glow-rule"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const C = "#t2-lt-divn";

      /* bloom swells in */
      tl.from(`${C} .local-bloom`,
        { autoAlpha: 0, scale: 0.65, duration: 1.1, ease: "power2.out" }, 0);

      /* name block slides in from left */
      tl.from(`${C} .name-block`,
        { autoAlpha: 0, x: -48, filter: "blur(12px)",
          duration: 0.75, ease: "power4.out" }, 0.1);

      /* divider draws down - scaleY from 0 at top */
      tl.from(`${C} .divider`,
        { scaleY: 0, transformOrigin: "top center",
          duration: 0.55, ease: "power3.out" }, 0.52);

      /* role block slides in from right */
      tl.from(`${C} .role-block`,
        { autoAlpha: 0, x: 36, filter: "blur(10px)",
          duration: 0.70, ease: "power4.out" }, 0.65);

      /* glow rule draws across the bottom */
      tl.to(`${C} .glow-rule`,
        { width: 560, duration: 0.60, ease: "power3.out" }, 0.80);

      /* divider breathes - finite glow pulse */
      tl.to(`${C} .divider`,
        { boxShadow: "0 0 18px rgba(79,140,255,1.00), 0 0 48px rgba(79,140,255,0.70)",
          duration: 1.0, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.6);

      tl.set({}, {}, 7);

      window.__timelines["t2-lt-divn"] = tl;
    </script>
  </body>
</html>
