<!doctype html>
<!--
  AURORA GLASS · tier1 · overview · NETWORK
  Node graph: 5 glowing nodes connected by edges that draw in (stroke-dashoffset).
  Each node has a label; edges are dashed glowing lines. Aurora bloom.
  Slots: title, n1, n2, n3, n4, n5.
  Node positions are fixed in the SVG (1640x760 viewBox) and labeled via HTML overlays.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/aurora-glass/tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-net {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      #t1-ov-net .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-net .dot-grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.42;
        -webkit-mask-image: radial-gradient(115% 100% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(115% 100% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Title */
      #t1-ov-net .title-row {
        position: absolute; left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 18px);
        text-align: center; z-index: 4;
      }
      #t1-ov-net .title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); letter-spacing: var(--track-snug); line-height: 1.06;
        color: var(--white); text-shadow: var(--textglow);
        max-width: 1400px; margin: 0 auto;
      }
      #t1-ov-net .title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Network SVG panel */
      #t1-ov-net .net-stage {
        position: absolute; left: 140px; right: 140px;
        top: 228px; bottom: 72px; z-index: 4;
      }
      #t1-ov-net .net-svg {
        width: 100%; height: 100%;
        overflow: visible;
      }

      /* Node label HTML overlays */
      #t1-ov-net .net-labels {
        position: absolute; inset: 0; pointer-events: none;
      }
      .net-label {
        position: absolute; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; gap: 4px;
      }
      .net-label-name {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: calc(30px * var(--type)); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        white-space: nowrap;
      }
      .net-label-tag {
        font-family: var(--font-mono); font-size: var(--size-tiny);
        font-weight: var(--wt-bold); letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--accent);
        text-shadow: var(--textglow-accent); white-space: nowrap;
      }

      #t1-ov-net #nlabel-1 { left: 50%; top: 65%; }
      #t1-ov-net #nlabel-2 { left: 14%; top: 7%; }
      #t1-ov-net #nlabel-3 { left: 85%; top: 8%; }
      #t1-ov-net #nlabel-4 { left: 16%; top: 80%; }
      #t1-ov-net #nlabel-5 { left: 83%; top: 82%; }

      /* Vignette + grain */
      #t1-ov-net .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-net .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }
      /* Vertical and square: the network is re-laid inside the safe box under the title; node centres,
         edges and labels move per format (svg units = px of the stage). */
      [data-format="vertical"] #t1-ov-net .net-stage { left: var(--safe-l); right: var(--safe-r); top: 490px; bottom: var(--safe-b); }
      [data-format="vertical"] #t1-ov-net .title { font-size: calc(64px * var(--type)); }
      [data-format="vertical"] #halo-1, [data-format="vertical"] #node-1 circle { cx: 383px; cy: 400px; }
      [data-format="vertical"] #halo-2, [data-format="vertical"] #node-2 circle { cx: 200px; cy: 170px; }
      [data-format="vertical"] #halo-3, [data-format="vertical"] #node-3 circle { cx: 567px; cy: 190px; }
      [data-format="vertical"] #halo-4, [data-format="vertical"] #node-4 circle { cx: 190px; cy: 600px; }
      [data-format="vertical"] #halo-5, [data-format="vertical"] #node-5 circle { cx: 577px; cy: 620px; }
      [data-format="vertical"] #e12 { d: path("M383 400 L200 170"); }
      [data-format="vertical"] #e13 { d: path("M383 400 L567 190"); }
      [data-format="vertical"] #e14 { d: path("M383 400 L190 600"); }
      [data-format="vertical"] #e15 { d: path("M383 400 L577 620"); }
      [data-format="vertical"] #e24 { d: path("M200 170 L190 600"); }
      [data-format="vertical"] #t1-ov-net #nlabel-1 { left: 383px; top: 470px; }
      [data-format="vertical"] #t1-ov-net #nlabel-2 { left: 200px; top: 40px; }
      [data-format="vertical"] #t1-ov-net #nlabel-3 { left: 567px; top: 60px; }
      [data-format="vertical"] #t1-ov-net #nlabel-4 { left: 190px; top: 650px; }
      [data-format="vertical"] #t1-ov-net #nlabel-5 { left: 577px; top: 670px; }
      [data-format="square"] #t1-ov-net .net-stage { left: var(--safe-l); right: var(--safe-r); top: 180px; bottom: var(--safe-b); }
      [data-format="square"] #t1-ov-net .title { font-size: 64px; }
      [data-format="square"] #halo-1, [data-format="square"] #node-1 circle { cx: 464px; cy: 400px; }
      [data-format="square"] #halo-2, [data-format="square"] #node-2 circle { cx: 200px; cy: 150px; }
      [data-format="square"] #halo-3, [data-format="square"] #node-3 circle { cx: 728px; cy: 170px; }
      [data-format="square"] #halo-4, [data-format="square"] #node-4 circle { cx: 220px; cy: 640px; }
      [data-format="square"] #halo-5, [data-format="square"] #node-5 circle { cx: 708px; cy: 660px; }
      [data-format="square"] #e12 { d: path("M464 400 L200 150"); }
      [data-format="square"] #e13 { d: path("M464 400 L728 170"); }
      [data-format="square"] #e14 { d: path("M464 400 L220 640"); }
      [data-format="square"] #e15 { d: path("M464 400 L708 660"); }
      [data-format="square"] #e24 { d: path("M200 150 L220 640"); }
      [data-format="square"] #t1-ov-net #nlabel-1 { left: 464px; top: 470px; }
      [data-format="square"] #t1-ov-net #nlabel-2 { left: 200px; top: 30px; }
      [data-format="square"] #t1-ov-net #nlabel-3 { left: 728px; top: 50px; }
      [data-format="square"] #t1-ov-net #nlabel-4 { left: 220px; top: 690px; }
      [data-format="square"] #t1-ov-net #nlabel-5 { left: 708px; top: 710px; }
    </style>
  </head>
  <body>
    <div id="t1-ov-net" data-composition-id="t1-ov-net" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="dot-grid"></div>

      <div class="title-row">
        <div class="title" data-slot="title">How the <em>System Connects</em></div>
      </div>

      <div class="net-stage">
        <!--
          Node layout (viewBox 1640x760):
          N1 (center-hub): 820,380
          N2 (top-left):   280,160
          N3 (top-right):  1360,180
          N4 (bottom-left):320,580
          N5 (bottom-right):1320,600
        -->
        <svg class="net-svg" id="net-svg"
             fill="none"
             xmlns="http://www.w3.org/2000/svg">

          <defs>
            <filter id="netNodeGlow" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <filter id="netEdgeGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <linearGradient id="edgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-opacity="0.80" style="stop-color:var(--accent)"/>
              <stop offset="100%" stop-opacity="0.20" style="stop-color:var(--accent)"/>
            </linearGradient>
            <linearGradient id="edgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-opacity="0.80" style="stop-color:var(--accent)"/>
              <stop offset="100%" stop-opacity="0.20" style="stop-color:var(--accent)"/>
            </linearGradient>
          </defs>

          <!-- Edges (drawn via stroke-dashoffset) -->
          <path id="e12" d="M820 380 L280 160"
            stroke="rgba(79,140,255,0.55)" stroke-width="2" stroke-dasharray="10 6"
            filter="url(#netEdgeGlow)"/>
          <path id="e13" d="M820 380 L1360 180"
            stroke="rgba(79,140,255,0.55)" stroke-width="2" stroke-dasharray="10 6"
            filter="url(#netEdgeGlow)"/>
          <path id="e14" d="M820 380 L320 580"
            stroke="rgba(79,140,255,0.55)" stroke-width="2" stroke-dasharray="10 6"
            filter="url(#netEdgeGlow)"/>
          <path id="e15" d="M820 380 L1320 600"
            stroke="rgba(79,140,255,0.55)" stroke-width="2" stroke-dasharray="10 6"
            filter="url(#netEdgeGlow)"/>
          <!-- cross edge 2-4 (secondary) -->
          <path id="e24" d="M280 160 L320 580"
            stroke="rgba(79,140,255,0.25)" stroke-width="1.5" stroke-dasharray="6 8"
            filter="url(#netEdgeGlow)"/>

          <!-- Node halos (large soft glow circles) -->
          <circle id="halo-1" cx="820" cy="380" r="72"
            fill="rgba(79,140,255,0.12)" opacity="0"/>
          <circle id="halo-2" cx="280" cy="160" r="48"
            fill="rgba(79,140,255,0.10)" opacity="0"/>
          <circle id="halo-3" cx="1360" cy="180" r="48"
            fill="rgba(79,140,255,0.10)" opacity="0"/>
          <circle id="halo-4" cx="320" cy="580" r="48"
            fill="rgba(79,140,255,0.10)" opacity="0"/>
          <circle id="halo-5" cx="1320" cy="600" r="48"
            fill="rgba(79,140,255,0.10)" opacity="0"/>

          <!-- Nodes (glass circles) -->
          <!-- N1 hub - larger -->
          <g id="node-1" opacity="0">
            <circle cx="820" cy="380" r="54"
              fill="rgba(16,24,38,0.80)"
              stroke="rgba(79,140,255,0.70)" stroke-width="2"
              style="filter:drop-shadow(0 0 22px rgba(var(--accent-rgb),0.60));"/>
            <circle cx="820" cy="380" r="28"
              fill="rgba(79,140,255,0.90)"
              style="filter:drop-shadow(0 0 18px rgba(var(--accent-rgb),1.0));"/>
          </g>

          <!-- N2 -->
          <g id="node-2" opacity="0">
            <circle cx="280" cy="160" r="36"
              fill="rgba(16,24,38,0.75)"
              stroke="rgba(79,140,255,0.55)" stroke-width="1.5"
              style="filter:drop-shadow(0 0 16px rgba(var(--accent-rgb),0.50));"/>
            <circle cx="280" cy="160" r="16"
              fill="rgba(79,140,255,0.85)"
              style="filter:drop-shadow(0 0 12px rgba(var(--accent-rgb),0.90));"/>
          </g>

          <!-- N3 -->
          <g id="node-3" opacity="0">
            <circle cx="1360" cy="180" r="36"
              fill="rgba(16,24,38,0.75)"
              stroke="rgba(79,140,255,0.55)" stroke-width="1.5"
              style="filter:drop-shadow(0 0 16px rgba(var(--accent-rgb),0.50));"/>
            <circle cx="1360" cy="180" r="16"
              fill="rgba(79,140,255,0.85)"
              style="filter:drop-shadow(0 0 12px rgba(var(--accent-rgb),0.90));"/>
          </g>

          <!-- N4 -->
          <g id="node-4" opacity="0">
            <circle cx="320" cy="580" r="36"
              fill="rgba(16,24,38,0.75)"
              stroke="rgba(79,140,255,0.55)" stroke-width="1.5"
              style="filter:drop-shadow(0 0 16px rgba(var(--accent-rgb),0.50));"/>
            <circle cx="320" cy="580" r="16"
              fill="rgba(79,140,255,0.85)"
              style="filter:drop-shadow(0 0 12px rgba(var(--accent-rgb),0.90));"/>
          </g>

          <!-- N5 -->
          <g id="node-5" opacity="0">
            <circle cx="1320" cy="600" r="36"
              fill="rgba(16,24,38,0.75)"
              stroke="rgba(79,140,255,0.55)" stroke-width="1.5"
              style="filter:drop-shadow(0 0 16px rgba(var(--accent-rgb),0.50));"/>
            <circle cx="1320" cy="600" r="16"
              fill="rgba(79,140,255,0.85)"
              style="filter:drop-shadow(0 0 12px rgba(var(--accent-rgb),0.90));"/>
          </g>

        </svg>

        <!-- HTML labels for each node -->
        <div class="net-labels">
          <!-- N1 hub - below node -->
          <div class="net-label" id="nlabel-1"
               style="transform:translate(-50%,0);opacity:0;">
            <div class="net-label-name" data-slot="n1">Core Platform</div>
            <div class="net-label-tag">HUB</div>
          </div>
          <!-- N2 -->
          <div class="net-label" id="nlabel-2"
               style="transform:translate(-50%,0);opacity:0;">
            <div class="net-label-name" data-slot="n2">Content Engine</div>
            <div class="net-label-tag">INPUT</div>
          </div>
          <!-- N3 -->
          <div class="net-label" id="nlabel-3"
               style="transform:translate(-50%,0);opacity:0;">
            <div class="net-label-name" data-slot="n3">AI Personalization</div>
            <div class="net-label-tag">LAYER</div>
          </div>
          <!-- N4 -->
          <div class="net-label" id="nlabel-4"
               style="transform:translate(-50%,0);opacity:0;">
            <div class="net-label-name" data-slot="n4">Community</div>
            <div class="net-label-tag">NETWORK</div>
          </div>
          <!-- N5 -->
          <div class="net-label" id="nlabel-5"
               style="transform:translate(-50%,0);opacity:0;">
            <div class="net-label-name" data-slot="n5">Analytics</div>
            <div class="net-label-tag">OUTPUT</div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* --- measure edge lengths for dashoffset animation --- */
      function lineLength(id) {
        const el = document.getElementById(id);
        return el ? el.getTotalLength() : 200;
      }
      /* node centre in svg px, read from the laid-out geometry (it moves per format) */
      function ctr(id) {
        const b = document.getElementById(id).getBBox();
        return (b.x + b.width / 2) + " " + (b.y + b.height / 2);
      }
      const edges = ["e12","e13","e14","e15","e24"];
      edges.forEach(id => {
        const el = document.getElementById(id);
        const len = lineLength(id);
        el.style.strokeDasharray = len + " " + len;
        el.style.strokeDashoffset = len;
      });

      /* grain flicker */
      tl.fromTo("#t1-ov-net .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "92px 70px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* environment */
      tl.from("#t1-ov-net .bloom",
          { autoAlpha: 0, scale: 0.90, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-net .dot-grid",
          { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-net .title",
          { autoAlpha: 0, y: 28, filter: "blur(14px)", duration: 1.0, ease: "power4.out" }, 0.45);

      gsap.set("#node-1", { scale: 0.3, svgOrigin: ctr("halo-1") });
      gsap.set("#halo-1", { scale: 0.5, svgOrigin: ctr("halo-1") });

      /* hub node pops first */
      tl.to("#node-1",
          { autoAlpha: 1, scale: 1, svgOrigin: ctr("halo-1"),
            duration: 0.65, ease: "back.out(1.8)" }, 0.95)
        .to("#halo-1",
          { autoAlpha: 1, scale: 1.4, svgOrigin: ctr("halo-1"),
            duration: 0.8, ease: "power2.out" }, 1.0);


      /* edges draw outward from hub */
      const edgeTimes = [1.3, 1.4, 1.5, 1.6, 1.75];
      edges.forEach((id, i) => {
        tl.to("#" + id, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, edgeTimes[i]);
      });

      /* spoke nodes appear */
      const spokeNodes = [["node-2", ctr("halo-2")], ["node-3", ctr("halo-3")],
                          ["node-4", ctr("halo-4")], ["node-5", ctr("halo-5")]];
      const spokeHalos = [["halo-2", ctr("halo-2")], ["halo-3", ctr("halo-3")],
                          ["halo-4", ctr("halo-4")], ["halo-5", ctr("halo-5")]];

      spokeNodes.forEach(([id, origin], i) => {
        gsap.set("#" + id, { scale: 0.3, svgOrigin: origin });
        tl.to("#" + id, {
          autoAlpha: 1, scale: 1, svgOrigin: origin,
          duration: 0.55, ease: "back.out(1.8)"
        }, 1.55 + i * 0.14);
      });
      spokeHalos.forEach(([id, origin], i) => {
        gsap.set("#" + id, { scale: 0.5, svgOrigin: origin });
        tl.to("#" + id, {
          autoAlpha: 1, scale: 1.3, svgOrigin: origin,
          duration: 0.7, ease: "power2.out"
        }, 1.60 + i * 0.14);
      });

      /* labels appear after nodes */
      ["nlabel-1","nlabel-2","nlabel-3","nlabel-4","nlabel-5"].forEach((id, i) => {
        gsap.set("#" + id, { y: 12 });
        tl.to("#" + id, {
          autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out"
        }, 1.6 + i * 0.14);
      });

      /* hub glow pulse (autoAlpha+scale) */
      tl.to("#halo-1",
        { scale: 1.8, autoAlpha: 0.4, svgOrigin: ctr("halo-1"),
          duration: 1.4, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0);

      /* slow drift */
      tl.to("#t1-ov-net .net-stage",
        { y: -8, duration: 5.0, ease: "sine.inOut" }, 2.0);

      tl.set({}, {}, 7);
      window.__timelines["t1-ov-net"] = tl;
    </script>
  </body>
</html>
