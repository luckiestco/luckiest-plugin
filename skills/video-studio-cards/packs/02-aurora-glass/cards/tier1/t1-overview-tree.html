<!doctype html>
<!--
  AURORA GLASS · tier1 · overview · TREE
  A node-and-connector tree: a root node at top, a connector line that draws
  down and branches to 3 child nodes. Clean glowing lines + glass nodes.
  Absolutely positioned SVG connector overlay draws in; nodes pop on with glow.
  Slots: title, root, b1, b2, b3.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/aurora-glass/tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-ov-tree {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--canvas); color: var(--text);
        font-family: var(--font-body); overflow: hidden;
      }

      #t1-ov-tree .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      #t1-ov-tree .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 110% at 50% 60%, #000 30%, transparent 78%);
      }

      /* Layout */
      #t1-ov-tree .layout {
        position: absolute; inset: 0; z-index: 3;
        padding: calc(var(--safe-t) + 26px) var(--safe-r) calc(var(--safe-b) + 18px) var(--safe-l);
        display: flex; flex-direction: column; align-items: center;
      }

      /* Title */
      #t1-ov-tree .card-title {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); letter-spacing: var(--track-snug);
        color: var(--white); text-shadow: var(--textglow);
        margin-bottom: 64px; line-height: 1.1; text-align: center;
      }
      #t1-ov-tree .card-title em {
        font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent);
      }

      /* Tree canvas area */
      #t1-ov-tree .tree-area {
        position: relative; width: 1520px; flex: 1;
      }

      /* SVG connector overlay - spans the full tree area */
      #t1-ov-tree .connectors {
        position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
        overflow: visible; pointer-events: none;
      }
      #t1-ov-tree .connectors line, #t1-ov-tree .connectors path {
        stroke: var(--accent);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        opacity: 0.75;
        filter: drop-shadow(0 0 6px rgba(var(--accent-rgb),0.55));
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200; /* hidden - GSAP draws these in */
      }

      /* Nodes */
      #t1-ov-tree .node {
        position: absolute; z-index: 2;
        background: var(--glass-bg-dark);
        border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius);
        padding: 28px 44px;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow),
                    inset 0 1px 0 var(--glass-hi);
        text-align: center;
        /* center horizontally with transform */
      }

      /* Root node - centered top */
      #t1-ov-tree .node-root {
        left: 50%; top: 0;
        transform: translateX(-50%);
        border-color: rgba(var(--accent-rgb), 0.55);
        box-shadow: var(--glass-shadow), 0 0 30px rgba(var(--accent-rgb), 0.25),
                    inset 0 1px 0 var(--glass-hi);
        min-width: 480px;
      }
      #t1-ov-tree .node-root .node-label {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: calc(38px * var(--type)); color: var(--white);
        text-shadow: var(--textglow); letter-spacing: var(--track-snug);
      }

      /* Child nodes - positioned bottom row, evenly spaced */
      /* left=0%, 33.3%, 66.6% of 1520px → 0px, 507px, 1014px */
      /* with node ~420px wide, centers at ~190, ~707, ~1224 ← translate(-50%) → left 190, 707, 1224 */
      #t1-ov-tree .node-b1 { left: 0;      top: 440px; transform: translateX(0); min-width: 420px; }
      #t1-ov-tree .node-b1, #t1-ov-tree .node-b2, #t1-ov-tree .node-b3 { box-sizing: border-box; width: 460px; min-width: 0; }
      #t1-ov-tree .node-b2 { left: 50%;    top: 440px; transform: translateX(-50%); min-width: 420px; }
      #t1-ov-tree .node-b3 { left: 100%;   top: 440px; transform: translateX(-100%); min-width: 420px; }

      #t1-ov-tree .node-label {
        font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: calc(32px * var(--type)); color: var(--white);
        letter-spacing: var(--track-snug); line-height: 1.25; margin-bottom: 8px;
      }
      #t1-ov-tree .node-sub {
        font-family: var(--font-body); font-size: calc(26px * var(--type));
        color: var(--text-dim); line-height: 1.4;
      }

      /* Dot at center of each child node (the glow node at connector end) */
      #t1-ov-tree .node-dot {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.80), 0 0 40px rgba(var(--accent-rgb), 0.40);
        margin: 0 auto 18px;
      }

      #t1-ov-tree .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-ov-tree .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }

      /* Vertical: root on top, the three outcomes stack down a left spine. Square: the landscape row with
         narrower nodes. Connectors are redrawn per format (svg units = px of the tree area). */
      [data-format="vertical"] #t1-ov-tree .layout, [data-format="square"] #t1-ov-tree .layout { padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); }
      [data-format="vertical"] #t1-ov-tree .card-title, [data-format="square"] #t1-ov-tree .card-title { margin-bottom: 40px; }
      [data-format="vertical"] #t1-ov-tree .tree-area, [data-format="square"] #t1-ov-tree .tree-area { width: 100%; }
      [data-format="vertical"] #t1-ov-tree .node-root { box-sizing: border-box; min-width: 0; width: 767px; padding: 20px 32px; }
      [data-format="vertical"] #t1-ov-tree .node-root .node-label { font-size: calc(32px * var(--type)); }
      [data-format="vertical"] #t1-ov-tree .node-b1, [data-format="vertical"] #t1-ov-tree .node-b2, [data-format="vertical"] #t1-ov-tree .node-b3 { width: 687px; padding: 18px 36px; }
      [data-format="vertical"] #t1-ov-tree .node-b1 { left: 80px; top: 170px; }
      [data-format="vertical"] #t1-ov-tree .node-b2 { left: calc(80px + 687px / 2); top: 362px; }
      [data-format="vertical"] #t1-ov-tree .node-b3 { left: calc(80px + 687px); top: 554px; }
      [data-format="vertical"] #t1-ov-tree .node-dot { margin-bottom: 8px; }
      [data-format="vertical"] #t1-ov-tree .node-sub { font-size: calc(22px * var(--type)); }
      [data-format="vertical"] #t1-ov-tree #tr-stem { d: path("M383 136 L383 150"); }
      [data-format="vertical"] #t1-ov-tree #tr-rail { d: path("M383 150 L40 150 L40 647"); }
      [data-format="vertical"] #t1-ov-tree #tr-drop-1 { d: path("M40 263 L80 263"); }
      [data-format="vertical"] #t1-ov-tree #tr-drop-2 { d: path("M40 455 L80 455"); }
      [data-format="vertical"] #t1-ov-tree #tr-drop-3 { d: path("M40 647 L80 647"); }
      [data-format="square"] #t1-ov-tree .node-b1, [data-format="square"] #t1-ov-tree .node-b2, [data-format="square"] #t1-ov-tree .node-b3 { width: 296px; min-width: 0; padding: 24px 20px; top: 420px; }
      [data-format="square"] #t1-ov-tree #tr-stem { d: path("M464 102 L464 270"); }
      [data-format="square"] #t1-ov-tree #tr-rail { d: path("M148 270 L780 270"); }
      [data-format="square"] #t1-ov-tree #tr-drop-1 { d: path("M148 270 L148 420"); }
      [data-format="square"] #t1-ov-tree #tr-drop-2 { d: path("M464 270 L464 420"); }
      [data-format="square"] #t1-ov-tree #tr-drop-3 { d: path("M780 270 L780 420"); }
    </style>
  </head>
  <body>
    <div id="t1-ov-tree" data-composition-id="t1-ov-tree" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="layout">
        <div class="card-title" data-slot="title">One Signal, <em>Three</em> Outcomes</div>

        <div class="tree-area" id="tr-area">
          <!--
            SVG coordinates (tree-area is 1520 wide):
            Root node center: x=760, y=115  (approx bottom edge of root node)
            Branch mid-point: x=760, y=280
            Child centers:    b1=210, b2=760, b3=1310  y=450 (top of child node)

            Lines:
              stem:    760,115 → 760,280
              left:    760,280 → 210,280 → 210,450
              center:  760,280 → 760,450
              right:   760,280 → 1310,280 → 1310,450
          -->
          <svg class="connectors">
            <!-- Vertical stem from root -->
            <path id="tr-stem" d="M760 115 L760 280" />
            <!-- Horizontal rail -->
            <path id="tr-rail" d="M230 280 L1290 280" />
            <!-- Drops to each child -->
            <path id="tr-drop-1" d="M230 280 L230 440" />
            <path id="tr-drop-2" d="M760 280 L760 440" />
            <path id="tr-drop-3" d="M1290 280 L1290 440" />
          </svg>

          <!-- Root node -->
          <div class="node node-root" id="tr-root">
            <div class="node-label" data-slot="root">The Algorithm Sees High Watch Time</div>
          </div>

          <!-- Child nodes -->
          <div class="node node-b1" id="tr-b1">
            <div class="node-dot" id="tr-dot-1"></div>
            <div class="node-label" data-slot="b1">Browse Feed Boost</div>
            <div class="node-sub">Pushed to non-subscribers via recommended feed</div>
          </div>

          <div class="node node-b2" id="tr-b2">
            <div class="node-dot" id="tr-dot-2"></div>
            <div class="node-label" data-slot="b2">Trending Eligibility</div>
            <div class="node-sub">Qualifies for category trending chart within 6 hours</div>
          </div>

          <div class="node node-b3" id="tr-b3">
            <div class="node-dot" id="tr-dot-3"></div>
            <div class="node-label" data-slot="b3">Search Rank Lift</div>
            <div class="node-sub">Video climbs keyword rankings for 30–90 days</div>
          </div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker */
      tl.fromTo("#t1-ov-tree .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "100px 80px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-ov-tree .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-tree .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)

        /* title */
        .from("#t1-ov-tree .card-title", { autoAlpha: 0, y: 28, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, 0.5)

        /* root node pops on with glow spring */
        .from("#tr-root", { autoAlpha: 0, scale: 0.88, y: -20, filter: "blur(10px)", transformOrigin: "50% 50%", duration: 0.75, ease: "back.out(1.4)" }, 0.85)

        /* stem draws down */
        .to("#tr-stem",   { strokeDashoffset: 0, duration: 0.38, ease: "power3.inOut" }, 1.28)

        /* horizontal rail draws outward from center */
        .to("#tr-rail",   { strokeDashoffset: 0, duration: 0.42, ease: "power3.inOut" }, 1.55)

        /* drops draw down and children pop on, staggered */
        .to("#tr-drop-1", { strokeDashoffset: 0, duration: 0.30, ease: "power2.out" }, 1.82)
        .from("#tr-b1",   { autoAlpha: 0, y: 28, filter: "blur(8px)", duration: 0.65, ease: "back.out(1.3)" }, 1.92)

        .to("#tr-drop-2", { strokeDashoffset: 0, duration: 0.30, ease: "power2.out" }, 1.97)
        .from("#tr-b2",   { autoAlpha: 0, y: 28, filter: "blur(8px)", duration: 0.65, ease: "back.out(1.3)" }, 2.07)

        .to("#tr-drop-3", { strokeDashoffset: 0, duration: 0.30, ease: "power2.out" }, 2.12)
        .from("#tr-b3",   { autoAlpha: 0, y: 28, filter: "blur(8px)", duration: 0.65, ease: "back.out(1.3)" }, 2.22)

        /* node dot glow pulse - finite breathing */
        .to("#tr-dot-1, #tr-dot-2, #tr-dot-3",
          { boxShadow: "0 0 26px rgba(79,140,255,0.95), 0 0 60px rgba(79,140,255,0.50)", duration: 1.1, ease: "sine.inOut", repeat: 2, yoyo: true, stagger: 0.14 }, 3.2)

        /* root node border glow breathing */
        .to("#tr-root",
          { boxShadow: "0 24px 70px rgba(0,0,0,0.50), 0 0 40px rgba(79,140,255,0.38), inset 0 1px 0 rgba(255,255,255,0.22)", duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.5)

        .set({}, {}, 7);

      window.__timelines["t1-ov-tree"] = tl;
    </script>
  </body>
</html>
