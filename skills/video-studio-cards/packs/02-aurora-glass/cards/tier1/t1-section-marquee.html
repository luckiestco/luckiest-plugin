<!doctype html>
<!--
  AURORA GLASS · tier1 · section · MARQUEE
  Full-screen chapter takeover. A mono-font ticker strip glides in from the
  right inside the safe area and settles (finite, deterministic); the big
  display headline sits center-stage above it. Clean, editorial, tech-zine energy.
  Slots: marquee (the repeating strip text, ~60 chars), headline (~48 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/aurora-glass/tokens.css" />
    <style>
      html, body { margin: 0; }

      #t1-sec-marq {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* Aurora bloom */
      #t1-sec-marq .bloom {
        position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1;
      }
      /* Dot grid */
      #t1-sec-marq .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size);
        opacity: 0.4;
        -webkit-mask-image: radial-gradient(110% 90% at 50% 55%, #000 28%, transparent 72%);
                mask-image: radial-gradient(110% 90% at 50% 55%, #000 28%, transparent 72%);
      }

      /* Marquee strip - positioned below center */
      #t1-sec-marq .strip-wrap {
        position: absolute; left: 0; right: 0; top: calc(var(--safe-t) + 646px); height: 62px;
        background: rgba(var(--accent-rgb), 0.10);
        border-top:    1.5px solid rgba(var(--accent-rgb), 0.45);
        border-bottom: 1.5px solid rgba(var(--accent-rgb), 0.45);
        box-shadow: 0 0 30px rgba(var(--accent-rgb), 0.22), inset 0 0 20px rgba(var(--accent-rgb), 0.06);
        overflow: hidden; z-index: 3;
        display: flex; align-items: center;
      }
      /* The crawl window - inside the safe insets, so the text never shows past them */
      #t1-sec-marq .marqwin {
        position: absolute; left: var(--safe-l); right: var(--safe-r); top: 0; bottom: 0;
        overflow: hidden; display: flex; align-items: center;
      }
      /* The moving track - window-wide; GSAP slides it in from the window's right edge */
      #t1-sec-marq .strip-inner {
        flex: none; width: 100%;
        will-change: transform;
      }
      /* One visible line; anything longer wraps onto hidden lines inside the window width */
      #t1-sec-marq .strip-segment {
        font-family: var(--font-mono); font-size: calc(22px * var(--type));
        letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--accent); text-shadow: var(--textglow-accent);
        box-sizing: border-box; padding: 0 60px;
        height: 1.6em; line-height: 1.6em; overflow: hidden;
      }
      #t1-sec-marq .strip-segment::before {
        content: "◆"; margin-right: 40px; vertical-align: middle;
        font-size: calc(10px * var(--type)); color: rgba(var(--accent-rgb), 0.55);
      }

      /* Left/right edge fade masks */
      #t1-sec-marq .strip-wrap::before,
      #t1-sec-marq .strip-wrap::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 160px; z-index: 1;
        pointer-events: none;
      }
      #t1-sec-marq .strip-wrap::before {
        left: 0;
        background: linear-gradient(to right, var(--canvas) 0%, transparent 100%);
      }
      #t1-sec-marq .strip-wrap::after {
        right: 0;
        background: linear-gradient(to left, var(--canvas) 0%, transparent 100%);
      }

      /* Headline - large, centered, above the strip */
      #t1-sec-marq .content {
        position: absolute; left: var(--safe-l); right: var(--safe-r); top: var(--safe-t); bottom: var(--safe-b);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding-bottom: 80px; z-index: 4;
      }
      #t1-sec-marq .headline {
        font-family: var(--font-display); font-weight: var(--wt-black);
        font-size: var(--size-display); line-height: 1.0; letter-spacing: var(--track-tight);
        color: var(--white); text-shadow: var(--textglow);
        text-align: center; max-width: 1540px;
      }
      #t1-sec-marq .headline em {
        font-style: normal;
        background: linear-gradient(90deg, var(--white) 0%, var(--accent) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Horizontal rule above headline */
      #t1-sec-marq .rule {
        width: 80px; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.6);
        margin-bottom: 42px; align-self: center;
      }

      #t1-sec-marq .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 6;
        background: var(--vignette);
      }
      #t1-sec-marq .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 200px 200px; mix-blend-mode: overlay; opacity: 0.10;
        pointer-events: none; z-index: 7;
      }

      /* Vertical and square: the headline steps down so its longest word fits the safe width
         and the strip moves low in the safe box under it; the crawl window stays in the insets. */
      [data-format="vertical"] #t1-sec-marq .headline { font-size: calc(96px * var(--type)); text-wrap: balance; }
      [data-format="square"] #t1-sec-marq .headline { font-size: 116px; text-wrap: balance; }
      [data-format="vertical"] #t1-sec-marq .strip-wrap { top: calc(var(--safe-t) + 780px); }
    </style>
  </head>
  <body>
    <div id="t1-sec-marq" data-composition-id="t1-sec-marq" data-start="0" data-width="1920" data-height="1080">
      <div class="bloom"></div>
      <div class="grid"></div>

      <div class="strip-wrap">
        <div class="marqwin">
          <div class="strip-inner" id="t1-sec-marq-track">
            <div class="strip-segment" data-slot="marquee">Prompt Engineering · Context Windows · Fine-Tuning · Retrieval-Augmented Generation · Agents · Tool Use</div>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="rule"></div>
        <div class="headline" data-slot="headline">The <em>Prompting</em> Playbook</div>
      </div>

      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* grain flicker - deterministic */
      tl.fromTo("#t1-sec-marq .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "120px 90px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);

      /* bloom + grid */
      tl.from("#t1-sec-marq .bloom", { autoAlpha: 0, scale: 0.9, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-sec-marq .grid",  { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2);

      /* Strip slides in from below */
      tl.from("#t1-sec-marq .strip-wrap", { autoAlpha: 0, y: 40, duration: 0.9, ease: "power3.out" }, 0.4);

      /* Marquee crawl - the track starts one window-width to the right (hidden by the window)
         and glides left until it fills the window, settling by the hold frame. The window width
         is read from layout, so the crawl fits every format. */
      const track = document.getElementById("t1-sec-marq-track");
      const winW = track.parentNode.offsetWidth;
      tl.fromTo(track,
        { x: winW },
        { x: 0, duration: 5.0, ease: "power1.out" }, 0.4);

      /* rule slides in */
      tl.from("#t1-sec-marq .rule", { autoAlpha: 0, scaleX: 0, transformOrigin: "50% 50%", duration: 0.6, ease: "power3.out" }, 0.85);

      /* headline glides down + blur resolves */
      tl.from("#t1-sec-marq .headline", { autoAlpha: 0, y: -44, filter: "blur(18px)", duration: 1.1, ease: "power4.out" }, 1.0);

      tl.set({}, {}, 7);

      window.__timelines["t1-sec-marq"] = tl;
    </script>
  </body>
</html>
