<!doctype html>
<!--
  PAPER COLLAGE · tier1 · stat · AREA / CIRCLE-PACK COMPARISON
  One LARGE yellow circle vs a SMALL reference circle (area comparison).
  The large circle's area is proportional to the stat; small circle is reference unit.
  The big multiplier number is the hero. Circles pop in via scale.
  Slots: kicker, bigLabel, smallLabel, stat (the multiplier), label (richtext), source.
  Knob: data-mult on #pack-wrap (integer, default 12) - sets the area ratio.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-pack {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-pack .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-pack .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-pack .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 52%, rgba(23,19,14,0.18) 100%);
      }
      #t1-stat-pack .kicker {
        position: absolute; left: calc(var(--safe-l) + 34px); top: calc(var(--safe-t) + 38px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      /* big circle */
      #t1-stat-pack .circle-big {
        position: absolute;
        border-radius: 50%;
        background: var(--yellow);
        box-shadow: 0 0 0 5px var(--ink);
      }
      /* small circle */
      #t1-stat-pack .circle-small {
        position: absolute;
        border-radius: 50%;
        background: var(--paper-2);
        box-shadow: 0 0 0 4px var(--ink);
      }
      /* label under big circle */
      #t1-stat-pack .big-label {
        position: absolute;
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: calc(28px * var(--type)); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink); text-align: center;
      }
      /* label under small circle */
      #t1-stat-pack .small-label {
        position: absolute;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: calc(26px * var(--type)); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted); text-align: center;
      }
      /* multiplier connector */
      #t1-stat-pack .mult-badge {
        position: absolute;
        font-weight: var(--wt-black); font-size: calc(200px * var(--type)); line-height: 1;
        letter-spacing: -0.05em; font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      #t1-stat-pack .mult-badge .mult-x {
        font-size: calc(100px * var(--type)); font-weight: var(--wt-black); color: var(--red);
        vertical-align: super; line-height: 0;
      }
      /* right-side label + source */
      #t1-stat-pack .label {
        position: absolute; right: calc(var(--safe-r) + 34px); bottom: calc(var(--safe-b) + 166px); width: 620px;
        font-weight: var(--wt-thin); font-size: calc(54px * var(--type)); line-height: 1.06;
        letter-spacing: var(--track-tight); color: var(--ink); text-align: right;
      }
      #t1-stat-pack .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-pack .source {
        position: absolute; left: calc(var(--safe-l) + 34px); bottom: calc(var(--safe-b) + 34px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical: the multiplier with the label beside it on top, the two circles (sized by the
         script) under them. Square: circles on top, multiplier and label under them. */
      [data-format="vertical"] #t1-stat-pack .kicker, [data-format="square"] #t1-stat-pack .kicker { left: var(--safe-l); top: var(--safe-t); }
      [data-format="vertical"] #t1-stat-pack .mult-badge { left: var(--safe-l); top: calc(var(--safe-t) + 60px); }
      [data-format="vertical"] #t1-stat-pack .label {
        left: calc(var(--safe-l) + 380px); right: var(--safe-r); width: auto; bottom: auto; top: calc(var(--safe-t) + 90px); text-align: left;
      }
      [data-format="square"] #t1-stat-pack .mult-badge { left: var(--safe-l); top: calc(var(--safe-t) + 640px); }
      [data-format="square"] #t1-stat-pack .label {
        left: calc(var(--safe-l) + 330px); right: var(--safe-r); width: auto; bottom: auto; top: calc(var(--safe-t) + 660px); text-align: left;
      }
      [data-format="vertical"] #t1-stat-pack .source, [data-format="square"] #t1-stat-pack .source { left: var(--safe-l); bottom: var(--safe-b); }
    </style>
  </head>
  <body>
    <div id="t1-stat-pack" data-composition-id="t1-stat-pack" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">REACH COMPARISON</div>

      <!-- circles and labels positioned by JS for determinism -->
      <div class="circle-big"   id="circle-big"   data-mult="12"></div>
      <div class="circle-small" id="circle-small"></div>
      <div class="big-label"    id="big-label"   data-slot="bigLabel">Short-Form Video</div>
      <div class="small-label"  id="small-label" data-slot="smallLabel">Long-Form Video</div>

      <!-- big multiplier hero number -->
      <div class="mult-badge" id="mult-badge">
        <span data-slot="stat">12</span><span class="mult-x">×</span>
      </div>

      <div class="label" data-slot="label">more viewers reached on average per <em>post</em></div>
      <div class="source" data-slot="source">SOURCE · REACH ANALYTICS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      // Deterministic circle sizing: area proportional to mult.
      // Reference (small) circle r = 80px. Big circle r = 80 * sqrt(mult).
      var bigEl   = document.getElementById("circle-big");
      var smallEl = document.getElementById("circle-small");
      var bigLbl  = document.getElementById("big-label");
      var smallLbl= document.getElementById("small-label");
      var badge   = document.getElementById("mult-badge");

      // Geometry per format (the stamp sets data-format on <html>). Vertical and square use smaller
      // circles; their multiplier and label are placed by the format CSS rules instead.
      var fmt = document.documentElement.getAttribute("data-format") || "landscape";
      var G = {
        landscape: { rSmall: 80, bigCX: 460, bigCY: 530, gap: 90, lblWidth: 300 },
        vertical:  { rSmall: 56, bigCX: 416, bigCY: 862, gap: 60, lblWidth: 260 },
        square:    { rSmall: 64, bigCX: 446, bigCY: 380, gap: 60, lblWidth: 260 }
      }[fmt] || { rSmall: 80, bigCX: 460, bigCY: 530, gap: 90, lblWidth: 300 };

      var mult = Math.max(1, parseInt(bigEl.getAttribute("data-mult"), 10) || 12);
      var rSmall = G.rSmall;
      var rBig   = Math.round(rSmall * Math.sqrt(mult));  // area-correct radius

      // Position: big circle on the left; small circle to its right
      var bigCX  = G.bigCX; var bigCY  = G.bigCY;
      var gap    = G.gap;
      var smallCX = bigCX + rBig + gap + rSmall;
      var smallCY = bigCY + rBig - rSmall;  // bottom-align the circles

      bigEl.style.width  = (rBig   * 2) + "px";
      bigEl.style.height = (rBig   * 2) + "px";
      bigEl.style.left   = (bigCX  - rBig)   + "px";
      bigEl.style.top    = (bigCY  - rBig)   + "px";

      smallEl.style.width  = (rSmall * 2) + "px";
      smallEl.style.height = (rSmall * 2) + "px";
      smallEl.style.left   = (smallCX - rSmall) + "px";
      smallEl.style.top    = (smallCY - rSmall) + "px";

      // Labels centered under each circle
      var lblWidth = G.lblWidth;
      bigLbl.style.width  = lblWidth + "px";
      bigLbl.style.left   = (bigCX   - lblWidth / 2) + "px";
      bigLbl.style.top    = (bigCY   + rBig + 24) + "px";

      smallLbl.style.width  = lblWidth + "px";
      smallLbl.style.left   = (smallCX - lblWidth / 2) + "px";
      smallLbl.style.top    = (smallCY + rSmall + 24) + "px";

      // Badge: center-right area
      if (fmt === "landscape") {
        badge.style.left = (smallCX + rSmall + 80) + "px";
        badge.style.top  = "50%";
        badge.style.transform = "translateY(-50%)";
      }

      var tl = gsap.timeline({ paused: true });

      tl.fromTo("#t1-stat-pack .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      tl.from("#t1-stat-pack .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2);

      // Small circle pops in first as the reference
      tl.from(smallEl, { scale: 0, transformOrigin: "50% 50%", duration: 0.32, ease: "back.out(2.2)" }, 0.35);
      tl.from(smallLbl, { autoAlpha: 0, y: 12, duration: 0.28, ease: "power2.out" }, 0.55);

      // Big circle scales up with steps - the reveal moment
      tl.from(bigEl, { scale: 0, transformOrigin: "50% 50%", duration: 0.55, ease: "steps(6)" }, 0.65);
      tl.from(bigLbl, { autoAlpha: 0, y: 12, duration: 0.28, ease: "power2.out" }, 1.0);

      // Hero multiplier snaps in
      tl.from(badge, { autoAlpha: 0, scale: 0.5, duration: 0.42, ease: "back.out(2.4)" }, 1.1);

      tl.from("#t1-stat-pack .label",  { autoAlpha: 0, y: 18, duration: 0.38, ease: "power3.out" }, 1.4);
      tl.from("#t1-stat-pack .source", { autoAlpha: 0, duration: 0.28 }, 1.65);

      tl.set({}, {}, 6);
      window.__timelines["t1-stat-pack"] = tl;
    </script>
  </body>
</html>
