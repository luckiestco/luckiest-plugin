<!doctype html>
<!--
  PAPER COLLAGE · tier1 · stat · BAR
  Proportional horizontal bar. A kraft track spans the canvas; a yellow fill
  wipes to the value (data-fill = 0..1). The number rides at the head of the
  fill. Functional data-viz as the eye-magnet - no circle.
  Slots: kicker, stat (label on the fill, e.g. 73%), label (richtext), source.
  Knob: data-fill on .track sets the fill fraction (default 0.73).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-bar {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-bar .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-bar .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-bar .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.16) 100%);
      }
      #t1-stat-bar .kicker {
        position: absolute; left: calc(var(--safe-l) + 34px); top: calc(var(--safe-t) + 226px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }
      #t1-stat-bar .track {
        position: absolute; left: calc(var(--safe-l) + 34px); right: calc(var(--safe-r) + 34px); top: calc(var(--safe-t) + 416px); height: 150px;
        background: var(--paper-2); box-shadow: inset 0 0 0 4px var(--ink);
      }
      #t1-stat-bar .fill {
        position: absolute; inset: 0; width: 73%;
        background: var(--yellow); transform-origin: left center;
        box-shadow: 4px 0 0 0 var(--ink);
      }
      #t1-stat-bar .stat {
        position: absolute; top: 50%; transform: translateY(-50%);
        right: 30px; z-index: 3; font-weight: var(--wt-black); font-size: calc(120px * var(--type));
        line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums;
      }
      /* faint axis ticks on the track */
      #t1-stat-bar .ticks {
        position: absolute; left: calc(var(--safe-l) + 34px); right: calc(var(--safe-r) + 34px); top: calc(var(--safe-t) + 578px); height: 26px;
        background-image: repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 25%);
        opacity: 0.35;
      }
      #t1-stat-bar .label {
        position: absolute; left: calc(var(--safe-l) + 34px); right: calc(var(--safe-r) + 34px); top: calc(var(--safe-t) + 666px);
        font-weight: var(--wt-thin); font-size: calc(60px * var(--type)); line-height: 1.05;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-bar .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-bar .source {
        position: absolute; left: calc(var(--safe-l) + 34px); bottom: calc(var(--safe-b) + 42px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical and square: the same stack (kicker, bar, ticks, label) spans the safe width and
         sits centered in the safe height; source stays at the safe bottom. */
      [data-format="vertical"] #t1-stat-bar .kicker, [data-format="square"] #t1-stat-bar .kicker { left: var(--safe-l); top: calc(var(--safe-t) + 150px); }
      [data-format="vertical"] #t1-stat-bar .track, [data-format="square"] #t1-stat-bar .track { left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 220px); height: 170px; }
      [data-format="vertical"] #t1-stat-bar .ticks, [data-format="square"] #t1-stat-bar .ticks { left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 402px); }
      [data-format="vertical"] #t1-stat-bar .label, [data-format="square"] #t1-stat-bar .label { left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 480px); }
      [data-format="vertical"] #t1-stat-bar .stat { font-size: calc(110px * var(--type)); right: 22px; }
      [data-format="vertical"] #t1-stat-bar .source, [data-format="square"] #t1-stat-bar .source { left: var(--safe-l); bottom: var(--safe-b); }
    </style>
  </head>
  <body>
    <div id="t1-stat-bar" data-composition-id="t1-stat-bar" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">SHARE OF MARKET</div>
      <div class="track" data-fill="0.73">
        <div class="fill"><div class="stat" data-slot="stat">73%</div></div>
      </div>
      <div class="ticks"></div>
      <div class="label" data-slot="label">of watch time now comes from <em>short-form</em></div>
      <div class="source" data-slot="source">SOURCE · ANALYTICS 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const track = document.querySelector("#t1-stat-bar .track");
      const fillFrac = parseFloat(track.getAttribute("data-fill")) || 0.73;
      const fillEl = track.querySelector(".fill");
      fillEl.style.width = (fillFrac * 100) + "%";
      const tl = gsap.timeline({ paused: true });
      gsap.set("#t1-stat-bar .fill", { scaleX: 0 }); // was a CSS transform; GSAP owns it now
      tl.fromTo("#t1-stat-bar .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-bar .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat-bar .track", { autoAlpha: 0, y: 24, duration: 0.3, ease: "power2.out" }, 0.3)
        .from("#t1-stat-bar .ticks", { autoAlpha: 0, duration: 0.3 }, 0.35)
        .to("#t1-stat-bar .fill", { scaleX: 1, duration: 0.62, ease: "steps(8)" }, 0.5)
        .from("#t1-stat-bar .stat", { autoAlpha: 0, scale: 0.6, duration: 0.35, ease: "back.out(2.4)" }, 1.0)
        .from("#t1-stat-bar .label", { autoAlpha: 0, y: 20, duration: 0.4, ease: "power3.out" }, 1.1)
        .from("#t1-stat-bar .source", { autoAlpha: 0, duration: 0.3 }, 1.35)
        .set({}, {}, 6);
      window.__timelines["t1-stat-bar"] = tl;
    </script>
  </body>
</html>
