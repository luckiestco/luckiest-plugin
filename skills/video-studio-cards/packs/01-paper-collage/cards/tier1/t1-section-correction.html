<!doctype html>
<!--
  PAPER COLLAGE · tier1 · section · CORRECTION
  Editorial "edit mark": one word struck through in red with a handwritten
  correction above it, a hand-drawn arrow to a yellow wordmark circle.
  Slots: pre, struck (crossed word), post, correction (handwritten), wordmark.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-correction {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-correction .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-correction .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none;
      }
      #t1-sec-correction .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 120% at 45% 50%, transparent 58%, rgba(23,19,14,0.15) 100%);
      }
      #t1-sec-correction .headline {
        position: absolute; left: calc(var(--safe-l) + 54px); top: calc(var(--safe-t) + 376px); width: 1050px; z-index: 3;
        font-weight: var(--wt-thin); font-size: calc(132px * var(--type)); line-height: 1.05;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-correction .struck { position: relative; font-weight: var(--wt-black); }
      #t1-sec-correction .struck .strike {
        position: absolute; left: -6px; right: -6px; top: 56%; height: 9px;
        background: var(--red); transform-origin: left center;
      }
      #t1-sec-correction .correction {
        position: absolute; left: 0; top: -64px;
        font-family: var(--font-hand); font-size: calc(64px * var(--type)); font-weight: 700; color: var(--red);
        transform: rotate(-3deg); white-space: nowrap;
      }
      /* yellow wordmark circle on the right */
      #t1-sec-correction .circle {
        position: absolute; right: calc(var(--safe-r) + 104px); top: calc(var(--safe-t) + 376px); width: 300px; height: 300px;
        background: var(--yellow); border-radius: 50%; z-index: 2;
        display: flex; align-items: center; justify-content: center;
        font-weight: var(--wt-black); font-style: italic; font-size: calc(110px * var(--type)); color: var(--ink);
      }
      #t1-sec-correction .kicker {
        position: absolute; left: calc(var(--safe-l) + 54px); top: calc(var(--safe-t) + 266px); z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical and square: kicker and headline across the safe width, the wordmark circle
         drops below them to the safe bottom right. */
      [data-format="vertical"] #t1-sec-correction .kicker, [data-format="square"] #t1-sec-correction .kicker { left: var(--safe-l); top: calc(var(--safe-t) + 60px); }
      [data-format="vertical"] #t1-sec-correction .headline, [data-format="square"] #t1-sec-correction .headline { left: var(--safe-l); top: calc(var(--safe-t) + 200px); width: calc(var(--w) - var(--safe-l) - var(--safe-r)); }
      [data-format="vertical"] #t1-sec-correction .headline { font-size: calc(94px * var(--type)); }
      [data-format="square"] #t1-sec-correction .headline { font-size: 116px; }
      [data-format="vertical"] #t1-sec-correction .circle, [data-format="square"] #t1-sec-correction .circle { right: var(--safe-r); top: auto; bottom: var(--safe-b); }
      [data-format="square"] #t1-sec-correction .circle { width: 270px; height: 270px; font-size: 100px; }
      [data-format="vertical"] #t1-sec-correction .kicker { top: calc(var(--safe-t) + 160px); }
      [data-format="vertical"] #t1-sec-correction .headline { top: calc(var(--safe-t) + 300px); }
      [data-format="vertical"] #t1-sec-correction .circle { width: 340px; height: 340px; font-size: calc(90px * var(--type)); }
    </style>
  </head>
  <body>
    <div id="t1-sec-correction" data-composition-id="t1-sec-correction" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">LET'S BE CLEAR</div>
      <div class="headline">
        <span data-slot="pre">It was never</span>
        <span class="struck"><span data-slot="struck">luck</span><span class="strike"></span><span class="correction" data-slot="correction">a system</span></span>
        <span data-slot="post"></span>
      </div>
      <div class="circle" data-slot="wordmark">Acme</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#t1-sec-correction .struck .strike", { scaleX: 0 }); // was a CSS transform; GSAP owns it now
      tl.fromTo("#t1-sec-correction .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-correction .kicker", { autoAlpha: 0, x: -24, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-sec-correction .headline", { autoAlpha: 0, y: 24, duration: 0.45, ease: "power3.out" }, 0.35)
        .to("#t1-sec-correction .struck .strike", { scaleX: 1, duration: 0.34, ease: "power2.in" }, 0.95)
        .from("#t1-sec-correction .correction", { autoAlpha: 0, scale: 0.6, rotate: 14, transformOrigin: "left bottom", duration: 0.34, ease: "back.out(2.6)" }, 1.2)
        .from("#t1-sec-correction .circle", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.42, ease: "back.out(2.2)" }, 1.0)
        .set({}, {}, 6);
      window.__timelines["t1-sec-correction"] = tl;
    </script>
  </body>
</html>
