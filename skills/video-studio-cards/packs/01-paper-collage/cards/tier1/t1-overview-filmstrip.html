<!doctype html>
<!--
  PAPER COLLAGE · tier1 · overview · 35MM FILMSTRIP
  A horizontal 35mm film strip across the middle (ink strip with sprocket holes top +
  bottom via repeating-gradient), holding 4 frames. Each frame = a halftone photo
  placeholder + a caption below. Strip slides in a short finite distance (steps),
  frames settle. Very archival.
  Slots: title, img1, cap1, img2, cap2, img3, cap3, img4, cap4, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-film {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-film .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-film .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 8;
      }
      #t1-ov-film .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 7;
        background: radial-gradient(130% 120% at 50% 40%, transparent 58%, rgba(23,19,14,0.18) 100%);
      }
      /* marker title */
      #t1-ov-film .title {
        position: absolute; top: calc(var(--safe-t) + 8px); left: 50%;
        transform: translateX(-50%) skewX(var(--marker-skew));
        background: var(--yellow); padding: 8px 28px; z-index: 10;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); text-transform: uppercase; white-space: nowrap;
      }
      /* film strip band - the ink band that contains everything */
      #t1-ov-film .strip-band {
        position: absolute; left: -40px; right: -40px; top: 270px; height: 400px;
        background: var(--ink); z-index: 2;
      }
      /* sprocket holes - top row */
      #t1-ov-film .sprockets-top {
        position: absolute; left: 0; right: 0; top: 14px; height: 32px;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0px, transparent 32px,
          var(--paper-2) 32px, var(--paper-2) 56px,
          transparent 56px, transparent 88px
        );
        opacity: 0.9;
      }
      /* sprocket holes - bottom row */
      #t1-ov-film .sprockets-bottom {
        position: absolute; left: 0; right: 0; bottom: 14px; height: 32px;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0px, transparent 32px,
          var(--paper-2) 32px, var(--paper-2) 56px,
          transparent 56px, transparent 88px
        );
        opacity: 0.9;
      }
      /* frames container - sits inside the strip band, centered vertically */
      #t1-ov-film .frames {
        position: absolute; left: 100px; right: 100px; top: 60px; bottom: 60px;
        display: flex; gap: 28px; align-items: stretch; z-index: 1;
      }
      /* individual frame */
      #t1-ov-film .frame {
        flex: 1; display: flex; flex-direction: column;
        outline: 4px solid var(--paper-2); outline-offset: -4px;
        overflow: hidden; position: relative;
      }
      /* halftone photo placeholder */
      #t1-ov-film .frame-img {
        flex: 1;
        background-color: var(--paper-2);
        background-image: var(--tex-halftone);
        background-size: var(--tex-halftone-size);
        background-position: center;
        background-blend-mode: multiply;
      }
      /* frame number stamp top-left corner */
      #t1-ov-film .frame-num {
        position: absolute; top: 6px; left: 8px;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: calc(16px * var(--type)); letter-spacing: 0.1em;
        color: var(--paper); opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }
      /* captions - sit below the strip band */
      #t1-ov-film .captions {
        position: absolute; left: calc(var(--safe-l) + 4px); right: calc(var(--safe-r) + 4px); top: 716px;
        display: flex; gap: 28px; z-index: 3;
      }
      #t1-ov-film .cap {
        flex: 1; text-align: center;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--ink); line-height: 1.3;
      }
      /* yellow accent underline on first caption */
      #t1-ov-film .cap-1::after {
        content: ""; display: block; width: 48px; height: 4px;
        background: var(--yellow); margin: 8px auto 0;
      }
      /* source */
      #t1-ov-film .source {
        position: absolute; left: calc(var(--safe-l) + 34px); bottom: calc(var(--safe-b) + 6px); z-index: 10;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical: the strip turns upright under the title and runs off the bottom edge, frames
         stacked; captions sit in a column to the right, one beside each frame. */
      [data-format="vertical"] #t1-ov-film .title, [data-format="square"] #t1-ov-film .title {
        top: var(--safe-t); left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2);
      }
      [data-format="vertical"] #t1-ov-film .title { font-size: calc(64px * var(--type)); }
      [data-format="vertical"] #t1-ov-film .strip-band { left: var(--safe-l); right: auto; width: 400px; top: calc(var(--safe-t) + 140px); height: auto; bottom: -40px; }
      [data-format="vertical"] #t1-ov-film .sprockets-top, [data-format="vertical"] #t1-ov-film .sprockets-bottom {
        top: 0; bottom: 0; height: auto; width: 32px;
        background-image: repeating-linear-gradient(180deg, transparent 0px, transparent 32px,
          var(--paper-2) 32px, var(--paper-2) 56px, transparent 56px, transparent 88px);
      }
      [data-format="vertical"] #t1-ov-film .sprockets-top { left: 14px; right: auto; }
      [data-format="vertical"] #t1-ov-film .sprockets-bottom { right: 14px; left: auto; }
      [data-format="vertical"] #t1-ov-film .frames {
        left: 60px; right: 60px; top: 30px; bottom: auto; height: 790px;
        flex-direction: column;
      }
      [data-format="vertical"] #t1-ov-film .captions {
        left: calc(var(--safe-l) + 440px); right: var(--safe-r); top: calc(var(--safe-t) + 170px); height: 790px;
        flex-direction: column;
      }
      [data-format="vertical"] #t1-ov-film .cap { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; }
      [data-format="vertical"] #t1-ov-film .cap-1::after { margin: 10px 0 0; }
      [data-format="vertical"] #t1-ov-film .source { left: calc(var(--safe-l) + 440px); bottom: var(--safe-b); }
      [data-format="square"] #t1-ov-film .source { left: var(--safe-l); bottom: var(--safe-b); }
      /* Square: same horizontal strip, frames and captions aligned to the safe width. */
      [data-format="square"] #t1-ov-film .strip-band { top: calc(var(--safe-t) + 170px); }
      [data-format="square"] #t1-ov-film .frames { left: calc(var(--safe-l) + 40px); right: calc(var(--safe-r) + 40px); gap: 20px; }
      [data-format="square"] #t1-ov-film .captions { left: var(--safe-l); right: var(--safe-r); top: calc(var(--safe-t) + 600px); gap: 20px; }
    </style>
  </head>
  <body>
    <div id="t1-ov-film" data-composition-id="t1-ov-film" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <div class="title" data-slot="title">THE ARCHIVE</div>

      <div class="strip-band">
        <div class="sprockets-top"></div>
        <div class="sprockets-bottom"></div>
        <div class="frames">
          <div class="frame f1">
            <div class="frame-num">01A</div>
            <div class="frame-img" data-slot="img1"></div>
          </div>
          <div class="frame f2">
            <div class="frame-num">02A</div>
            <div class="frame-img" data-slot="img2"></div>
          </div>
          <div class="frame f3">
            <div class="frame-num">03A</div>
            <div class="frame-img" data-slot="img3"></div>
          </div>
          <div class="frame f4">
            <div class="frame-num">04A</div>
            <div class="frame-img" data-slot="img4"></div>
          </div>
        </div>
      </div>

      <div class="captions">
        <div class="cap cap-1" data-slot="cap1">The Beginning</div>
        <div class="cap cap-2" data-slot="cap2">The Shift</div>
        <div class="cap cap-3" data-slot="cap3">The Crisis</div>
        <div class="cap cap-4" data-slot="cap4">The Resolution</div>
      </div>

      <div class="source" data-slot="source">ARCHIVE · 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker - finite
      tl.fromTo("#t1-ov-film .grain", { backgroundPosition: "0px 0px" },
        { backgroundPosition: "160px 100px", duration: 0.5, ease: "steps(4)", repeat: 13, yoyo: true }, 0);

      // title snaps in
      tl.from("#t1-ov-film .title",
        { autoAlpha: 0, scaleX: 0, transformOrigin: "center center", duration: 0.4, ease: "power3.out" }, 0.15);

      // strip band slides in from the right a short finite distance (choppy steps)
      tl.from("#t1-ov-film .strip-band",
        { x: 120, duration: 0.5, ease: "steps(6)" }, 0.4);
      tl.from("#t1-ov-film .strip-band",
        { autoAlpha: 0, duration: 0.2 }, 0.4);

      // frames settle in staggered after strip arrives
      tl.from("#t1-ov-film .f1",
        { autoAlpha: 0, y: 24, duration: 0.35, ease: "back.out(1.6)" }, 0.72);
      tl.from("#t1-ov-film .f2",
        { autoAlpha: 0, y: 24, duration: 0.35, ease: "back.out(1.6)" }, 0.88);
      tl.from("#t1-ov-film .f3",
        { autoAlpha: 0, y: 24, duration: 0.35, ease: "back.out(1.6)" }, 1.04);
      tl.from("#t1-ov-film .f4",
        { autoAlpha: 0, y: 24, duration: 0.35, ease: "back.out(1.6)" }, 1.20);

      // captions drop in beneath the strip
      tl.from("#t1-ov-film .cap-1",
        { autoAlpha: 0, y: 14, duration: 0.3, ease: "power2.out" }, 0.85);
      tl.from("#t1-ov-film .cap-2",
        { autoAlpha: 0, y: 14, duration: 0.3, ease: "power2.out" }, 1.0);
      tl.from("#t1-ov-film .cap-3",
        { autoAlpha: 0, y: 14, duration: 0.3, ease: "power2.out" }, 1.15);
      tl.from("#t1-ov-film .cap-4",
        { autoAlpha: 0, y: 14, duration: 0.3, ease: "power2.out" }, 1.30);

      tl.from("#t1-ov-film .source", { autoAlpha: 0, duration: 0.3 }, 1.5);

      tl.set({}, {}, 7);

      window.__timelines["t1-ov-film"] = tl;
    </script>
  </body>
</html>
