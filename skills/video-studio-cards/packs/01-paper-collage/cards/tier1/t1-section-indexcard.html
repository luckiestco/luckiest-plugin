<!doctype html>
<!--
  PAPER COLLAGE · tier1 · section · INDEXCARD
  Library catalog card: ruled lines, a red index tab, a typed label and code,
  the title in serif on the ruled lines. Clean archival.
  Slots: tab (label), code, title, sub.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-index {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper-2); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
        display: flex; align-items: center; justify-content: center;
      }
      #t1-sec-index .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.5; pointer-events: none;
      }
      #t1-sec-index .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 120% at 50% 48%, transparent 50%, rgba(23,19,14,0.22) 100%);
      }
      #t1-sec-index .card {
        position: relative; z-index: 3; width: 1320px; height: 700px; background: var(--paper);
        box-shadow: 0 28px 60px rgba(23,19,14,0.34);
        /* ruled lines */
        background-image: repeating-linear-gradient(0deg, transparent 0 95px, rgba(23,19,14,0.10) 95px 96px);
        background-position: 0 150px;
      }
      #t1-sec-index .redline { position: absolute; left: 120px; top: 0; bottom: 0; width: 4px; background: var(--red); opacity: 0.6; }
      #t1-sec-index .tab {
        position: absolute; left: 90px; top: -54px; height: 54px; display: flex; align-items: center; padding: 0 28px;
        background: var(--red); color: var(--paper);
        font-family: var(--font-label); font-weight: var(--wt-black); font-size: calc(26px * var(--type));
        letter-spacing: 0.14em; text-transform: uppercase;
      }
      #t1-sec-index .code {
        position: absolute; left: 56px; top: 44px;
        font-family: var(--font-label); font-weight: var(--wt-bold); font-size: calc(26px * var(--type));
        letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
      }
      #t1-sec-index .title {
        position: absolute; left: 160px; top: 220px; width: 1080px;
        font-weight: var(--wt-black); font-size: calc(130px * var(--type)); line-height: 0.96; letter-spacing: var(--track-tight);
      }
      #t1-sec-index .sub {
        position: absolute; left: 160px; top: 470px; width: 1040px;
        font-family: var(--font-label); font-weight: var(--wt-reg); font-size: calc(30px * var(--type)); line-height: 1.5; color: var(--ink);
      }

      /* Vertical and square: the card fits the safe width and is centered on the safe box (not the
         frame); red margin line, title and note move in to match the narrower card. */
      [data-format="vertical"] #t1-sec-index .card { top: calc((var(--safe-t) - var(--safe-b)) / 2); left: calc((var(--safe-l) - var(--safe-r)) / 2); width: calc(var(--w) - var(--safe-l) - var(--safe-r)); height: 720px; }
      [data-format="square"] #t1-sec-index .card { top: 27px; width: calc(var(--w) - var(--safe-l) - var(--safe-r) - 40px); height: 640px; }
      [data-format="vertical"] #t1-sec-index .redline { left: 76px; }
      [data-format="square"] #t1-sec-index .redline { left: 96px; }
      [data-format="vertical"] #t1-sec-index .tab { left: 50px; }
      [data-format="vertical"] #t1-sec-index .code { left: 40px; }
      [data-format="vertical"] #t1-sec-index .title { left: 110px; top: 200px; width: 610px; font-size: calc(96px * var(--type)); }
      [data-format="square"] #t1-sec-index .title { left: 136px; top: 190px; width: 700px; font-size: 112px; }
      [data-format="vertical"] #t1-sec-index .sub { left: 110px; top: 480px; width: 610px; }
      [data-format="square"] #t1-sec-index .sub { left: 136px; top: 440px; width: 700px; }
    </style>
  </head>
  <body>
    <div id="t1-sec-index" data-composition-id="t1-sec-index" data-start="0" data-width="1920" data-height="1080">
      <div class="card">
        <div class="redline"></div>
        <div class="code" data-slot="code">REF · 658.4 / 2026</div>
        <div class="tab" data-slot="tab">SUBJECT</div>
        <div class="title" data-slot="title">The paper trail</div>
        <div class="sub" data-slot="sub">Everything we found, filed in one place.</div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-index .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 150px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-index .card", { autoAlpha: 0, y: 50, rotate: -2, duration: 0.5, ease: "back.out(1.5)" }, 0.15)
        .from("#t1-sec-index .tab", { autoAlpha: 0, y: 20, duration: 0.3, ease: "back.out(2.0)" }, 0.45)
        .from("#t1-sec-index .code", { autoAlpha: 0, x: -16, duration: 0.28, ease: "steps(4)" }, 0.55)
        .from("#t1-sec-index .title", { autoAlpha: 0, y: 22, clipPath: "inset(0 0 100% 0)", duration: 0.45, ease: "power3.out" }, 0.6)
        .from("#t1-sec-index .sub", { autoAlpha: 0, y: 14, duration: 0.3 }, 0.85)
        .set({}, {}, 6);
      window.__timelines["t1-sec-index"] = tl;
    </script>
  </body>
</html>
