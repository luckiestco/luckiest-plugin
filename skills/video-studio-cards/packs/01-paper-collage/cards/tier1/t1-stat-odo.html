<!doctype html>
<!--
  PAPER COLLAGE · tier1 · stat · ODOMETER
  The number rendered as mechanical split-flap digit cells (dark cells, paper
  glyphs, a center seam). A stepped clip-wipe gives the count-up / flip feel.
  Slots: kicker, stat (the number string), label (richtext), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-odo {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-odo .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-odo .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-odo .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 46%, transparent 54%, rgba(23,19,14,0.2) 100%);
      }
      #t1-stat-odo .kicker {
        position: absolute; left: 50%; top: calc(var(--safe-t) + 196px); transform: translateX(-50%);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red); white-space: nowrap;
      }
      #t1-stat-odo .odo {
        position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        padding: 34px 48px; background: var(--ink); color: var(--paper);
        border-radius: 8px; box-shadow: 0 22px 44px rgba(23,19,14,0.36);
        font-weight: var(--wt-black); font-size: calc(300px * var(--type)); line-height: 1;
        letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
        /* vertical cell dividers + a horizontal flap seam */
        background-image:
          linear-gradient(0deg, transparent calc(50% - 2px), rgba(239,233,220,0.22) calc(50% - 2px) calc(50% + 2px), transparent calc(50% + 2px)),
          repeating-linear-gradient(90deg, transparent 0 0.92em, rgba(239,233,220,0.14) 0.92em 0.96em);
        overflow: hidden;
      }
      #t1-stat-odo .odo .clip { display: inline-block; }
      #t1-stat-odo .label {
        position: absolute; left: 50%; bottom: calc(var(--safe-b) + 136px); transform: translateX(-50%);
        width: 1200px; text-align: center;
        font-weight: var(--wt-thin); font-size: var(--size-headline); line-height: 1.05;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-stat-odo .label em { font-style: italic; font-weight: var(--wt-black); }
      #t1-stat-odo .source {
        position: absolute; left: 50%; bottom: calc(var(--safe-b) + 42px); transform: translateX(-50%);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical and square: kicker, the odometer sized to the safe width, label under it, source at
         the safe bottom, all centered on the safe area (--cx). */
      [data-format="vertical"] #t1-stat-odo, [data-format="square"] #t1-stat-odo {
        --cx: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2);
      }
      [data-format="vertical"] #t1-stat-odo .kicker { left: var(--cx); top: calc(var(--safe-t) + 200px); }
      [data-format="vertical"] #t1-stat-odo .odo { left: var(--cx); top: calc(var(--safe-t) + 380px); font-size: calc(124px * var(--type)); padding: 26px 32px; }
      [data-format="vertical"] #t1-stat-odo .label { left: var(--cx); width: calc(var(--w) - var(--safe-l) - var(--safe-r)); bottom: auto; top: calc(var(--safe-t) + 540px); }
      [data-format="square"] #t1-stat-odo .kicker { left: var(--cx); top: calc(var(--safe-t) + 150px); }
      [data-format="square"] #t1-stat-odo .odo { left: var(--cx); top: calc(var(--safe-t) + 360px); font-size: 190px; padding: 30px 38px; }
      [data-format="square"] #t1-stat-odo .label { left: var(--cx); width: calc(var(--w) - var(--safe-l) - var(--safe-r)); bottom: auto; top: calc(var(--safe-t) + 560px); }
      [data-format="vertical"] #t1-stat-odo .source, [data-format="square"] #t1-stat-odo .source { left: var(--cx); bottom: var(--safe-b); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="t1-stat-odo" data-composition-id="t1-stat-odo" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">TOTAL COUNTED</div>
      <div class="odo"><span class="clip" data-slot="stat">48,902</span></div>
      <div class="label" data-slot="label">hours of footage logged <em>this year alone</em></div>
      <div class="source" data-slot="source">SOURCE · INTERNAL DATA</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-stat-odo .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-stat-odo .kicker", { autoAlpha: 0, y: -18, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-stat-odo .odo", { autoAlpha: 0, scale: 0.82, duration: 0.4, ease: "back.out(1.8)" }, 0.32)
        .from("#t1-stat-odo .odo .clip", { clipPath: "inset(0 100% 0 0)", duration: 0.6, ease: "steps(7)" }, 0.48)
        .from("#t1-stat-odo .label", { autoAlpha: 0, y: 22, duration: 0.45, ease: "power3.out" }, 1.0)
        .from("#t1-stat-odo .source", { autoAlpha: 0, duration: 0.3 }, 1.3)
        .set({}, {}, 6);
      window.__timelines["t1-stat-odo"] = tl;
    </script>
  </body>
</html>
