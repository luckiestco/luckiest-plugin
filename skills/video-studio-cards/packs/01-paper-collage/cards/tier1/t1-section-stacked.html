<!doctype html>
<!--
  PAPER COLLAGE · tier1 · section · STACKED
  Giant multi-line serif title filling the frame, mixed weights per line, one
  keyword sitting over a yellow circle. Type-dominant, minimal.
  Slots: line1, line2, line3, keyword (sits in the circle), source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-stacked {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-stacked .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
        opacity: 0.6;
      }
      #t1-sec-stacked .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.38; pointer-events: none;
      }
      #t1-sec-stacked .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 120% at 50% 50%, transparent 56%, rgba(23,19,14,0.15) 100%);
      }
      #t1-sec-stacked .stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #t1-sec-stacked .title { position: absolute; left: calc(var(--safe-l) + 54px); top: calc(var(--safe-t) + 196px); width: 1620px; }
      #t1-sec-stacked .line { display: block; line-height: 0.94; letter-spacing: var(--track-tight); overflow: hidden; }
      #t1-sec-stacked .l1 { font-weight: var(--wt-thin); font-size: calc(150px * var(--type)); }
      #t1-sec-stacked .l2 { font-weight: var(--wt-black); font-style: italic; font-size: calc(176px * var(--type)); }
      #t1-sec-stacked .l3 { font-weight: var(--wt-thin); font-size: calc(150px * var(--type)); }
      #t1-sec-stacked .l1 span, #t1-sec-stacked .l2 span, #t1-sec-stacked .l3 span { display: inline-block; }
      /* keyword over a circle */
      #t1-sec-stacked .key {
        position: absolute; left: calc(var(--safe-l) + 1034px); top: calc(var(--safe-t) + 416px); z-index: 3;
        font-weight: var(--wt-black); font-style: italic; font-size: calc(176px * var(--type)); color: var(--ink);
      }
      #t1-sec-stacked .circle {
        position: absolute; left: calc(var(--safe-l) + 994px); top: calc(var(--safe-t) + 376px); width: 340px; height: 340px;
        background: var(--yellow); border-radius: 50%; z-index: 1;
      }
      #t1-sec-stacked .source {
        position: absolute; left: calc(var(--safe-l) + 54px); bottom: calc(var(--safe-b) + 42px); z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      #t1-sec-stacked .rule { position: absolute; left: calc(var(--safe-l) + 54px); bottom: calc(var(--safe-b) + 96px); width: 0; height: 6px; background: var(--red); z-index: 3; }

      /* Vertical and square: the three lines stack from the top of the safe area, the keyword
         circle sits under them (right of center), rule and source at the safe bottom. */
      [data-format="vertical"] #t1-sec-stacked .stage { transform-origin: 46% 40%; }
      /* text keeps ~28px clear of the safe edges because the stage zooms 4% toward its origin */
      [data-format="vertical"] #t1-sec-stacked .title, [data-format="square"] #t1-sec-stacked .title { left: calc(var(--safe-l) + 28px); top: calc(var(--safe-t) + 24px); width: calc(var(--w) - var(--safe-l) - var(--safe-r) - 56px); }
      [data-format="vertical"] #t1-sec-stacked .l1, [data-format="vertical"] #t1-sec-stacked .l3 { font-size: calc(124px * var(--type)); }
      [data-format="vertical"] #t1-sec-stacked .l2 { font-size: calc(128px * var(--type)); }
      [data-format="square"] #t1-sec-stacked .l1, [data-format="square"] #t1-sec-stacked .l3 { font-size: 124px; }
      [data-format="square"] #t1-sec-stacked .l2 { font-size: 144px; }
      [data-format="vertical"] #t1-sec-stacked .circle { left: calc(var(--safe-l) + 330px); top: calc(var(--safe-t) + 500px); }
      [data-format="vertical"] #t1-sec-stacked .key { left: calc(var(--safe-l) + 370px); top: calc(var(--safe-t) + 540px); font-size: calc(146px * var(--type)); }
      [data-format="square"] #t1-sec-stacked .circle { left: calc(var(--safe-l) + 540px); top: calc(var(--safe-t) + 420px); width: 300px; height: 300px; }
      [data-format="square"] #t1-sec-stacked .key { left: calc(var(--safe-l) + 570px); top: calc(var(--safe-t) + 450px); font-size: 150px; }
      [data-format="vertical"] #t1-sec-stacked .source, [data-format="square"] #t1-sec-stacked .source { left: calc(var(--safe-l) + 28px); bottom: calc(var(--safe-b) + 28px); }
      [data-format="vertical"] #t1-sec-stacked .rule, [data-format="square"] #t1-sec-stacked .rule { left: calc(var(--safe-l) + 28px); bottom: calc(var(--safe-b) + 82px); }
    </style>
  </head>
  <body>
    <div id="t1-sec-stacked" data-composition-id="t1-sec-stacked" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="stage">
        <div class="circle"></div>
        <div class="title">
          <span class="line l1"><span data-slot="line1">The quiet</span></span>
          <span class="line l2"><span data-slot="line2">collapse</span></span>
          <span class="line l3"><span data-slot="line3">of trust</span></span>
        </div>
        <div class="key" data-slot="keyword">now</div>
        <div class="rule"></div>
        <div class="source" data-slot="source">A PAPER COLLAGE</div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#t1-sec-stacked .stage", { scale: 1.0 }, { scale: 1.04, duration: 6, ease: "none" }, 0);
      tl.fromTo("#t1-sec-stacked .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 150px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-stacked .l1 span", { yPercent: 110, duration: 0.5, ease: "power4.out" }, 0.2)
        .from("#t1-sec-stacked .l2 span", { yPercent: 110, duration: 0.5, ease: "power4.out" }, 0.34)
        .from("#t1-sec-stacked .l3 span", { yPercent: 110, duration: 0.5, ease: "power4.out" }, 0.48)
        .from("#t1-sec-stacked .circle", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%", duration: 0.45, ease: "back.out(2.2)" }, 0.6)
        .from("#t1-sec-stacked .key", { autoAlpha: 0, scale: 0.6, rotate: -8, duration: 0.4, ease: "back.out(2.4)" }, 0.72)
        .to("#t1-sec-stacked .rule", { width: 360, duration: 0.5, ease: "power2.out" }, 0.9)
        .from("#t1-sec-stacked .source", { autoAlpha: 0, duration: 0.3 }, 1.1);
      window.__timelines["t1-sec-stacked"] = tl;
    </script>
  </body>
</html>
