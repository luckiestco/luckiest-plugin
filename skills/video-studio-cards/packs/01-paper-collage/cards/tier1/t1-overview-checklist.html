<!doctype html>
<!--
  PAPER COLLAGE · tier1 · overview · CHECKLIST
  "In this video" checklist of 5 items. Each row has a square checkbox that
  gets a yellow check mark STAMPED in (scale + steps) as the row appears.
  Marker title at top.
  Slots: title, item1, item2, item3, item4, item5, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-check {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-ov-check .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-ov-check .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4;
        pointer-events: none; z-index: 6;
      }
      #t1-ov-check .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(130% 120% at 50% 50%, transparent 60%, rgba(23,19,14,0.14) 100%);
      }

      /* marker title */
      #t1-ov-check .title {
        position: absolute; top: calc(var(--safe-t) + 26px); left: 50%; transform: translateX(-50%) skewX(var(--marker-skew));
        background: var(--yellow); padding: 8px 32px; z-index: 3;
        font-weight: var(--wt-black); font-size: var(--size-title);
        letter-spacing: var(--track-tight); text-transform: uppercase; white-space: nowrap;
      }

      /* checklist */
      #t1-ov-check .list {
        position: absolute; top: calc(var(--safe-t) + 176px); left: 50%; transform: translateX(-50%);
        width: 1300px; display: flex; flex-direction: column; gap: 0; z-index: 3;
      }
      #t1-ov-check .item {
        display: flex; align-items: center; gap: 48px;
        padding: 26px 0; border-bottom: 2px solid rgba(23,19,14,0.10);
      }
      #t1-ov-check .item:first-child { border-top: 2px solid rgba(23,19,14,0.10); }

      /* square checkbox */
      #t1-ov-check .box {
        flex: 0 0 72px; width: 72px; height: 72px;
        border: 5px solid var(--ink); background: var(--paper-2);
        position: relative; box-shadow: 4px 4px 0 rgba(23,19,14,0.12);
        display: flex; align-items: center; justify-content: center;
      }
      /* checkmark glyph - stamped via GSAP */
      #t1-ov-check .check {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: var(--font-label); font-weight: var(--wt-black);
        font-size: calc(52px * var(--type)); color: var(--ink); line-height: 1;
        transform: scale(0); opacity: 0;
      }
      /* yellow fill behind the check */
      #t1-ov-check .check::before {
        content: "";
        position: absolute; inset: 4px;
        background: var(--yellow); z-index: -1;
      }

      #t1-ov-check .label {
        flex: 1; font-weight: var(--wt-black); font-size: calc(52px * var(--type));
        letter-spacing: var(--track-tight); line-height: 1.05; color: var(--ink);
      }

      #t1-ov-check .source {
        position: absolute; left: calc(var(--safe-l) + 34px); bottom: calc(var(--safe-b) + 34px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted); z-index: 3;
      }

      /* Vertical and square: title centred on the safe box, list spans the safe width with smaller
         wrapping labels, source at the bottom left of the safe area. */
      [data-format="vertical"] #t1-ov-check .title, [data-format="square"] #t1-ov-check .title {
        top: var(--safe-t); left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2);
        width: max-content; max-width: calc(var(--w) - var(--safe-l) - var(--safe-r) - 64px);
        white-space: normal; text-align: center;
      }
      [data-format="vertical"] #t1-ov-check .title { font-size: calc(64px * var(--type)); }
      [data-format="vertical"] #t1-ov-check .list, [data-format="square"] #t1-ov-check .list {
        left: var(--safe-l); right: var(--safe-r); width: auto; transform: none;
      }
      [data-format="vertical"] #t1-ov-check .list { top: calc(var(--safe-t) + 150px); }
      [data-format="square"] #t1-ov-check .list { top: calc(var(--safe-t) + 150px); }
      [data-format="vertical"] #t1-ov-check .item, [data-format="square"] #t1-ov-check .item { gap: 32px; padding: 26px 0; }
      [data-format="vertical"] #t1-ov-check .box, [data-format="square"] #t1-ov-check .box { flex-basis: 60px; width: 60px; height: 60px; }
      [data-format="vertical"] #t1-ov-check .check { font-size: calc(40px * var(--type)); }
      [data-format="square"] #t1-ov-check .check { font-size: 44px; }
      [data-format="vertical"] #t1-ov-check .label { font-size: calc(42px * var(--type)); }
      [data-format="square"] #t1-ov-check .label { font-size: 44px; }
      [data-format="vertical"] #t1-ov-check .source, [data-format="square"] #t1-ov-check .source { left: var(--safe-l); bottom: var(--safe-b); }
    </style>
  </head>
  <body>
    <div id="t1-ov-check" data-composition-id="t1-ov-check" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>

      <div class="title" data-slot="title">IN THIS VIDEO</div>

      <div class="list">
        <div class="item i1">
          <div class="box"><div class="check ck1">&#10003;</div></div>
          <div class="label" data-slot="item1">Why this problem keeps getting worse</div>
        </div>
        <div class="item i2">
          <div class="box"><div class="check ck2">&#10003;</div></div>
          <div class="label" data-slot="item2">The hidden forces driving the change</div>
        </div>
        <div class="item i3">
          <div class="box"><div class="check ck3">&#10003;</div></div>
          <div class="label" data-slot="item3">What the data actually shows</div>
        </div>
        <div class="item i4">
          <div class="box"><div class="check ck4">&#10003;</div></div>
          <div class="label" data-slot="item4">Who wins and who loses</div>
        </div>
        <div class="item i5">
          <div class="box"><div class="check ck5">&#10003;</div></div>
          <div class="label" data-slot="item5">How to position yourself for what's ahead</div>
        </div>
      </div>

      <div class="source" data-slot="source">SOURCE · VIDEO AUTOMATION 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker - finite steps
      tl.fromTo("#t1-ov-check .grain",
        { backgroundPosition: "0px 0px" },
        { backgroundPosition: "140px 120px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // title snaps in from center
      tl.from("#t1-ov-check .title",
        { autoAlpha: 0, scaleX: 0, transformOrigin: "center center", duration: 0.38, ease: "power3.out" }, 0.1);

      // items + check stamps - staggered
      var items = [".i1", ".i2", ".i3", ".i4", ".i5"];
      var checks = [".ck1", ".ck2", ".ck3", ".ck4", ".ck5"];
      for (var i = 0; i < items.length; i++) {
        var startT = 0.55 + i * 0.28;
        // row slides in from left
        tl.from("#t1-ov-check " + items[i],
          { autoAlpha: 0, x: -60, duration: 0.35, ease: "back.out(1.6)" }, startT);
        // check mark stamps in with steps ease (stamp feel)
        tl.to("#t1-ov-check " + checks[i],
          { scale: 1, autoAlpha: 1, duration: 0.22, ease: "steps(3)" }, startT + 0.18);
      }

      tl.from("#t1-ov-check .source", { autoAlpha: 0, duration: 0.3 }, 2.1);

      // hold at 7s
      tl.set({}, {}, 7);

      window.__timelines["t1-ov-check"] = tl;
    </script>
  </body>
</html>
