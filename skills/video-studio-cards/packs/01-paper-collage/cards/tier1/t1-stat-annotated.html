<!doctype html>
<!--
  PAPER COLLAGE · tier1 · stat · ANNOTATED FIGURE
  A big central number with 2–3 qualifier labels arranged around it, each
  connected by a short STATIC tick/leader line (thin, no arrowheads). Like a
  labeled diagram of the figure. Lines draw in via scaleX/scaleY; labels fade.
  Slots: kicker, stat, note1, note2, note3, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-stat-annot {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-stat-annot .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-stat-annot .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 6;
      }
      #t1-stat-annot .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(120% 120% at 50% 50%, transparent 50%, rgba(23,19,14,0.2) 100%);
      }

      /* kicker */
      #t1-stat-annot .kicker {
        position: absolute; left: calc(var(--safe-l) + 34px); top: calc(var(--safe-t) + 166px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--red);
      }

      /* big stat - dead center */
      #t1-stat-annot .stat {
        position: absolute; left: calc(var(--safe-l) + (var(--w) - var(--safe-l) - var(--safe-r)) / 2); top: calc(var(--safe-t) + (var(--h) - var(--safe-t) - var(--safe-b)) / 2); transform: translate(-50%, -50%);
        font-weight: var(--wt-black); font-size: calc(480px * var(--type)); line-height: 1;
        letter-spacing: -0.06em; color: var(--ink);
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }

      /* ── annotation nodes ────────────────────────────────────────────────── */
      /* Each .annot is positioned absolutely. It contains a leader line + label.
         Lines are thin 2px ink strokes, no arrowheads.                         */
      .annot {
        position: absolute; z-index: 3;
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: calc(28px * var(--type)); letter-spacing: var(--track-wide); text-transform: uppercase;
        color: var(--ink); display: flex; align-items: center; gap: 0;
      }
      /* line element inside each annot */
      .annot .line {
        display: block; height: 2px; background: var(--ink); flex-shrink: 0;
        transform-origin: left center;
      }
      /* label sits next to the line, small tick cap at junction */
      .annot .tick {
        display: block; width: 2px; height: 14px; background: var(--ink); flex-shrink: 0;
      }
      .annot .note-text {
        display: block; padding: 0 10px;
        background: var(--yellow); color: var(--ink);
        line-height: 1.4;
      }

      /* note 1 - upper left: horizontal line extends right toward stat */
      #t1-stat-annot .annot-1 {
        left: calc(var(--safe-l) + 34px); top: calc(var(--safe-t) + 210px);
        flex-direction: row;
      }
      #t1-stat-annot .annot-1 .line { width: 320px; }
      #t1-stat-annot .annot-1 .tick { transform-origin: center top; }

      /* note 2 - lower left: goes up+right via two segments (pure CSS, two divs) */
      #t1-stat-annot .annot-2 {
        left: calc(var(--safe-l) + 34px); bottom: calc(var(--safe-b) + 216px);
        flex-direction: row;
      }
      #t1-stat-annot .annot-2 .line { width: 280px; }

      /* note 3 - right side: horizontal line extends left toward stat */
      #t1-stat-annot .annot-3 {
        right: calc(var(--safe-r) + 34px); top: calc(var(--safe-t) + (var(--h) - var(--safe-t) - var(--safe-b)) / 2); transform: translateY(-50%);
        flex-direction: row-reverse; /* line goes left */
      }
      #t1-stat-annot .annot-3 .line {
        width: 260px; transform-origin: right center;
      }

      /* source */
      #t1-stat-annot .source {
        position: absolute; left: calc(var(--safe-l) + 34px); bottom: calc(var(--safe-b) + 42px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
        z-index: 4;
      }

      /* Vertical and square: number centered in the safe box with note 1 above it and notes 2
         and 3 on their own rows below it (note 3 right-aligned, its line still reaching left). */
      [data-format="vertical"] #t1-stat-annot .kicker, [data-format="square"] #t1-stat-annot .kicker { left: var(--safe-l); top: var(--safe-t); }
      [data-format="vertical"] #t1-stat-annot .stat { font-size: calc(300px * var(--type)); }
      [data-format="square"] #t1-stat-annot .stat { font-size: 400px; }
      [data-format="vertical"] #t1-stat-annot .annot-1, [data-format="square"] #t1-stat-annot .annot-1 { left: var(--safe-l); }
      [data-format="vertical"] #t1-stat-annot .annot-1 { top: calc(var(--safe-t) + 112px); }
      [data-format="square"] #t1-stat-annot .annot-1 { top: calc(var(--safe-t) + 90px); }
      [data-format="vertical"] #t1-stat-annot .annot-1 .line, [data-format="square"] #t1-stat-annot .annot-1 .line { width: 200px; }
      [data-format="vertical"] #t1-stat-annot .annot-2, [data-format="square"] #t1-stat-annot .annot-2 { left: var(--safe-l); bottom: auto; }
      [data-format="vertical"] #t1-stat-annot .annot-2 { top: calc(var(--safe-t) + 700px); }
      [data-format="square"] #t1-stat-annot .annot-2 { top: calc(var(--safe-t) + 690px); }
      [data-format="vertical"] #t1-stat-annot .annot-2 .line, [data-format="square"] #t1-stat-annot .annot-2 .line { width: 200px; }
      [data-format="vertical"] #t1-stat-annot .annot-3, [data-format="square"] #t1-stat-annot .annot-3 { right: var(--safe-r); transform: none; }
      [data-format="vertical"] #t1-stat-annot .annot-3 { top: calc(var(--safe-t) + 780px); }
      [data-format="square"] #t1-stat-annot .annot-3 { top: calc(var(--safe-t) + 760px); }
      [data-format="vertical"] #t1-stat-annot .annot-3 .line, [data-format="square"] #t1-stat-annot .annot-3 .line { width: 200px; }
      [data-format="vertical"] #t1-stat-annot .source, [data-format="square"] #t1-stat-annot .source { left: var(--safe-l); bottom: var(--safe-b); }
    </style>

  </head>
  <body>
    <div id="t1-stat-annot" data-composition-id="t1-stat-annot" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">THE NUMBER</div>

      <div class="stat" data-slot="stat">4.7B</div>

      <!-- annotation 1: upper-left -->
      <div class="annot annot-1">
        <span class="note-text" data-slot="note1">active users</span>
        <span class="tick"></span>
        <span class="line"></span>
      </div>

      <!-- annotation 2: lower-left -->
      <div class="annot annot-2">
        <span class="note-text" data-slot="note2">daily sessions</span>
        <span class="tick"></span>
        <span class="line"></span>
      </div>

      <!-- annotation 3: right -->
      <div class="annot annot-3">
        <span class="line"></span>
        <span class="tick"></span>
        <span class="note-text" data-slot="note3">as of Q1 2026</span>
      </div>

      <div class="source" data-slot="source">SOURCE · PLATFORM DATA 2026</div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // grain flicker
      tl.fromTo("#t1-stat-annot .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);

      // kicker
      tl.from("#t1-stat-annot .kicker", { autoAlpha: 0, x: -20, duration: 0.3, ease: "steps(4)" }, 0.2);

      // big stat slams in
      tl.from("#t1-stat-annot .stat", {
        autoAlpha: 0, scale: 0.72, duration: 0.42, ease: "back.out(2.2)", transformOrigin: "50% 50%"
      }, 0.35);

      // annotation 1: note text fades first, then line draws outward from note toward center
      tl.from("#t1-stat-annot .annot-1 .note-text", { autoAlpha: 0, x: -12, duration: 0.25, ease: "steps(4)" }, 0.68);
      tl.from("#t1-stat-annot .annot-1 .tick",      { autoAlpha: 0, scaleY: 0, transformOrigin: "top center", duration: 0.15 }, 0.88);
      tl.from("#t1-stat-annot .annot-1 .line",      { scaleX: 0, transformOrigin: "left center", duration: 0.28, ease: "power2.out" }, 0.9);

      // annotation 2
      tl.from("#t1-stat-annot .annot-2 .note-text", { autoAlpha: 0, x: -12, duration: 0.25, ease: "steps(4)" }, 0.82);
      tl.from("#t1-stat-annot .annot-2 .tick",      { autoAlpha: 0, scaleY: 0, transformOrigin: "top center", duration: 0.15 }, 1.02);
      tl.from("#t1-stat-annot .annot-2 .line",      { scaleX: 0, transformOrigin: "left center", duration: 0.28, ease: "power2.out" }, 1.04);

      // annotation 3 (right side - line origin is right)
      tl.from("#t1-stat-annot .annot-3 .note-text", { autoAlpha: 0, x: 12, duration: 0.25, ease: "steps(4)" }, 0.96);
      tl.from("#t1-stat-annot .annot-3 .tick",      { autoAlpha: 0, scaleY: 0, transformOrigin: "top center", duration: 0.15 }, 1.16);
      tl.from("#t1-stat-annot .annot-3 .line",      { scaleX: 0, transformOrigin: "right center", duration: 0.28, ease: "power2.out" }, 1.18);

      // source
      tl.from("#t1-stat-annot .source", { autoAlpha: 0, duration: 0.3 }, 1.5);

      tl.set({}, {}, 6);
      window.__timelines["t1-stat-annot"] = tl;
    </script>
  </body>
</html>
