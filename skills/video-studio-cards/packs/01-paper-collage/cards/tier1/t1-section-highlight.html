<!doctype html>
<!--
  PAPER COLLAGE · tier1 · section · HIGHLIGHT
  Plain ink title; a yellow highlighter marker sweeps across the key phrase (the
  hero move). Minimal paper + grid.
  Slots: kicker, pre, key (highlighted phrase), post, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="cards/paper-collage/tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-sec-hl {
        position: absolute; inset: 0; width: var(--w); height: var(--h);
        background: var(--paper); color: var(--ink);
        font-family: var(--font-display); overflow: hidden;
      }
      #t1-sec-hl .grid {
        position: absolute; inset: -2px;
        background-image:
          repeating-linear-gradient(0deg,  var(--grid-line) 0 1px, transparent 1px var(--grid-size)),
          repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--grid-size));
      }
      #t1-sec-hl .grain {
        position: absolute; inset: -40px; background: var(--tex-grain);
        background-size: 180px 180px; mix-blend-mode: multiply; opacity: 0.4; pointer-events: none; z-index: 5;
      }
      #t1-sec-hl .kicker {
        position: absolute; left: calc(var(--safe-l) + 54px); top: calc(var(--safe-t) + 286px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-label); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }
      #t1-sec-hl .headline {
        position: absolute; left: calc(var(--safe-l) + 54px); top: calc(var(--safe-t) + 346px); width: 1500px;
        font-weight: var(--wt-thin); font-size: calc(144px * var(--type)); line-height: 1.04;
        letter-spacing: var(--track-tight); color: var(--ink);
      }
      #t1-sec-hl .hl { position: relative; font-weight: var(--wt-black); white-space: nowrap; }
      #t1-sec-hl .hl .sweep {
        position: absolute; left: -10px; right: -10px; top: 14%; bottom: 6%;
        background: var(--yellow); transform-origin: left center; z-index: -1;
      }
      #t1-sec-hl .source {
        position: absolute; left: calc(var(--safe-l) + 54px); bottom: calc(var(--safe-b) + 42px);
        font-family: var(--font-label); font-weight: var(--wt-bold);
        font-size: var(--size-tiny); letter-spacing: var(--track-wide);
        text-transform: uppercase; color: var(--muted);
      }

      /* Vertical and square: kicker and headline across the safe width (the highlighted phrase
         stays on one line, so the type shrinks to fit), source at the safe bottom. */
      [data-format="vertical"] #t1-sec-hl .kicker, [data-format="square"] #t1-sec-hl .kicker { left: var(--safe-l); }
      [data-format="vertical"] #t1-sec-hl .headline, [data-format="square"] #t1-sec-hl .headline { left: var(--safe-l); width: calc(var(--w) - var(--safe-l) - var(--safe-r)); }
      [data-format="vertical"] #t1-sec-hl .kicker { top: calc(var(--safe-t) + 330px); }
      [data-format="vertical"] #t1-sec-hl .headline { top: calc(var(--safe-t) + 390px); font-size: calc(96px * var(--type)); }
      [data-format="square"] #t1-sec-hl .kicker { top: calc(var(--safe-t) + 200px); }
      [data-format="square"] #t1-sec-hl .headline { top: calc(var(--safe-t) + 260px); font-size: 120px; }
      [data-format="vertical"] #t1-sec-hl .source, [data-format="square"] #t1-sec-hl .source { left: var(--safe-l); bottom: var(--safe-b); }
    </style>
  </head>
  <body>
    <div id="t1-sec-hl" data-composition-id="t1-sec-hl" data-start="0" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="kicker" data-slot="kicker">THE POINT</div>
      <div class="headline">
        <span data-slot="pre">It all comes down to</span>
        <span class="hl"><span class="sweep"></span><span data-slot="key">one number</span></span><span data-slot="post">.</span>
      </div>
      <div class="source" data-slot="source">A PAPER COLLAGE</div>
      <div class="grain"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#t1-sec-hl .hl .sweep", { scaleX: 0 }); // was a CSS transform; GSAP owns it now
      tl.fromTo("#t1-sec-hl .grain", { backgroundPosition: "0px 0px" },
                { backgroundPosition: "150px 130px", duration: 0.5, ease: "steps(4)", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-sec-hl .kicker", { autoAlpha: 0, x: -22, duration: 0.3, ease: "steps(4)" }, 0.2)
        .from("#t1-sec-hl .headline", { autoAlpha: 0, y: 26, duration: 0.5, ease: "power3.out" }, 0.32)
        .to("#t1-sec-hl .hl .sweep", { scaleX: 1, duration: 0.42, ease: "steps(5)" }, 0.95)
        .from("#t1-sec-hl .source", { autoAlpha: 0, duration: 0.3 }, 1.2)
        .set({}, {}, 6);
      window.__timelines["t1-sec-hl"] = tl;
    </script>
  </body>
</html>
